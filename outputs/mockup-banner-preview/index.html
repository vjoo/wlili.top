<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mockup-banner 板块预览（cases 真实 render.js）</title>
<link rel="stylesheet" href="../../portfolio/cases/_shared/site-shell.css">
<link rel="stylesheet" href="../../portfolio/cases/_shared/components.css">
<style>
  body { background: #0b0c0f; }
  .tip {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 99;
    max-width: 380px; padding: .75rem 1rem; border-radius: 14px;
    background: rgba(18,20,26,.92); border: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.78); font-size: 12px; line-height: 1.7;
    backdrop-filter: blur(8px);
  }
  .tip b { color: #fff; font-weight: 600; }
  .tip code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div id="case-content"></div>

<div class="tip">
  <b>第 1 屏</b>：手机 ×2 · 间距 −60 重叠 + B 台前移 40px（一前一后）· 镜像错落 30px · 标题<b>在手机后方</b>居左<br>
  <b>第 2 屏</b>：笔记本 · 标题<b>在手机前方</b>居中（演示遮挡）· 舞台居中<br>
  向下滚动，滚进视口 45% 时<b>各播一次</b>整圈旋转进场，不重复。
</div>

<script>
/* 本预览直接用项目真实的 render.js 渲染，数据用下面这份内联 JSON 顶替 fetch（可 file:// 直接打开） */
window.__PREVIEW_DATA = {
  sections: [
    {
      id: 'mk-phones', type: 'mockup-banner', device: 'phone',
      phones: [
        { ui: '../img/门卡列表-2.png', startRx: '22', startRy: '-22', startTy: '480', endRx: '8', endRy: '-22', endTy: '0',   z: '0' },
        { ui: '../img/门卡列表-2.png', startRx: '22', startRy: '22',  startTy: '480', endRx: '8', endRy: '22',  endTy: '-30', z: '40' }
      ],
      abGap: '-60', spins: '1', dur: '4200',
      bgType: 'theme',
      title: '全民门卡',
      subtitle: '一个 App，管理你所有的门禁卡片。重叠双机 + 一前一后景深，标题在手机后方更有层次。',
      titleZ: 'behind', titleAlign: 'left',
      stagePos: 'right', stageSize: '600', globalZoom: '0.85'
    },
    {
      id: 'mk-laptop', type: 'mockup-banner', device: 'laptop',
      lapUi: '../img/门卡列表-2.png',
      lapStartRx: '30', lapStartRy: '-24', lapStartTy: '480',
      lapEndRx: '16',   lapEndRy: '-24',   lapEndTy: '0',
      spins: '1', dur: '4200',
      bgType: 'color', bgColor: '#101319',
      title: '多端同步',
      subtitle: '标题在设备前方（z-index 5），与设备重叠时标题压在设备上 —— 这是「遮挡关系」的另一种解法。',
      titleZ: 'front', titleAlign: 'center',
      stagePos: 'center', stageSize: '660', globalZoom: '0.8'
    }
  ]
};
/* 顶替 fetch：render.js 内部 fetch('content.json')，本地 file:// 打开时也能拿到数据 */
window.fetch = function () {
  return Promise.resolve({
    ok: true, status: 200,
    json: function () { return Promise.resolve(window.__PREVIEW_DATA); }
  });
};
</script>
<script src="../../portfolio/cases/_shared/render.js"></script>
</body>
</html>
