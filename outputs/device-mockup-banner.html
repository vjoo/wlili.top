<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>样机组件（生产版 · 配置驱动）</title>
<style>
  :root{
    --banner-radius:25px;
    --banner-pad:.75rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0f12}

  /* ===== 前台最终呈现：大 banner 首屏同尺寸同样式（背景+标题+手机三层合成） ===== */
  .banner-frame{position:relative;width:100%;max-width:1440px;height:min(76vh,720px);margin:0 auto;
    border-radius:var(--banner-radius);padding:var(--banner-pad);box-sizing:border-box;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%,#1c1f25 0%,#0c0d10 60%);
    display:block}
  .bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
  /* 标题 / 副标题（可居左 / 居中，可在手机前方 / 后方） */
  .text-block{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    gap:14px;padding:0 7%;z-index:3;pointer-events:none}
  .text-block.align-left{align-items:flex-start;text-align:left}
  .text-block.align-center{align-items:center;text-align:center}
  .title{font-size:clamp(28px,5vw,56px);font-weight:700;line-height:1.1;color:#fff;margin:0;
    text-shadow:0 2px 24px rgba(0,0,0,.45)}
  .subtitle{font-size:clamp(14px,2.2vw,20px);font-weight:400;color:rgba(255,255,255,.82);margin:0;
    text-shadow:0 1px 14px rgba(0,0,0,.45);max-width:32ch;line-height:1.55}
  /* 手机动画视窗（方形，可在屏幕左 / 中 / 右） */
  .phone-stage{position:absolute;z-index:2;width:560px;height:560px;max-width:90vw;aspect-ratio:1;
    display:flex;align-items:center;justify-content:center}
  .phone-stage.pos-left{left:4%;right:auto;top:50%;transform:translateY(-50%)}
  .phone-stage.pos-center{left:50%;right:auto;top:50%;transform:translate(-50%,-50%)}
  .phone-stage.pos-right{right:4%;left:auto;top:50%;transform:translateY(-50%)}

  /* ===== 舞台（手机动画方形视窗内部） ===== */
  .viewport{perspective:1200px;perspective-origin:50% 40%;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .rig{transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}

  /* ===== 手机：前面+后面双层（真实挤出体侧壁） ===== */
  .phone-row{position:relative;transform-style:preserve-3d}
  .phone{position:absolute;top:0;width:250px;height:520px;transform-style:preserve-3d}
  .face-front,.face-back{position:absolute;inset:0;border-radius:42px;transform-style:preserve-3d;
    will-change:transform}
  .face-front{transform:translateZ(9px);
    background:linear-gradient(150deg,#3a3d44,#15171b);padding:9px;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.5),
      inset 0 0 0 1px rgba(0,0,0,.4),0 25px 50px -15px rgba(0,0,0,.55)}
  .screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#000;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.8);will-change:transform}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:94px;height:27px;
    background:#000;border-radius:100px;z-index:6}
  .island::after{content:"";position:absolute;right:11px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a55,#0a0e16)}
  .gloss{position:absolute;inset:0;border-radius:34px;pointer-events:none;z-index:7;
    background:linear-gradient(125deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 34%)}
  .face-back{transform:translateZ(-9px);
    background:linear-gradient(150deg,#3c3f47,#191b1f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(0,0,0,.4)}
  .cam{position:absolute;top:18px;left:18px;width:80px;height:80px;border-radius:22px;
    background:linear-gradient(150deg,#23262c,#0d0e11);
    box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
  .cam .lens{position:absolute;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3a4a63,#05070b);box-shadow:inset 0 0 0 2px #1b1e24}
  .cam .lens.a{top:12px;left:12px}.cam .lens.b{top:12px;right:12px}.cam .lens.c{top:42px;left:27px}
  .cam .flash{position:absolute;top:46px;right:16px;width:9px;height:9px;border-radius:50%;background:#f3e9c8}
  .wall{position:absolute;top:50%;left:50%;border-radius:3px;
    background:linear-gradient(180deg,#3c3f47,#191b1f);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);backface-visibility:visible}
  .btn-key{position:absolute;background:linear-gradient(180deg,#5a5e67,#2a2d33);box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .btn-power{right:-2.5px;top:148px;width:3px;height:78px;border-radius:0 2px 2px 0}
  .btn-vol-up{left:-2.5px;top:130px;width:3px;height:46px;border-radius:2px 0 0 2px}
  .btn-vol-down{left:-2.5px;top:188px;width:3px;height:46px;border-radius:2px 0 0 2px}
  .mute{position:absolute;left:-2.5px;top:88px;width:3px;height:24px;border-radius:2px 0 0 2px;
    background:linear-gradient(180deg,#5a5e67,#2a2d33);box-shadow:0 1px 2px rgba(0,0,0,.4)}
  /* 笔记本 */
  .laptop{position:relative;width:560px;height:360px;transform-style:preserve-3d;display:none}
  .lap-screen{position:absolute;top:0;left:50%;width:520px;height:330px;transform:translateX(-50%);transform-style:preserve-3d}
  .lap-front,.lap-back{position:absolute;inset:0;border-radius:14px;will-change:transform}
  .lap-front{transform:translateZ(8px);background:linear-gradient(150deg,#33363d,#0c0d10);padding:11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(0,0,0,.4)}
  .lap-back{transform:translateZ(-8px);background:linear-gradient(150deg,#3c3f47,#17191e);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
  .lap-screen-inner{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;background:#000;will-change:transform}
  .gloss-l{position:absolute;inset:0;border-radius:6px;pointer-events:none;z-index:6;
    background:linear-gradient(125deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 30%)}
  .lap-base{position:absolute;top:330px;left:50%;width:560px;height:18px;transform:translateX(-50%) rotateX(82deg);
    transform-origin:top center;background:linear-gradient(180deg,#2a2d33,#15171b);border-radius:0 0 14px 14px;
    box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
  .lap-base::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:6px;
    border-radius:0 0 6px 6px;background:#0c0d10}
  .lap-cam{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;
    background:#0a0b0d;box-shadow:inset 0 0 0 1px #2a2d33;z-index:5}
  .ui{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
</style>
</head>
<body>

  <!-- ===== 前台最终呈现（背景+标题+手机三层） ===== -->
  <div class="banner-frame" id="bannerFrame">
    <img class="bg-img" id="bgImg" alt="">
    <div class="text-block" id="textBlock">
      <h2 class="title" id="titleEl"></h2>
      <p class="subtitle" id="subEl"></p>
    </div>
    <div class="phone-stage" id="phoneStage">
      <div class="viewport" id="viewport">
        <div class="rig" id="rig">
          <div class="phone-row" id="phone-row"></div>
          <div class="laptop" id="dev-laptop">
            <div class="lap-screen">
              <div class="lap-back"></div>
              <div class="lap-front">
                <div class="lap-screen-inner">
                  <img class="ui" id="lapUi" alt="UI" style="object-fit:contain;background:#000">
                  <div class="lap-cam"></div>
                  <div class="gloss-l"></div>
                </div>
              </div>
            </div>
            <div class="lap-base"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* =========================================================================
   组件配置（改这里即可，无需动 HTML/CSS/JS 逻辑）
   - device: 'phone' | 'laptop'
   - phones[]: 台数由数组长度决定（1 或 2）；每台独立 ui / start / end（start=进场最初视角，end=停留静止视角）
       · rx/ry = 旋转角(deg)；ty = 升降高度(px，负值=从下方升起)；z = 前后景深(px，正=更靠前)
   - spins: 绕 Y 整圈数（0=不转，0.5=半圈，1=转一圈，最多 3）
   - dur: 进场时长(ms)
   - abGap: 2 台时 A·B 水平间距(px，负=重叠)
   - bg: 背景（theme=主题渐变 / color=纯色 / image=图片 dataURL 或路径）
   - title: 标题文字、是否盖在手机前方(front)/后方(behind)、对齐(center/left)
   - stage: 手机方形视窗位置(left/center/right)、大小(px)
   - globalZoom: 全局缩放(0.3~1.5)，缩小时把因高低偏移超出框的手机收进画面
   ========================================================================= */
  const CONFIG = {
    device: 'phone',
    phones: [
      { ui:'img/门卡列表-2.png',
        start:{rx:22, ry:-22, ty:480, z:0}, end:{rx:8,  ry:-22, ty:0, z:0} },
      // 第 2 台（删掉此项即变 1 台）。默认镜像第 1 台的 Y、终点错落由 ety 体现
      { ui:'img/门卡列表-2.png',
        start:{rx:22, ry: 22, ty:480, z:0}, end:{rx:8,  ry: 22, ty:-30, z:40} }
    ],
    laptop:{ ui:'img/门卡列表-2.png',
        start:{rx:30, ry:-24, ty:480, z:0}, end:{rx:16, ry:-24, ty:0, z:0} },
    spins:1,
    dur:4200,
    abGap:48,
    bg:{type:'theme', color:'#0c0d10', image:null},
    title:{text:'全民门卡', sub:'一个 App，管理你所有的门禁卡片', z:'behind', align:'left'},
    stage:{pos:'right', size:560},
    globalZoom:1
  };

  const vp=document.getElementById('viewport'), rig=document.getElementById('rig');
  const bannerFrame=document.getElementById('bannerFrame'), bgImg=document.getElementById('bgImg');
  const textBlock=document.getElementById('textBlock'), titleEl=document.getElementById('titleEl'), subEl=document.getElementById('subEl');
  const phoneStage=document.getElementById('phoneStage');
  const phoneCount=CONFIG.phones.length;
  const isLaptop=CONFIG.device==='laptop' && phoneCount===0;
  let introRAF=null, abGap=CONFIG.abGap, globalZoom=CONFIG.globalZoom;

  /* ===== 合成图层渲染 ===== */
  const THEME_BG='radial-gradient(120% 120% at 50% 0%,#1c1f25 0%,#0c0d10 60%)';
  function applyBg(){
    if(CONFIG.bg.type==='image' && CONFIG.bg.image){
      bannerFrame.style.background='#0c0d10'; bgImg.src=CONFIG.bg.image; bgImg.style.display='block';
    }else if(CONFIG.bg.type==='color'){
      bannerFrame.style.background=CONFIG.bg.color; bgImg.style.display='none';
    }else{ bannerFrame.style.background=THEME_BG; bgImg.style.display='none'; }
  }
  function applyCompose(){
    applyBg();
    titleEl.textContent=CONFIG.title.text; subEl.textContent=CONFIG.title.sub;
    textBlock.classList.toggle('align-center',CONFIG.title.align==='center');
    textBlock.classList.toggle('align-left',CONFIG.title.align==='left');
    textBlock.style.zIndex = CONFIG.title.z==='front' ? 5 : 1;   // 手机 stage 恒为 2
    phoneStage.classList.remove('pos-left','pos-center','pos-right');
    phoneStage.classList.add('pos-'+CONFIG.stage.pos);
    phoneStage.style.width=CONFIG.stage.size+'px';
  }
  function applyZoom(){ rig.style.transform=`scale(${globalZoom})`; }

  /* ===== 单位渲染：把某台/笔记本显示到某视角点 ===== */
  function renderUnit(idx,tab){
    if(isLaptop){ const P=CONFIG.laptop[tab];
      document.getElementById('dev-laptop').style.transform=`translateY(${P.ty}px) translateZ(${P.z}px) rotateX(${P.rx}deg) rotateY(${P.ry}deg)`; return; }
    const ph=document.querySelectorAll('#phone-row .phone')[idx]; if(!ph)return;
    const P=CONFIG.phones[idx][tab];
    ph.style.transform=`translateY(${P.ty}px) translateZ(${P.z}px) rotateX(${P.rx}deg) rotateY(${P.ry}deg)`;
  }
  function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

  /* rAF 逐帧写内联 transform（不走 CSS @keyframes，避免合成层压平 preserve-3d → 侧壁变纸片）。
     进场：每台从各自 start 旋转 spins 整圈 → 落定各自 end。播一次。不加 opacity（同样会压平 3D）。 */
  function playIntro(){
    if(introRAF)cancelAnimationFrame(introRAF);
    const t0=performance.now(), dur=CONFIG.dur, spins=CONFIG.spins;
    const units = isLaptop ? [CONFIG.laptop] : CONFIG.phones;
    function frame(now){
      let k=(now-t0)/dur; if(k>1)k=1;
      const e=easeInOutCubic(k), sc=0.92+(1-0.92)*e;
      units.forEach((U,i)=>{
        const S=U.start, E=U.end;
        const ry0=S.ry - spins*360, ry1=E.ry;
        const ty=S.ty+(E.ty-S.ty)*e, rxv=S.rx+(E.rx-S.rx)*e, ryv=ry0+(ry1-ry0)*e;
        const node = isLaptop ? document.getElementById('dev-laptop') : document.querySelectorAll('#phone-row .phone')[i];
        const z=E.z;
        if(node) node.style.transform=`translateY(${ty}px) translateZ(${z}px) rotateX(${rxv}deg) rotateY(${ryv}deg) scale(${sc})`;
      });
      if(k<1)introRAF=requestAnimationFrame(frame); else introRAF=null;
    }
    introRAF=requestAnimationFrame(frame);
  }

  /* ===== 生成外壳 ===== */
  function buildShell(sel,W,H,r,d,cn){
    document.querySelectorAll(sel).forEach(box=>{
      const frag=document.createDocumentFragment();
      const straightH=H-2*r, straightW=W-2*r, segLen=r*(Math.PI/2)/cn;
      function add(x,y,transform,w,h){
        const el=document.createElement('div'); el.className='wall';
        el.style.width=w+'px'; el.style.height=h+'px';
        el.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) ${transform}`;
        frag.appendChild(el);
      }
      add(W/2,0,'rotateY(90deg)',d,straightH); add(-W/2,0,'rotateY(90deg)',d,straightH);
      add(0,-H/2,'rotateX(90deg)',straightW,d); add(0,H/2,'rotateX(90deg)',straightW,d);
      const corners=[{cx:W/2-r,cy:-(H/2-r),a0:0,a1:-90},{cx:-(W/2-r),cy:-(H/2-r),a0:-90,a1:-180},
        {cx:-(W/2-r),cy:(H/2-r),a0:-180,a1:-270},{cx:(W/2-r),cy:(H/2-r),a0:-270,a1:-360}];
      corners.forEach(c=>{ for(let i=0;i<cn;i++){
        const aMid=c.a0+(c.a1-c.a0)*(i+0.5)/cn, a=aMid*Math.PI/180;
        add(c.cx+r*Math.cos(a), c.cy+r*Math.sin(a), `rotateZ(${aMid}deg) rotateY(90deg)`, d, segLen);
      }});
      box.insertBefore(frag,box.firstChild);
    });
  }
  function buildPhone(uiSrc){
    const el=document.createElement('div'); el.className='phone';
    el.innerHTML=`
      <div class="face-back"><div class="cam"><span class="lens a"></span><span class="lens b"></span><span class="lens c"></span><span class="flash"></span></div></div>
      <div class="face-front"><div class="screen"><img class="ui" src="${uiSrc}" alt="UI"><div class="island"></div><div class="gloss"></div></div></div>
      <span class="mute"></span><span class="btn-key btn-vol-up"></span><span class="btn-key btn-vol-down"></span><span class="btn-key btn-power"></span>`;
    return el;
  }
  function setPhoneCount(){
    const row=document.getElementById('phone-row'), W=250;
    row.style.width=(phoneCount===1?W:W*2+abGap)+'px'; row.style.height=W*2.08+'px'; row.innerHTML='';
    for(let i=0;i<phoneCount;i++){ const ph=buildPhone(CONFIG.phones[i].ui); ph.style.left=(i===0?0:i*(W+abGap))+'px'; row.appendChild(ph); }
    buildShell('#phone-row .phone',W,520,42,18,9);
    document.querySelectorAll('#phone-row .ui').forEach(img=>{ if(img.decode) img.decode().catch(()=>{}); });
  }

  /* ===== 初始化 ===== */
  if(isLaptop){
    document.getElementById('phone-row').style.display='none';
    document.getElementById('dev-laptop').style.display='block';
    document.getElementById('lapUi').src=CONFIG.laptop.ui;
    buildShell('#dev-laptop .lap-screen',520,330,14,16,6);
    if(CONFIG.laptop.ui && document.getElementById('lapUi').decode) document.getElementById('lapUi').decode().catch(()=>{});
  }else{
    setPhoneCount();
  }
  applyCompose();
  applyZoom();
  // 进场前先落在静态静止视角（避免未触发时错位）
  for(let i=0;i<(isLaptop?1:phoneCount);i++) renderUnit(i,'end');

  /* ===== 触发：滚进视口才播一次 ===== */
  let played=false;
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting && !played){ played=true; playIntro(); io.disconnect(); }
      });
    },{threshold:0.45});
    io.observe(bannerFrame);
  }else{ playIntro(); }
</script>
</body>
</html>
