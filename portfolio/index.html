    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;900&family=Great+Vibes&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-CjEoil4-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ytBOyWII.css">
    <style>
      body { background: #f5f5f8; margin: 0; }
      #root { background: transparent; }
      #hero-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #f5f5f8;
        display: flex; align-items: center; justify-content: center;
      }
      #hero-loader .spinner {
        width: 34px; height: 34px;
        border: 2px solid rgba(86,86,97,.12);
        border-top-color: #565661;
        border-radius: 50%;
        animation: hero-spin .7s linear infinite;
      }
      @keyframes hero-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="hero-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <script>
      (function () {
        var removed = false;

        function removeLoader() {
          if (removed) return;
          removed = true;
          var el = document.getElementById('hero-loader');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        // 用 MutationObserver 检测视频元素插入 DOM
        // 不设置 poster，避免 poster 与视频首帧画面不一致导致的视觉放大跳动
        // 等待视频第一帧就绪（loadeddata）后即时移除 loader，视频从首帧开始可见
        var observer = new MutationObserver(function () {
          var v = document.querySelector('video.hero__bg');
          if (v && !v.__loaderHooked) {
            v.__loaderHooked = true;
            if (v.readyState >= 2) {
              removeLoader();
            } else {
              v.addEventListener('loadeddata', removeLoader, { once: true });
              v.addEventListener('canplay', removeLoader, { once: true });
              v.addEventListener('playing', removeLoader, { once: true });
            }
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        // 兜底：6 秒后强制移除
        setTimeout(function () { observer.disconnect(); removeLoader(); }, 6000);
      })();
    </script>
  </body>
</html>
