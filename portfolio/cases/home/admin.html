function bindImageField(key, uid, writeFn, sharedSlot) {
  const dz = document.querySelector(`.dropzone[data-dz="${key}"][data-uid="${uid}"]`);
  if (!dz) return;
  const handler = async (file) => {
    if (!file) return;
    const prog = toastProgress('正在上传图片...');
    try {
      const url = sharedSlot ? await uploadSharedQr(sharedSlot, file) : await uploadImage(file);
      if (!url) throw new Error('服务器未返回 URL');
      setImageValue(key, uid, url, writeFn);
      prog.close('图片已上传', 'success');
    } catch (e) {
      prog.close('上传失败：' + e.message, 'error');
    }
  };
  dz.addEventListener('click', (e) => {
    if (e.target.closest('.dz-clear')) return;
    pickFile(MEDIA_ACCEPT).then(handler);
  });
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('dragover'); }));
  dz.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handler(f);
  });
  const clearBtn = dz.querySelector('.dz-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setImageValue(key, uid, '', writeFn);
    });
  }
  // URL input
  const urlInp = document.querySelector(`input[data-url-key="${key}"][data-url-uid="${uid}"]`);
  if (urlInp) {
    urlInp.addEventListener('change', () => {
      const v = urlInp.value.trim();
      if (v && /^https?:\/\//i.test(v)) {
        setImageValue(key, uid, v, writeFn);
        toast('已使用直链图片');
      } else if (!v) {
        // If URL cleared, we don't clear the field unless there was an http URL before
      } else {
        toast('请输入有效的 https:// 图片直链', 'error');
        const hidden = dz.querySelector('input[data-ftype="image-value"]');
        urlInp.value = hidden && hidden.value && hidden.value.startsWith('http') ? hidden.value : '';
      }
    });
  }
}

function setImageValue(key, uid, url, writeFn) {
  const dz = document.querySelector(`.dropzone[data-dz="${key}"][data-uid="${uid}"]`);
  if (!dz) return;
  const wrap = dz.parentElement;
  const container = wrap.parentElement;
  const newHtml = renderImageFieldWithUrl(key, url, uid);
  const tmp = document.createElement('div');
  tmp.innerHTML = newHtml;
  const newDz = tmp.firstElementChild;
  const urlInput = tmp.children[1];
  wrap.replaceChild(newDz, dz);
  // Replace URL input too
  const oldUrlInp = container.querySelector(`input[data-url-key="${key}"][data-url-uid="${uid}"]`);
  if (oldUrlInp && urlInput) {
    oldUrlInp.parentElement.replaceChild(urlInput, oldUrlInp);
  }
  bindImageField(key, uid, writeFn);
  // Update state（提供 writeFn 时由调用方写入自定义位置，如 letsTalk.qrCodes[i].url）
  if (typeof writeFn === 'function') {
    writeFn(url);
    return;
  }
  if (selectedIndex >= 0) {
    state.sections[selectedIndex][key] = url;
    onSectionChanged();
  }
}

/* ========= Gallery Columns Editor（A 方案：结构化分列式） ========= */

// —— 辅助：图片分配（和 render.js 相同规则，保证迁移前后列数一致）——
function adminDistributeByCount(n, cols) {
  var base = Math.floor(n / cols);
  var r = n % cols;
  var counts = [];
  for (var i = 0; i < cols; i++) counts.push(base);
  if (cols === 2) {
    for (var k = 0; k < r; k++) counts[k % cols]++;
  } else {
    var priority = cols === 3 ? [1, 2, 0] : [cols - 1, cols - 2, 0];
    for (var m = 0; m < r; m++) counts[priority[m % priority.length]]++;
  }
  return counts;
}

// —— 迁移：旧 section.screens（扁平数组 / 或 string）→ 新 section.columns + section.colCount ——
// 会直接在传入的 section 对象上原地修改。
/* ===== Intro section V3：label + heading 顶层唯一 + rows[] 项目行（text/tags 两种，可增删） ===== */
function migrateIntroSectionToV3(section) {
  if (section.type !== 'intro') return;
  // rows[0] type=heading → 升到顶层唯一的 label/heading
  if (Array.isArray(section.rows)) {
    var first = section.rows[0];
    if (first && first.type === 'heading') {
      if (!section.label) section.label = first.label || '';
      if (!section.heading) section.heading = first.value || '';
      section.rows = section.rows.slice(1);
    }
    section.rows = section.rows.filter(function (r) { return r && r.type !== 'heading'; });
  }
  if (!Array.isArray(section.rows)) section.rows = [];
  // 兜底：从扁平字段迁
  if (section.rows.length === 0) {
    function pushRow(type, label, value) {
      section.rows.push({ id: 'r_' + genId(), type: type, label: label, value: value });
    }
    if (section.year) pushRow('text', 'Year', section.year);
    if (section.industry) pushRow('text', 'Industry', section.industry);
    if (Array.isArray(section.scopeTags) && section.scopeTags.length) pushRow('tags', 'Scope of work', section.scopeTags.slice());
    if (section.timeline) pushRow('text', 'Timeline', section.timeline);
  }
  // 每行强制合法类型
  section.rows.forEach(function (r) {
    if (r.type !== 'text' && r.type !== 'tags') r.type = 'text';
  });
  delete section.year; delete section.industry; delete section.scopeTags; delete section.timeline;
  // 默认值
  if (!section.label) section.label = 'Introduction';
  if (!section.heading) section.heading = '';
}

function migrateGallerySectionToV2(section) {
  // 已经是 V2（有 columns 数组且 colCount 有值）就跳过
  if (Array.isArray(section.columns) && Number(section.colCount) >= 2) return;

  // 1. 先收集所有旧图片到一个 flat 数组
  var flat = [];
  if (Array.isArray(section.screens)) {
    section.screens.forEach(function (x) {
      if (!x) return;
      if (typeof x === 'string') flat.push({ id: genId(), src: x });
      else if (x && typeof x.src === 'string') flat.push({ id: x.id || genId(), src: x.src });
    });
  } else if (typeof section.screens === 'string' && section.screens.trim()) {
    flat.push({ id: genId(), src: section.screens.trim() });
  }

  // 2. 算出应该几列（优先保留旧 colCount，否则根据旧列数规则猜：>7张=3列，2列/3列由图片数决定）
  var cols = Number(section.colCount);
  if (cols !== 2 && cols !== 3) {
    cols = flat.length <= 5 ? 2 : 3;
  }
  // 2 列 5 张以下更合适，但 6 张以上 3 列更好看（和用户反馈的3-4-3一致）
  if (flat.length >= 6 && cols === 0) cols = 3;

  // 3. 按列分配
  var counts = adminDistributeByCount(flat.length, cols);
  var newColumns = [];
  var cursor = 0;
  for (var i = 0; i < cols; i++) {
    var imgs = [];
    for (var j = 0; j < counts[i]; j++) {
      if (flat[cursor]) { imgs.push(flat[cursor]); cursor++; }
    }
    newColumns.push({
      offsetRem: 0,
      images: imgs
    });
  }
  section.colCount = String(cols);
  section.columns = newColumns;
  // 保留旧 screens 字段（只读，不参与新逻辑），等用户保存一次就会变成全 V2 字段（但我们不删，以防回退）
}

// —— 列数变更 resize：把所有图片展平，按新列数重新分配 ——
function resizeGalleryColumns(section, targetCols) {
  migrateGallerySectionToV2(section);
  targetCols = Number(targetCols);
  if (targetCols !== 2 && targetCols !== 3) targetCols = 3;
  if (Number(section.colCount) === targetCols) return;
  // 1. 展平
  var flat = [];
  (section.columns || []).forEach(function (col) {
    (col.images || []).forEach(function (im) {
      flat.push({ id: im.id || genId(), src: im.src });
    });
  });
  // 2. 重新分配
  var counts = adminDistributeByCount(flat.length, targetCols);
  var newColumns = [];
  var cursor = 0;
  for (var i = 0; i < targetCols; i++) {
    var imgs = [];
    for (var j = 0; j < counts[i]; j++) {
      if (flat[cursor]) { imgs.push(flat[cursor]); cursor++; }
    }
    newColumns.push({ offsetRem: 0, images: imgs });
  }
  section.colCount = String(targetCols);
  section.columns = newColumns;
}

// —— Helper: 取当前 section（当前选中索引对应的 gallery）——
function currentGallerySection() {
  if (selectedIndex < 0 || !state.sections[selectedIndex]) return null;
  return state.sections[selectedIndex];

// —— 渲染：Intro 下方项目行（只有 text 单行 或 tags 标签药丸，不包含 Introduction 头部（那是 section.label/heading 顶层唯一字段））——
function renderIntroRowsEditor(key, rows, sectionId) {

          </button>
        </div>

          <div class="form-group intro-row-col-label">
            <label class="form-label">标签（项目名，如 Year）</label>

          </div>

            <label class="form-label">内容${t === 'tags' ? '（英文逗号分隔）' : ''}</label>
            ${t === 'text'
              ? `<input class="form-input" type="text" value="${esc(valText)}" data-attr="value" placeholder="2025">`
              : `<input class="form-input" type="text" value="${esc(valText)}" data-attr="value" placeholder="Platform Design, Landing Page, ...">`
            }
          </div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="intro-rows-editor" id="${gid}" data-key="${esc(key)}" data-section-id="${esc(sectionId)}">
      ${cardHtml || '<div class="form-hint">还没有内容行，点击下方「新增一行」按钮开始（例如 Year / Industry / Scope of work / Timeline）。</div>'}
      <button type="button" class="btn-outline intro-row-add" data-intro-add>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增一行
      </button>
    </div>`;
}

function bindIntroRowsEditor(key, sectionId) {
  const gid = 'introws_' + key + '_' + sectionId;
  const wrap = document.getElementById(gid);
  if (!wrap || selectedIndex < 0) return;
  const section = state.sections[selectedIndex];
  if (!section) return;
  // 确保 section.rows 存在
  if (!Array.isArray(section.rows)) section.rows = [];

  // ==== 工具：写回 section.rows 并触发重渲染 editor ====
  function readAndCommit() {
    const cards = wrap.querySelectorAll('.intro-row-card');
    const newRows = [];
    cards.forEach(function (card) {
      const rid = card.getAttribute('data-row-id') || ('r_' + genId());
      const typeEl = card.querySelector('[data-attr="type"]');
      const labelEl = card.querySelector('[data-attr="label"]');
      const valueEl = card.querySelector('[data-attr="value"]');
      const t = typeEl ? (typeEl.value || 'text') : 'text';
      const rawVal = valueEl ? (valueEl.value || '') : '';
      let val = rawVal;
      if (t === 'tags') {
        val = rawVal.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      }
      newRows.push({ id: rid, type: t, label: labelEl ? (labelEl.value || '') : '', value: val });
    });
    section.rows = newRows;
    onSectionChanged();
  }

  // 对所有 input/select/textarea：blur 或 change 时写回
  wrap.querySelectorAll('input, textarea, select').forEach(function (el) {
    el.addEventListener('change', function () {
      // 类型切换需要重渲染（text ↔ tags 控件不同）
      if (el.getAttribute('data-attr') === 'type') {
        readAndCommit();
        setTimeout(function () {
          // 重绘 editor（保留焦点）
          const container = document.getElementById('editorFormContainer');
          if (container) renderEditorForm(section);
        }, 0);
      } else {
        readAndCommit();
      }
    });
    el.addEventListener('blur', function () {
      if (el.getAttribute('data-attr') !== 'type') readAndCommit();
    });
  });

  // 删除
  wrap.querySelectorAll('[data-del-row]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      const rid = btn.getAttribute('data-del-row');
      section.rows = section.rows.filter(function (r) { return r.id !== rid; });
      onSectionChanged();
      setTimeout(function () { renderEditorForm(section); }, 0);
    });
  });

  // 新增
  const addBtn = wrap.querySelector('[data-intro-add]');
  if (addBtn) {
    addBtn.addEventListener('click', function () {
      section.rows.push({ id: 'r_' + genId(), type: 'text', label: '', value: '' });
      onSectionChanged();
      setTimeout(function () { renderEditorForm(section); }, 0);
    });
  }
}

// —— 渲染：分列 Tab + 每列 offset + 图片卡（缩略图 contain 完整显示，不切）——
/* ===== Gallery Columns Editor (V2: 按列管理 + Tab 切换 + 拖拽 + offset) ===== */
// 记住每个 section 当前选中的 Tab（避免上传图片后 re-render 跳回第 1 个 Tab）
var galleryActiveTabs = {};

function renderGalleryColumnsEditor(key, columns, sectionId, colCount) {
  colCount = Number(colCount) || 3;
  // 确保 columns 长度和 colCount 一致
  while (columns.length < colCount) columns.push({ offsetRem: 0, images: [] });
  if (columns.length > colCount) columns.length = colCount;
  var gid = 'gallery_' + key + '_' + sectionId;
  var tabsHtml = '';
  var panelsHtml = '';

  // 读取上次选中的 Tab，越界则回 0
  var activeCol = galleryActiveTabs[sectionId];
  if (activeCol === undefined || activeCol === null || activeCol >= colCount || activeCol < 0) {
    activeCol = 0;
  }

  for (var ci = 0; ci < colCount; ci++) {
    var col = columns[ci];
    if (!col) continue;
    var active = (ci === activeCol) ? ' active' : '';
    var count = (col.images || []).length;
    tabsHtml += `<div class="gc-tab${active}" data-gc-tab="${gid}" data-gc-col="${ci}" role="tab">
      <span class="gc-tab-name">列 ${ci + 1}</span>
      <span class="gc-tab-count">${count} 张</span>
    </div>`;

    var cardsHtml = '';
    (col.images || []).forEach(function (im, idx) {
      cardsHtml += `<div class="gc-card" draggable="true" data-gc-card="${gid}" data-gc-col="${ci}" data-gc-idx="${idx}" data-gc-imgid="${esc(im.id || '')}">
        <div class="gc-thumb" style="background-image:url('${esc(im.src)}')"></div>
        <div class="gc-toolbar">
          <span class="gc-idx">#${idx + 1}</span>
          <div class="gc-actions">
            <button type="button" class="gc-btn gc-up" data-gc-act="up" title="上移">↑</button>
            <button type="button" class="gc-btn gc-dn" data-gc-act="dn" title="下移">↓</button>
            <button type="button" class="gc-btn gc-replace" data-gc-act="replace" title="重新上传覆盖">↻</button>
            <button type="button" class="gc-btn gc-rm" data-gc-act="rm" title="删除">✕</button>
          </div>
        </div>
        <input class="gc-src form-input" type="text" value="${esc(im.src)}" placeholder="图片URL / 直链"
               data-gc-src="${gid}" data-gc-col="${ci}" data-gc-idx="${idx}">
        <div class="gc-drag-hint">拖拽此卡重排</div>
      </div>`;
    });

    panelsHtml += `<div class="gc-panel${active}" data-gc-panel="${gid}" data-gc-col="${ci}">
      <div class="gc-col-head">
        <div class="gc-col-offset">
          <label>本列顶部距离：<input type="number" step="0.1" min="0" max="10" value="${Number(col.offsetRem) || 0}"
                 class="form-input gc-offset-input" data-gc-offset="${gid}" data-gc-col="${ci}"> <span>rem</span></label>
        </div>
        <div class="gc-col-count">共 <b>${count}</b> 张 · 拖拽卡片可在同一列内排序</div>
      </div>
      <div class="gc-col-list" data-gc-list="${gid}" data-gc-col="${ci}">
        ${cardsHtml}
      </div>
      <div class="gc-add-row">
        <button type="button" class="btn-secondary gc-add-url" data-gc-addurl="${gid}" data-gc-col="${ci}">+ 新增（填直链）</button>
        <div class="dropzone gc-add-dropzone" data-gc-dz="${gid}" data-gc-col="${ci}" data-ftype="image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>+ 点选 / 拖拽图片上传（本列末尾）</span>
        </div>
      </div>
    </div>`;
  }

  return `
    <div class="gc-wrap" data-gc-wrap="${gid}" data-gc-key="${esc(key)}" data-gc-sectionid="${esc(sectionId)}">
      <div class="gc-tabs" role="tablist">${tabsHtml}</div>
      <div class="gc-panels">${panelsHtml}</div>
    </div>`;
}

// —— 绑定：Tab 切换 + 改 offset + 改 URL + 上下移动/删除/新增URL/上传 + 拖拽重排 ——
function bindGalleryColumnsEditor(key, sectionId) {
  var wrap = document.querySelector(`[data-gc-key="${key}"][data-gc-sectionid="${sectionId}"]`);
  if (!wrap) return;
  var gid = wrap.getAttribute('data-gc-wrap');
  var section = currentGallerySection();
  if (!section) return;

  // 1) Tab 切换
  wrap.querySelectorAll('.gc-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      var ci = Number(tab.getAttribute('data-gc-col'));
      // 记住当前选中的 Tab，re-render 后恢复
      galleryActiveTabs[sectionId] = ci;
      wrap.querySelectorAll('.gc-tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
      wrap.querySelectorAll('.gc-panel').forEach(function (p) {
        p.classList.toggle('active', Number(p.getAttribute('data-gc-col')) === ci);
      });
    });
  });

  // 2) 改 offset
  wrap.querySelectorAll('[data-gc-offset]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var ci = Number(inp.getAttribute('data-gc-col'));
      var v = parseFloat(inp.value);
      if (isNaN(v) || v < 0) v = 0;
      inp.value = v;
      if (section.columns && section.columns[ci]) {
        section.columns[ci].offsetRem = v;
        onSectionChanged();
      }
    });
  });

  // 3) 改图片 URL
  wrap.querySelectorAll('[data-gc-src]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var ci = Number(inp.getAttribute('data-gc-col'));
      var idx = Number(inp.getAttribute('data-gc-idx'));
      var v = inp.value.trim();
      if (section.columns && section.columns[ci] && section.columns[ci].images[idx]) {
        section.columns[ci].images[idx].src = v;
        onSectionChanged();
        // 重新渲染整张卡（刷新缩略图）
        setTimeout(function () { renderEditorForm(section); }, 0);
      }
    });
  });

  // 4) 卡工具栏：up/down/rm/replace + 新增 URL
  wrap.querySelectorAll('.gc-card').forEach(function (card) {
    card.querySelectorAll('[data-gc-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var ci = Number(card.getAttribute('data-gc-col'));
        var idx = Number(card.getAttribute('data-gc-idx'));
        var act = btn.getAttribute('data-gc-act');
        var list = section.columns && section.columns[ci] && section.columns[ci].images;
        if (!list) return;
        if (act === 'up' && idx > 0) {
          var t = list[idx - 1]; list[idx - 1] = list[idx]; list[idx] = t;
          onSectionChanged();
          setTimeout(function () { renderEditorForm(section); }, 0);
        } else if (act === 'dn' && idx < list.length - 1) {
          var t2 = list[idx + 1]; list[idx + 1] = list[idx]; list[idx] = t2;
          onSectionChanged();
          setTimeout(function () { renderEditorForm(section); }, 0);
        } else if (act === 'rm') {
          if (!confirm('确定删除这张图吗？')) return;
          list.splice(idx, 1);
          onSectionChanged();
          setTimeout(function () { renderEditorForm(section); }, 0);
        } else if (act === 'replace') {
          // 重新上传：选中新文件 → 上传 → 覆盖当前这张图的 src（不改变位置/数量）
          var handler = async function (file) {
            if (!file) return;
            var prog = toastProgress('上传新图片...');
            try {
              var url = await uploadImage(file);
              if (!url) throw new Error('服务器未返回 URL');
              if (section.columns && section.columns[ci] && section.columns[ci].images[idx]) {
                section.columns[ci].images[idx].src = url;
              }
              prog.close('已覆盖替换该图', 'success');
              onSectionChanged();
              setTimeout(function () { renderEditorForm(section); }, 0);
            } catch (e) {
              prog.close('上传失败：' + e.message, 'error');
            }
          };
          pickFile(MEDIA_ACCEPT).then(handler);
        }
      });
    });
  });

  // 5) 新增 URL 按钮
  wrap.querySelectorAll('[data-gc-addurl]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var ci = Number(btn.getAttribute('data-gc-col'));
      if (!section.columns[ci]) section.columns[ci] = { offsetRem: 0, images: [] };
      section.columns[ci].images.push({ id: genId(), src: '' });
      onSectionChanged();
      setTimeout(function () { renderEditorForm(section); }, 0);
    });
  });

  // 6) 上传 dropzone（每列一个）：点选/拖拽图片 → 上传 → push 到末尾
  wrap.querySelectorAll('.gc-add-dropzone').forEach(function (dz) {
    var ci = Number(dz.getAttribute('data-gc-col'));
    var handler = async function (file) {
      if (!file) return;
      var prog = toastProgress('上传图片...');
      try {
        var url = await uploadImage(file);
        if (!url) throw new Error('服务器未返回 URL');
        if (!section.columns[ci]) section.columns[ci] = { offsetRem: 0, images: [] };
        section.columns[ci].images.push({ id: genId(), src: url });
        prog.close('已添加到本列末尾', 'success');
        onSectionChanged();
        setTimeout(function () { renderEditorForm(section); }, 0);
      } catch (e) {
        prog.close('上传失败：' + e.message, 'error');
      }
    };
    dz.addEventListener('click', function () {
      pickFile(MEDIA_ACCEPT).then(handler);
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('dragover'); });
    });
    dz.addEventListener('drop', function (e) {
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handler(f);
    });
  });

  // 7) 拖拽排序（同列 HTML5 DnD）
  var dragData = null; // {col, idx, id}
  wrap.querySelectorAll('.gc-card').forEach(function (card) {
    card.addEventListener('dragstart', function (e) {
      var ci = Number(card.getAttribute('data-gc-col'));
      var idx = Number(card.getAttribute('data-gc-idx'));
      var id = card.getAttribute('data-gc-imgid') || '';
      dragData = { col: ci, idx: idx, id: id };
      card.classList.add('dragging');
      try {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(ci) + ':' + String(idx));
      } catch (_) {}
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
      wrap.querySelectorAll('.gc-card').forEach(function (c) { c.classList.remove('drag-over'); });
      dragData = null;
    });
    card.addEventListener('dragover', function (e) {
      if (!dragData) return;
      var ci = Number(card.getAttribute('data-gc-col'));
      if (ci !== dragData.col) return; // 只允许同列
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', function () {
      card.classList.remove('drag-over');
    });
    card.addEventListener('drop', function (e) {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (!dragData) return;
      var targetCol = Number(card.getAttribute('data-gc-col'));
      var targetIdx = Number(card.getAttribute('data-gc-idx'));
      if (targetCol !== dragData.col) return;
      if (targetIdx === dragData.idx) return;
      // 执行 reorder：先删再插
      var list = section.columns && section.columns[targetCol] && section.columns[targetCol].images;
      if (!list) return;
      var moved = list.splice(dragData.idx, 1)[0];
      if (!moved) return;
      list.splice(targetIdx, 0, moved);
      dragData = null;
      onSectionChanged();
      setTimeout(function () { renderEditorForm(section); }, 0);
    });
  });
}

/* ===== Backward compat renderImageField (used inside list items) ===== */
function renderImageField(key, url) {
  const has = !!url;
  return `
    <div class="dropzone${has ? ' has-image' : ''}" data-dz="${esc(key)}" data-ftype="image">
      <input type="hidden" data-key="${esc(key)}" data-ftype="image-value" value="${esc(url)}">

      <div class="dz-title">点击选择或拖拽图片</div>

        <div class="dz-replace">点击替换图片</div>
      </div>` : ''}
    </div>`;

function bindImageFieldLegacy(key, onUpdate) {
  const dz = document.querySelector(`.dropzone[data-dz="${key}"]`);
  if (!dz) return;
  const handler = async (file) => {
    if (!file) return;
    const prog = toastProgress('正在上传图片...');
    try {
      const url = await uploadImage(file);
      if (!url) throw new Error('服务器未返回 URL');
      const wrap = dz.parentElement;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderImageField(key, url);
      wrap.replaceChild(tmp.firstElementChild, dz);
      bindImageFieldLegacy(key, onUpdate);
      if (onUpdate) onUpdate(url);
      prog.close('图片已上传', 'success');
    } catch (e) {
      prog.close('上传失败：' + e.message, 'error');
    }
  };
  dz.addEventListener('click', (e) => {
    if (e.target.closest('.dz-clear')) return;
    pickFile(MEDIA_ACCEPT).then(handler);
  });
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('dragover'); }));
  dz.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handler(f);
  });
  const clearBtn = dz.querySelector('.dz-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = dz.parentElement;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderImageField(key, '');
      wrap.replaceChild(tmp.firstElementChild, dz);
      bindImageFieldLegacy(key, onUpdate);
      if (onUpdate) onUpdate('');
    });
  }
}

/* ===== Generic Items List Field（clients / stats / services / team 复用） ===== */
function renderItemsListField(field, list, uid) {
  const key = field.key;
  const itemLabel = field.itemLabel || '条目';
  const items = list.map((item, i) => {
    const body = (field.itemFields || []).map((f) => {
      const v = item ? item[f.key] : '';
      let ctl = '';
      if (f.type === 'textarea') {
        ctl = `<textarea class="form-input form-textarea" data-il-key="${esc(f.key)}" data-il-type="textarea" data-il-idx="${i}">${esc(Array.isArray(v) ? v.join(', ') : (v || ''))}</textarea>`;
      } else if (f.type === 'tags') {
        ctl = `<input class="form-input" data-il-key="${esc(f.key)}" data-il-type="tags" data-il-idx="${i}" type="text" placeholder="英文逗号分隔" value="${esc(Array.isArray(v) ? v.join(', ') : (v || ''))}">`;
      } else if (f.type === 'image') {
        ctl = renderItemImageControl(f.key, v || '', i);
      } else {
        ctl = `<input class="form-input" data-il-key="${esc(f.key)}" data-il-type="text" data-il-idx="${i}" type="text" placeholder="${esc(f.placeholder || '')}" value="${esc(v || '')}">`;
      }
      return `<div class="form-group"><label class="form-label">${esc(f.label)}</label>${ctl}</div>`;
    }).join('');
    return `<div class="list-field-item" data-lf-item="${i}">
      <div class="lf-head">
        <span class="lf-title">${esc(itemLabel)} #${i + 1}</span>
        <button type="button" class="btn-icon delete" data-lf-remove="${i}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
      ${body}
    </div>`;
  }).join('');
  return `<div class="list-field" data-lf="${esc(key)}" data-uid="${esc(uid)}" data-ftype="items-list">
    ${items}
    <button type="button" class="btn-secondary list-field-add" data-lf-add="${esc(key)}" data-lf-add-uid="${esc(uid)}" style="justify-content:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加${esc(itemLabel)}
    </button>
  </div>`;
}

function renderItemImageControl(fkey, url, idx) {
  const has = !!url;
  return `
    <div class="il-image" data-il-key="${esc(fkey)}" data-il-type="image" data-il-idx="${idx}">
      <input type="hidden" class="il-image-value" value="${esc(url)}">
      ${has ? `<div class="il-image-preview"><img src="${esc(url)}" alt="" loading="lazy"></div>` : ''}
      <div class="il-image-actions">
        <button type="button" class="btn-secondary il-img-upload" style="justify-content:center;">上传图片</button>
        ${has ? `<button type="button" class="btn-secondary il-img-clear" style="justify-content:center;">清除</button>` : ''}
        <input class="form-input il-img-url" type="text" placeholder="https://... 图片 URL" value="${esc(url && url.startsWith('http') ? url : '')}">

function bindItemsListField(field, uid) {
  const key = field.key;
  const wrap = document.querySelector(`.list-field[data-lf="${key}"][data-uid="${uid}"]`);
  if (!wrap) return;
  const save = () => {
    if (selectedIndex >= 0) {
      state.sections[selectedIndex][key] = collectItemsList(key, uid);
      onSectionChanged();
    }
  };
  const rebind = () => {
    replaceListField(key, uid, renderItemsListField(field, state.sections[selectedIndex][key] || [], uid));
    bindItemsListField(field, uid);
  };
  // 删除条目
  wrap.querySelectorAll('[data-lf-remove]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.lfRemove);
      const list = collectItemsList(key, uid);
      list.splice(idx, 1);
      state.sections[selectedIndex][key] = list;
      rebind();
      onSectionChanged();
    });
  });
  // 添加条目
  const addBtn = wrap.querySelector('[data-lf-add]');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      const list = collectItemsList(key, uid);
      list.push({});
      state.sections[selectedIndex][key] = list;
      rebind();
      onSectionChanged();
    });
  }
  // 标量输入（text / textarea / tags）
  wrap.querySelectorAll('[data-il-key]').forEach((inp) => {
    if (inp.classList.contains('il-image')) return;
    inp.addEventListener('input', () => save());
    inp.addEventListener('change', () => save());
  });
  // 条目内图片控件
  wrap.querySelectorAll('.il-image').forEach((imgWrap) => {
    const setUrl = (url) => {
      const idx = imgWrap.dataset.ilIdx;
      const fkey = imgWrap.dataset.ilKey;
      const list = collectItemsList(key, uid);
      const item = list[idx] || {};
      item[fkey] = url;
      list[idx] = item;
      state.sections[selectedIndex][key] = list;
      const tmp = document.createElement('div');
      tmp.innerHTML = renderItemImageControl(fkey, url, idx);
      imgWrap.parentElement.replaceChild(tmp.firstElementChild, imgWrap);
      bindItemsListField(field, uid);
      onSectionChanged();
    };
    imgWrap.querySelector('.il-img-upload').addEventListener('click', () => {
      pickFile(MEDIA_ACCEPT).then(async (file) => {
        if (!file) return;
        const prog = toastProgress('正在上传图片...');
        try {
          const url = await uploadImage(file);
          if (!url) throw new Error('服务器未返回 URL');
          setUrl(url);
          prog.close('图片已上传', 'success');
        } catch (e) {
          prog.close('上传失败：' + e.message, 'error');
        }
      });
    });
    const clearBtn = imgWrap.querySelector('.il-img-clear');
    if (clearBtn) clearBtn.addEventListener('click', () => setUrl(''));
    const urlInp = imgWrap.querySelector('.il-img-url');
    if (urlInp) {
      urlInp.addEventListener('change', () => {
        const v = urlInp.value.trim();
        if (v && /^https?:\/\//i.test(v)) { setUrl(v); toast('已使用直链图片'); }
        else if (v) toast('请输入有效的 https:// 图片直链', 'error');
      });
    }
  });
}

function collectItemsList(key, uid) {
  const wrap = document.querySelector(`.list-field[data-lf="${key}"][data-uid="${uid}"]`);
  if (!wrap) return [];
  const out = [];
  wrap.querySelectorAll('.list-field-item').forEach((item) => {
    const obj = {};
    item.querySelectorAll('[data-il-key]').forEach((inp) => {
      const fkey = inp.dataset.ilKey;
      const ftype = inp.dataset.ilType;
      if (ftype === 'tags') {
        obj[fkey] = inp.value.split(',').map((s) => s.trim()).filter(Boolean);
      } else if (ftype === 'image') {
        const hidden = inp.querySelector('.il-image-value');
        obj[fkey] = hidden ? (hidden.value || '') : '';
      } else {
        obj[fkey] = inp.value;
      }
    });
    out.push(obj);
  });
  return out;
}

/* ===== Image List Field ===== */
function renderImageListField(key, list, uid) {
  const items = list.map((url, i) => `
    <div class="list-field-item" data-lf-item="${i}">

/* ===== 旧特效双图 → 独立标题组件迁移（title/copyright/allProjectsText → title section） ===== */
function migrateLegacyTitleSections(sections) {
  const out = [];
  let hasTitle = sections.some((s) => s && s.type === 'title');
  sections.forEach((s) => {
    if (s && s.type === 'hero' && s.title && !hasTitle) {
      out.push({ id: (s.id || 'hero') + '-title', type: 'title', title: s.title, copyright: '', description: '' });
      hasTitle = true;
      delete s.title;
    }
    if (s && s.type === 'next-projects') {
      const g0 = (Array.isArray(s.groups) && s.groups[0]) ? s.groups[0] : null;
      const t = (s.title !== undefined && s.title !== null && s.title !== '') ? s.title : (g0 && g0.title);
      const c = (s.copyright !== undefined && s.copyright !== null && s.copyright !== '') ? s.copyright : (g0 && g0.copyright);
      const a = (s.allProjectsText !== undefined && s.allProjectsText !== null && s.allProjectsText !== '') ? s.allProjectsText : (g0 && g0.allProjectsText);
      if ((t || c || a) && !hasTitle) {
        out.push({ id: genId(), type: 'title', title: t || 'Projects', copyright: c || '', description: a || '' });
        hasTitle = true;
      }
      delete s.title;
      delete s.copyright;
      delete s.allProjectsText;
      if (g0) { delete g0.title; delete g0.copyright; delete g0.allProjectsText; }
    }
    out.push(s);
  });
  return out;
}

// 记住每个 section 当前选中的组 Tab（避免上传/重渲染后跳回第 1 组）
var groupsActiveTabs = {};

function renderGroupsListField(key, list, uid) {
  const groups = Array.isArray(list) ? list : [];
  const active = groupsActiveTabs[uid];
  const activeIdx = (active !== undefined && active !== null && active >= 0 && active < groups.length) ? active : 0;
  const tabs = [];
  const panels = [];
  groups.forEach((g, gi) => {
    const gv = g || {};
    const count = Array.isArray(gv.cards) ? gv.cards.length : 0;
    const isActive = gi === activeIdx;
    tabs.push(`<div class="np-tab${isActive ? ' active' : ''}" data-gl-tab="${gi}" role="tab">
      <span class="np-tab-name">组 #${gi + 1}</span>
      <span class="np-tab-count">${count} 张</span>
    </div>`);
    const cardsHtml = renderCardsListField(key + '__cards_' + gi, Array.isArray(gv.cards) ? gv.cards : [], uid);
    panels.push(`<div class="np-panel${isActive ? ' active' : ''}" data-gl-item="${gi}">
      <div class="lf-head">
        <span class="lf-title">组 #${gi + 1} · 双图卡片（共 ${count} 张）</span>
        <button type="button" class="btn-icon delete" data-gl-remove="${gi}" title="删除本组"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
      <div class="gl-cards">
        <div class="gl-cards-label">本组双图卡片</div>
        ${cardsHtml}
      </div>
    </div>`);
  });
  return `
    <div class="list-field" data-lf="${esc(key)}" data-uid="${esc(uid)}" data-ftype="groups-list">
      <div class="np-tabs" role="tablist">
        ${tabs.join('')}
        <button type="button" class="np-tab-add" data-gl-add>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加一组
        </button>
      </div>
      <div class="np-panels">${panels.join('')}</div>
    </div>`;
}

function bindGroupsListField(key, uid) {
  const wrap = document.querySelector(`.list-field[data-lf="${key}"][data-uid="${uid}"]`);
  if (!wrap) return;
  const setGroups = (groups) => {
    if (selectedIndex >= 0) {
      state.sections[selectedIndex][key] = groups;
      onSectionChanged();
    }
  };
  const rebind = () => {
    replaceListField(key, uid, renderGroupsListField(key, state.sections[selectedIndex][key] || [], uid));
    bindGroupsListField(key, uid);
  };
  // 页卡切换（只切显示，不重渲染）
  wrap.querySelectorAll('[data-gl-tab]').forEach((tab) => {
    tab.addEventListener('click', () => {
      const gi = parseInt(tab.dataset.glTab);
      groupsActiveTabs[uid] = gi;
      wrap.querySelectorAll('[data-gl-tab]').forEach((t) => t.classList.toggle('active', t === tab));
      wrap.querySelectorAll('.np-panel').forEach((p) => {
        p.classList.toggle('active', parseInt(p.dataset.glItem) === gi);
      });
    });
  });
  // 删除组（删除后激活索引回退到相邻组）
  wrap.querySelectorAll('[data-gl-remove]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const gi = parseInt(btn.dataset.glRemove);
      const groups = collectGroupsList(key, uid);
      groups.splice(gi, 1);
      if (groupsActiveTabs[uid] >= groups.length) groupsActiveTabs[uid] = Math.max(0, groups.length - 1);
      setGroups(groups);
      rebind();
    });
  });
  // 添加组（添加后自动激活新组）
  const addBtn = wrap.querySelector('[data-gl-add]');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      const groups = collectGroupsList(key, uid);
      groups.push({ cards: [] });
      groupsActiveTabs[uid] = groups.length - 1;
      setGroups(groups);
      rebind();
    });
  }
  // 组内嵌套卡片列表（uid 一致；setList 写回对应组的 cards）
  wrap.querySelectorAll('.np-panel').forEach((item, gi) => {
    const cardsWrap = item.querySelector('.list-field[data-lf]');
    if (!cardsWrap) return;
    bindCardsListField(cardsWrap.dataset.lf, uid, (list) => {
      if (selectedIndex < 0) return;
      const groups = collectGroupsList(key, uid);
      if (groups[gi]) groups[gi].cards = list;
      state.sections[selectedIndex][key] = groups;
      onSectionChanged();
    });
  });
}

function deleteSection(index) {
  if (index < 0 || index >= state.sections.length) return;
  const s = state.sections[index];
  const label = TYPE_LABELS[s.type] || s.type;
  const num = index + 1;
  confirmAction = () => {
    state.sections.splice(index, 1);

    toast('板块已删除，记得保存', 'success');

/* ===== 全局 API（页面索引 / 新建 / 复制 / 层级 / 删除，带登录 token） ===== */
async function apiGlobal(path, method, body) {
  const opt = { method: method || 'GET' };
  if (body) {
    opt.headers = { 'Content-Type': 'application/json' };
    opt.body = JSON.stringify(body);
  }
  const token = getAuthToken();
  if (token) opt.headers = Object.assign({}, opt.headers || {}, { 'Authorization': 'Bearer ' + token });
  const res = await fetch(path, opt);
  if (res.status === 401) {
    handleAuthExpired();
    throw new Error('未登录或登录已过期，请重新登录');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.status === 'error') {
    throw new Error(data.message || ('请求失败 ' + res.status));
  }
  return data;
}

async function switchCase(key, title) {
  if (key === CASE_KEY) { showTab('sections'); return; }
  if (isDirty() && !window.confirm('当前页面有未保存的修改，切换到「' + (title || key) + '」将丢失这些修改，确定切换吗？')) return;
  CASE_KEY = key;
  API_BASE = '/api/cases/' + CASE_KEY;
  $('#btnPreview').href = '../' + key + '/index.html';
  document.title = (title || key) + ' — W. Block';
  selectedIndex = -1;
  editorMode = 'empty';
  await loadState();
  showTab('sections');
  toast('已切换到：' + (title || key), 'success');
}

function openPgNew() {
  $('#pgNewKey').value = '';
  $('#pgNewTitle').value = '';
  openModal('pgModalNew');
}
async function submitPgNew() {
  const key = $('#pgNewKey').value.trim();
  if (!key) { toast('Key 必填'); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(key)) { toast('Key 只允许字母/数字/下划线/短横'); return; }
  try {
    await apiGlobal('/api/pages/new', 'POST', {
      key: key,
      title: $('#pgNewTitle').value.trim() || key,
      type: $('#pgNewType').value,
      level: $('#pgNewLevel').value
    });
    toast('页面已创建', 'success');
    closeModal('pgModalNew');
    loadPages();
  } catch (e) { toast(e.message, 'error'); }
}

async function openPgCopy(fromKey) {
  try {
    const data = await apiGlobal('/api/pages');
    const pages = (data && data.pages) || [];
    $('#pgCopyFrom').innerHTML = pages.map((p) =>
      '<option value="' + esc(p.key) + '"' + (p.key === fromKey ? ' selected' : '') + '>' + esc(p.title + ' (' + p.key + ')') + '</option>'
    ).join('');
  } catch (e) { toast(e.message, 'error'); return; }
  $('#pgCopyKey').value = '';
  $('#pgCopyTitle').value = '';
  openModal('pgModalCopy');
}
async function submitPgCopy() {
  const from = $('#pgCopyFrom').value;
  const key = $('#pgCopyKey').value.trim();
  if (!from) { toast('请选择源页面'); return; }
  if (!key) { toast('新 Key 必填'); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(key)) { toast('Key 只允许字母/数字/下划线/短横'); return; }
  try {
    await apiGlobal('/api/pages/copy', 'POST', { from: from, key: key, title: $('#pgCopyTitle').value.trim() || undefined });
    toast('已复制为新页面', 'success');
    closeModal('pgModalCopy');
    loadPages();
  } catch (e) { toast(e.message, 'error'); }
}

async function openPgEdit(key) {
  try {
    const data = await apiGlobal('/api/pages');
    const pages = (data && data.pages) || [];
    const cur = pages.find((p) => p.key === key);
    if (!cur) { toast('页面不存在'); return; }
    $('#pgEditParent').innerHTML = '<option value="">（无 · 顶级）</option>' + pages
      .filter((p) => p.key !== key)
      .map((p) => '<option value="' + esc(p.key) + '"' + (cur.parent === p.key ? ' selected' : '') + '>' + esc(p.title + ' (' + p.key + ')') + '</option>')
      .join('');
    $('#pgEditTitle').value = cur.title || '';
    $('#pgEditLevel').value = String(cur.level || 3);
    $('#pgEditNav').checked = !!cur.nav;
    window.__pgEditKey = key;
    openModal('pgModalEdit');
  } catch (e) { toast('加载失败：' + e.message); }
}
async function submitPgEdit() {
  const key = window.__pgEditKey;
  if (!key) { toast('请先选择页面'); return; }
  try {
    await apiGlobal('/api/pages/update', 'POST', {
      key: key,
      title: $('#pgEditTitle').value.trim(),
      parent: $('#pgEditParent').value || null,
      level: $('#pgEditLevel').value,
      nav: $('#pgEditNav').checked
    });
    toast('层级已保存', 'success');
    closeModal('pgModalEdit');
    loadPages();
  } catch (e) { toast(e.message, 'error'); }
}

async function openPgDel(key) {
  try {
    const data = await apiGlobal('/api/pages');
    const pages = (data && data.pages) || [];
    const cur = pages.find((p) => p.key === key);
    const name = cur ? (cur.title + ' (' + key + ')') : key;
    $('#pgDelText').innerHTML = '确定删除「<b>' + esc(name) + '</b>」？<br>页面目录、内容（content.json）与上传文件将一并移除，且不可恢复。';
    window.__pgDelKey = key;
    openModal('pgModalDel');
  } catch (e) { toast('加载失败：' + e.message); }
}
async function submitPgDel() {
  const key = window.__pgDelKey;
  if (!key) { toast('请先选择页面'); return; }
  try {
    await apiGlobal('/api/pages/delete', 'POST', { key: key });
    toast('页面已删除', 'success');
    closeModal('pgModalDel');
    if (key === CASE_KEY) {
      // 删的是当前编辑页：切回第一个剩余页面，避免继续编辑已删除的目录
      const data = await apiGlobal('/api/pages');
      const pages = (data && data.pages) || [];
      if (pages.length) {
        await switchCase(pages[0].key, pages[0].title);
      } else {
        location.reload();
      }
      return;
    }
    loadPages();
  } catch (e) { toast(e.message, 'error'); }
}

/* ===== 登录 ===== */
function onLoginClick() {
  const btn = $('#authBtn');
  const user = $('#authUser').value.trim();
  const pass = $('#authPass').value;
  if (!user || !pass) { $('#authErr').textContent = '请输入账号和密码'; return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  $('#authErr').textContent = '';
  doLogin(user, pass)
    .then(() => {
      document.body.classList.remove('auth-pending');
      hideAuthOverlay();
      $('#navUser').textContent = user;
      toast('登录成功', 'success');
      afterAuth();
    })
    .catch((e) => { $('#authErr').textContent = e.message || '登录失败'; })
    .finally(() => { btn.disabled = false; btn.textContent = '登 录'; });
}

function afterAuth() {
  $('#tabSections').onclick = () => showTab('sections');
  // 页面管理已改为新标签页打开（admin.html?view=pages），此处不绑定切换
  $('#btnPgNew').onclick = openPgNew;
  $('#btnPgCopy').onclick = () => openPgCopy('');
  $('#pgNewSubmit').onclick = submitPgNew;
  $('#pgCopySubmit').onclick = submitPgCopy;
  $('#pgEditSubmit').onclick = submitPgEdit;
  $('#pgDelSubmit').onclick = submitPgDel;
  document.querySelectorAll('[data-close-modal]').forEach((b) => {
    b.addEventListener('click', () => { const m = b.closest('.modal-mask'); if (m) closeModal(m.id); });
  });
  // URL 带 ?view=pages 时（从顶部「页面管理」新标签页打开）直接进入页面管理视图；
  // 板块内容照常加载，切回「板块导航」时立即可编辑，避免空白覆盖
  try {
    if (new URLSearchParams(location.search).get('view') === 'pages') {
      showTab('pages');
    }
  } catch (_) {}
  loadState();
}

/* ===== Init（先鉴权，成功后再加载内容） ===== */
async function init() {
  $('#authBtn').onclick = onLoginClick;
  $('#authPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') onLoginClick(); });
  $('#btnLogout').onclick = () => doLogout();
  const u = getAuthUser();
  if (u) $('#navUser').textContent = u;
  const ok = await checkAuth();
  if (!ok) { showAuthOverlay(); return; }
  document.body.classList.remove('auth-pending');
  hideAuthOverlay();
  afterAuth();
}
init();
</script>
</body>
