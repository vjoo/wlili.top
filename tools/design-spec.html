<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>设计规范 - W.-Studio Tools</title>
<link rel="stylesheet" href="common.css">
<script src="nav.js"></script>
<style>
/* ===== Layout ===== */
.spec-layout { display: flex; min-height: 100vh; }
.spec-sidebar {
  width: 220px; flex-shrink: 0;
  position: sticky; top: 48px;
  height: calc(100vh - 48px);
  overflow-y: auto;
  border-right: 1px solid var(--border-light);
  background: var(--bg-elevated);
  padding: 16px 0;
}
.spec-sidebar::-webkit-scrollbar { width: 4px; }
.spec-sidebar::-webkit-scrollbar-thumb { background: var(--fill-gray-light); border-radius: 4px; }
.spec-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
.spec-nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  font-size: 13px; font-weight: 400;
  color: var(--ink-tertiary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-decoration: none;
}
.spec-nav-item:hover { background: var(--bg); color: var(--ink); }
.spec-nav-item.active { background: var(--fill-black); color: var(--fill-white); font-weight: 500; }
.spec-nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
.spec-nav-item.active svg { opacity: 1; }
.spec-nav-section {
  font-size: 10px; font-weight: 600;
  color: var(--ink-quaternary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 14px 12px 4px;
}

/* ===== Main ===== */
.spec-main { flex: 1; min-width: 0; }
.spec-hero {
  padding: 16px 28px 12px;
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-white);
  position: sticky; top: 48px; z-index: var(--z-sticky);
}
.spec-hero h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.spec-hero p { font-size: 13px; color: var(--ink-tertiary); margin: 0; }
.spec-search {
  position: relative; width: 240px;
}
.spec-search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--ink-quaternary); pointer-events: none;
}
.spec-search input {
  width: 100%; height: 34px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-pill);
  padding: 0 14px 0 36px;
  font-size: 13px; font-family: inherit;
  background: var(--bg-white); color: var(--ink);
  outline: none; transition: border-color 0.2s;
}
.spec-search input:focus { border-color: var(--link); }

/* ===== Content ===== */
.spec-content { padding: 24px 28px 80px; max-width: 1100px; }
.spec-section { margin-bottom: 56px; scroll-margin-top: 100px; }
.spec-section.hidden { display: none; }
.spec-section-body {
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 20px;
}
.spec-section-body > *:last-child { margin-bottom: 0; }
.spec-section-title {
  font-size: 17px; font-weight: 600;
  color: var(--ink); margin: 0 0 4px;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 8px;
}
.spec-section-title .count {
  font-size: 12px; font-weight: 400;
  color: var(--ink-quaternary);
  background: var(--bg);
  padding: 2px 8px; border-radius: var(--radius-pill);
}
.spec-section-desc {
  font-size: 14px; color: var(--ink-tertiary);
  margin: 0 0 20px; line-height: 1.4;
}

/* ===== KPI Cards ===== */
.kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 28px; }
.kpi-card {
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.kpi-val { font-size: 24px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi-label { font-size: 13px; color: var(--ink-tertiary); font-weight: 500; }

/* ===== Spec Card ===== */
.spec-card {
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.spec-card:hover { border-color: var(--border); }
.spec-card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-elevated);
}
.spec-card-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.spec-card-source {
  font-size: 12px; color: var(--ink-tertiary);
  font-family: ui-monospace, 'SF Mono', monospace;
  display: flex; align-items: center; gap: 4px;
}
.spec-card-source .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--link); flex-shrink: 0; }
.spec-card-body { padding: 16px; }
.spec-card-preview {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; flex-wrap: wrap;
  padding: 20px;
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  min-height: 60px;
}
.spec-props {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
  font-size: 13px;
}
.spec-prop {
  display: flex; align-items: baseline; gap: 6px;
  padding: 4px 0;
}
.spec-prop-key { color: var(--ink-tertiary); font-family: ui-monospace, 'SF Mono', monospace; font-size: 13px; }
.spec-prop-val { color: var(--ink); font-family: ui-monospace, 'SF Mono', monospace; font-size: 13px; }

/* ===== Color Swatch ===== */
.color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.color-swatch {
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-light);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.color-swatch:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.color-swatch-chip { height: 56px; width: 100%; }
.color-swatch-info { padding: 10px 12px; }
.color-swatch-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.color-swatch-val { font-size: 13px; color: var(--ink-tertiary); font-family: ui-monospace, monospace; }
.color-swatch-var { font-size: 12px; color: var(--ink-tertiary); font-family: ui-monospace, monospace; }

/* ===== Typography ===== */
.type-row {
  display: flex; align-items: baseline; gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
}
.type-row:last-child { border-bottom: none; }
.type-sample { flex: 1; min-width: 0; color: var(--ink); }
.type-meta { font-size: 13px; color: var(--ink-tertiary); font-family: ui-monospace, monospace; white-space: nowrap; text-align: right; }

/* ===== Radius Showcase ===== */
.radius-grid { display: flex; gap: 16px; flex-wrap: wrap; }
.radius-item { text-align: center; display: flex; flex-direction: column; align-items: center; }
.radius-box {
  width: 72px; height: 72px;
  background: var(--fill-black);
  margin-bottom: 8px;
}
.radius-item .name { font-size: 14px; font-weight: 500; color: var(--ink); }
.radius-item .val { font-size: 13px; color: var(--ink-tertiary); font-family: ui-monospace, monospace; }

/* ===== Z-index Bar ===== */
.zbar-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-light); }
.zbar-row:last-child { border-bottom: none; }
.zbar-label { width: 120px; font-size: 14px; font-weight: 500; color: var(--ink); }
.zbar-bar { height: 24px; background: var(--link); border-radius: 4px; display: flex; align-items: center; padding-left: 8px; color: #fff; font-size: 13px; font-weight: 600; font-family: ui-monospace, monospace; }

/* ===== Code Block ===== */
.code-block {
  background: #1e1e2e;
  color: #cdd6f4;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: ui-monospace, 'SF Mono', monospace;
  font-size: 13px;
  line-height: 1.5;
  overflow-x: auto;
  margin-top: 10px;
  position: relative;
}
.code-block .copy-btn {
  position: absolute; top: 6px; right: 6px;
  padding: 3px 8px;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  color: #cdd6f4;
  cursor: pointer;
  transition: background 0.15s;
}
.code-block .copy-btn:hover { background: rgba(255,255,255,0.12); }
.code-block .tok-key { color: #f38ba8; }
.code-block .tok-val { color: #a6e3a1; }
.code-block .tok-comment { color: #6c7086; }

/* ===== Breakpoint ===== */
.bp-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.bp-row:last-child { border-bottom: none; }
.bp-width { font-size: 14px; font-weight: 600; color: var(--link); font-family: ui-monospace, monospace; width: 80px; }
.bp-label { font-size: 14px; font-weight: 500; color: var(--ink); width: 100px; }
.bp-desc { font-size: 14px; color: var(--ink-tertiary); flex: 1; }

/* ===== Motion ===== */
.motion-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.motion-row:last-child { border-bottom: none; }
.motion-name { font-size: 14px; font-weight: 500; color: var(--ink); width: 180px; }
.motion-preview { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--fill-black); }
.motion-meta { font-size: 13px; color: var(--ink-tertiary); font-family: ui-monospace, monospace; }

/* ===== Page Badge ===== */
.page-badge {
  display: inline-block;
  font-size: 12px; font-weight: 500;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--bg); color: var(--ink-tertiary);
  margin-right: 4px;
}

/* ===== Toast ===== */
.copy-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--fill-black); color: var(--fill-white);
  padding: 10px 20px; border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 400;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  opacity: 0; transition: all 0.3s cubic-bezier(0.22,0.61,0.36,1);
  z-index: var(--z-toast); pointer-events: none;
}
.copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Responsive ===== */
@media (max-width: 860px) {
  .spec-sidebar {
    position: fixed; left: 0; top: 48px;
    width: 100%; height: auto;
    border-right: none; border-bottom: 1px solid var(--border-light);
    padding: 8px 0; z-index: var(--z-sticky);
    overflow-x: auto; overflow-y: hidden;
  }
  .spec-nav { flex-direction: row; padding: 0 16px; gap: 4px; }
  .spec-nav-section { display: none; }
  .spec-nav-item { padding: 6px 12px; }
  .spec-main { padding-top: 0; }
  .spec-content { padding: 16px 16px 60px; }
  .spec-hero { padding: 12px 16px 10px; }
  .spec-search { width: 160px; }
  .kpi-row { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 480px) {
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .spec-content { padding: 12px 12px 48px; }
  .spec-props { grid-template-columns: 1fr; }
}
</style>
</head>

      '<span style="width:52px;font-size:13px;color:var(--ink-quaternary);flex-shrink:0;">' + s.val + '</span>' +

  scaleHtml += '<div style="font-size:14px;font-weight:600;color:var(--ink-secondary);margin:24px 0 10px;">阴影刻度</div>';
  SCALES.shadow.forEach(function(s) {

  /* 响应式断点 */

function renderComps(comps) {
  var html = '';
  comps.forEach(function(c) {
    html += '<div class="spec-card">' +
      '<div class="spec-card-head"><div class="spec-card-name">' + c.name + '</div><div class="spec-card-source"><span class="dot"></span>' + c.src + '</div></div>' +
      '<div class="spec-card-body">' +
        '<div class="spec-card-preview">' + c.preview + '</div>' +
        '<div class="spec-props">';
    for (var k in c.props) {
      html += '<div class="spec-prop"><span class="spec-prop-key">' + k + '</span><span class="spec-prop-val">' + c.props[k] + '</span></div>';
    }
    html += '</div></div></div>';
  });
  return html;
}

function section(id, title, desc, count, contents) {
  var inner = contents.join('');
  return '<section class="spec-section" id="' + id + '" data-title="' + title + '">' +
    '<div class="spec-section-body">' +
      '<h2 class="spec-section-title">' + title + (count || '') + '</h2>' +
      '<p class="spec-section-desc">' + desc + '</p>' +
      inner +
    '</div></section>';
}

function kpiRow(items) {
  var html = '<div class="kpi-row">';
  items.forEach(function(k) {
    html += '<div class="kpi-card"><div class="kpi-val">' + k.val + '</div><div class="kpi-label">' + k.label + '</div></div>';
  });
  return html + '</div>';
}

/* 搜索过滤 */
function setupSearch() {
  var input = document.getElementById('searchInput');
  var timer;
  input.addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      var q = input.value.trim().toLowerCase();
      var sections = document.querySelectorAll('.spec-section');
      sections.forEach(function(s) {
        if (!q) { s.classList.remove('hidden'); return; }
        var text = s.textContent.toLowerCase();
        s.classList.toggle('hidden', text.indexOf(q) < 0);
      });
    }, 150);
  });
}

/* 侧边导航点击 */
function setupNavClick() {
  document.querySelectorAll('.spec-nav-item').forEach(function(item) {
    item.addEventListener('click', function(e) {
      e.preventDefault();
      var target = this.dataset.target;
      var el = document.getElementById(target);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  /* 滚动高亮 */
  var sections = document.querySelectorAll('.spec-section');
  var navItems = document.querySelectorAll('.spec-nav-item');
  window.addEventListener('scroll', function() {
    var scrollY = window.scrollY + 120;
    var current = '';
    sections.forEach(function(s) {
      if (scrollY >= s.offsetTop) current = s.id;
    });
    navItems.forEach(function(n) {
      n.classList.toggle('active', n.dataset.target === current);
    });
    /* 侧边栏滚动可见 */
    var active = document.querySelector('.spec-nav-item.active');
    if (active && window.innerWidth <= 860) {
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
}

/* 复制功能 */
function setupCopy() {
  document.addEventListener('click', function(e) {
    var swatch = e.target.closest('.color-swatch');
    if (swatch) {
      var val = swatch.dataset.copy;
      copyToClipboard(val);
    }
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showCopyToast);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showCopyToast();
  }
}

function showCopyToast() {
  var toast = document.getElementById('copyToast');
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() {
    toast.classList.remove('show');
  }, 1800);
}

/* 初始化 */
function init() {
  renderNav();
  renderContent();
  setupSearch();
  setupNavClick();
  setupCopy();
  /* 默认激活第一个 */
  var first = document.querySelector('.spec-nav-item');
  if (first) first.classList.add('active');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
