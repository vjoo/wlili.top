<script>
/* ============================================
   WLi Tools - 在线工具集
   © 2025 WLi. All rights reserved.
   Developer: WLi
   ============================================ */
(function() {
  const categoryTabs = document.querySelectorAll('.category-tab');
  const toolCards = document.querySelectorAll('.tool-card');
  let currentCategory = 'all';

  /* 初次加载：重置动画后设置错开入场延迟，确保延迟生效 */
  toolCards.forEach((card, i) => {
    card.style.animation = 'none';
    card.style.opacity = '0';
    void card.offsetWidth; /* 强制重排，确保动画重置 */
    card.style.animation = 'cardFadeIn 0.4s ease-out forwards';
    card.style.animationDelay = (i * 0.05) + 's';
  });

  function filterTools() {
    let visIdx = 0;
    toolCards.forEach(card => {
      const cat = card.dataset.cat;
      const show = currentCategory === 'all' || cat === currentCategory;
      if (show) {
        card.style.display = '';
        card.style.animation = 'none';
        card.style.opacity = '0';
        void card.offsetWidth; /* 强制重排，重置动画 */
        card.style.animation = 'cardFadeIn 0.4s ease-out forwards';
        card.style.animationDelay = (visIdx * 0.05) + 's';
        visIdx++;
      } else {
        card.style.display = 'none';
      }
    });
  }

  categoryTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      categoryTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      filterTools();
    });
  });
})();
</script>

<script>
(function(){
  if (localStorage.getItem('privacyNoticeDismissed')) return;
  var brand = document.getElementById('navBrandText');
  if (!brand) return;
  var tag = document.createElement('span');
  tag.id = 'privacyNotice';
  tag.title = '不必担心全部都在本地运算，数据不上传服务器，关闭浏览器页面即自动清除';
  tag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#B45F06;background:#FFF5E5;padding:3px 10px;border-radius:100px;margin-left:8px;white-space:nowrap;vertical-align:middle;transition:opacity 0.2s;';
  tag.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#FF6B6B" stroke="none"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>本地运算<button id="privacyNoticeClose" style="background:none;border:none;color:#B45F06;cursor:pointer;padding:0 0 0 4px;font-size:13px;line-height:1;" title="不再提示">×</button>';
  brand.parentNode.appendChild(tag);
  document.getElementById('privacyNoticeClose').addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    tag.style.opacity = '0';
    setTimeout(function(){ tag.remove(); }, 200);
    localStorage.setItem('privacyNoticeDismissed', '1');
  });
})();
