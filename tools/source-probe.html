<style>
  /* 主视觉：居中输入 */
  .hero { text-align: center; padding-block: 12px 40px; }
  .hero h1 { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .hero p { margin-top: 10px; font-size: var(--fs-base); color: var(--ink-tertiary); line-height: 1.6; }

  .probe-box {
    display: flex; align-items: center; gap: 8px;
    max-width: 600px; margin: 28px auto 0; padding: 6px 6px 6px 22px;
    background: var(--bg-white); border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .probe-box:focus-within { border-color: var(--ink); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
  .probe-box input {
    flex: 1; min-width: 0; padding: 11px 0;
    border: none; background: transparent; outline: none;
    font-size: var(--fs-base); color: var(--ink); font-family: inherit;
  }
  .probe-box input::placeholder { color: var(--ink-quaternary); }
  .probe-box .btn-filled { flex-shrink: 0; padding: 11px 22px; min-width: 132px; }

  .field-hint { font-size: var(--fs-xs); color: var(--ink-quaternary); margin-top: 6px; line-height: 1.5; }

  /* 进度反馈：测速是串行的（并发会互抢带宽，测出来的"最快"就不可信），
     十几条线路要跑一阵，因此必须有可见进度 —— 否则页面看着像卡死。 */
  .progress { max-width: 600px; margin: 0 auto 20px; }
  .progress-track { height: 3px; background: var(--border-light); border-radius: var(--radius-pill); overflow: hidden; }
  .progress-bar {
    height: 100%; width: 0; background: var(--ink); border-radius: inherit;
    transition: width 0.25s ease;
  }
  /* 抓页 / 解析阶段总时长未知 → 不确定态：小条来回跑 */
  .progress-bar.indet { width: 30%; transition: none; animation: indet 1.1s linear infinite; }
  @keyframes indet { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }
  .progress-text {
    margin-top: 9px; text-align: center; font-size: var(--fs-xs); color: var(--ink-quaternary);
    font-variant-numeric: tabular-nums;
  }
  .progress-text .spin { width: 10px; height: 10px; color: var(--ink-tertiary); }
  @media (prefers-reduced-motion: reduce) {
    .progress-bar.indet { animation: none; width: 100%; opacity: 0.35; }
  }
  .spin {
    display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px;
    border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ⚠️ 必须显式补这条：`.spin` 的 `display:inline-block` 是类选择器（0,1,0），
     优先级高于 UA 样式表里的 `[hidden]{display:none}`（0,1,0 但 UA 层级更低），
     所以 JS 里设 el.hidden = true 会**静默失效** —— 元素照常显示、动画照常转。
     完成态「旋转图标不收」就是这么来的。 */
  .spin[hidden] { display: none; }
  tbody tr[data-state="queue"] td { opacity: 0.5; }

  /* 日志 */
  .log {
    background: var(--bg); border: 1px solid var(--border-light); border-radius: var(--radius-md);
    padding: 14px 16px; font-size: var(--fs-xs); line-height: 1.8; color: var(--ink-secondary);
    font-family: 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace; margin-bottom: 20px;
  }
  .log:empty { display: none; }
  .log .err { color: var(--red); }
  .log .ok { color: #1d8a3e; }

  /* 结果表 */
  .result-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .result-title { font-size: var(--fs-lg); font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .result-sub { font-size: var(--fs-xs); color: var(--ink-quaternary); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border-light); border-radius: var(--radius-md); }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); min-width: 760px; table-layout: fixed; }
  th {
    text-align: left; padding: 11px 14px; font-weight: 500; font-size: var(--fs-xs);
    color: var(--ink-tertiary); background: var(--bg); border-bottom: 1px solid var(--border-light);
    white-space: nowrap;
  }
  td { padding: 13px 14px; border-bottom: 1px solid var(--border-light); color: var(--ink); vertical-align: middle; }
  /* 定宽列：只有「地址」列吸收弹性空间，长 URL 既挤不扁「复制」也不撑破表格 */
  th:nth-child(1), td:nth-child(1) { width: 52px; }
  th:nth-child(2), td:nth-child(2) { width: 110px; }
  th:nth-child(3), td:nth-child(3) { width: 118px; white-space: nowrap; }
  th:nth-child(4), td:nth-child(4) { width: 112px; white-space: nowrap; }
  th:nth-child(5), td:nth-child(5) { width: 130px; white-space: nowrap; }
  th:nth-child(7), td:nth-child(7) { width: 84px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.best { background: rgba(52, 199, 89, 0.06); }
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
    font-size: var(--fs-xs); color: var(--ink-tertiary); font-weight: 500;
  }
  tr.best .rank { background: var(--green); color: #fff; }
  .name-cell { font-weight: 500; overflow: hidden; }
  .name-cell .sub { font-weight: 400; font-size: var(--fs-xs); color: var(--ink-quaternary); margin-top: 2px; }
  .url-cell {
    font-family: 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace; font-size: var(--fs-xs);
    color: var(--ink-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .speed-val { font-size: var(--fs-md); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .speed-val .unit { font-size: var(--fs-xs); font-weight: 400; color: var(--ink-tertiary); margin-left: 2px; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: var(--radius-pill);
    font-size: var(--fs-xs); font-weight: 500;
  }
  .pill.green { background: rgba(52,199,89,0.12); color: #1d8a3e; }
  .pill.orange { background: rgba(255,149,0,0.14); color: #a35b00; }
  .pill.red { background: rgba(255,59,48,0.12); color: var(--red); }
  .pill.gray { background: var(--bg); color: var(--ink-tertiary); }
  .copy-btn {
    border: 1px solid var(--border-light); background: var(--bg-white); color: var(--ink-secondary);
    border-radius: 6px; padding: 4px 10px; font-size: var(--fs-xs); cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--ink); color: var(--ink); }
  .empty { padding: 40px; text-align: center; color: var(--ink-quaternary); font-size: var(--fs-sm); }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(12px);
    background: var(--fill-black); color: #fff; padding: 10px 20px; border-radius: var(--radius-pill);
    font-size: var(--fs-sm); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 3000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // 解析服务地址：默认跟着页面所在主机走 —— 本机打开用 127.0.0.1，
  // 局域网（http://192.168.x.x:8080）打开就用同一个 IP 的 8899，手机也能直接用。
  // 换端口 / 服务在别的机器：加 ?api=http://host:port
  function isLanHost(h) {
    return /^10\./.test(h) || /^192\.168\./.test(h) ||
      /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /^169\.254\./.test(h) ||
      /\.local$/i.test(h);
  }
  function deriveApiBase() {
    var ov = '';
    try { ov = new URLSearchParams(location.search).get('api') || ''; } catch (e) {}
    if (ov) return ov.replace(/\/+$/, '');
    var h = location.hostname;
    if (!h) return 'http://127.0.0.1:8899';           // file:// 打开
    var local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
    if (local || isLanHost(h)) return location.protocol + '//' + h + ':8899';
    return 'http://127.0.0.1:8899';                    // 公网站点：只能回落本机
  }
  var API_BASE = deriveApiBase();
  var logEl = $('log'), tbody = $('tbody'), resultWrap = $('resultWrap'), resultSub = $('resultSub');

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function log(msg, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
  }
  function clearLog() { logEl.innerHTML = ''; }
  function base() { return API_BASE; }

  function mb(mbps) { return mbps / 8; }

  // 出场顺序：可用线路按速度降序（最快在前），失败的次要指标保持原顺序排到最后
  function sortRows(rows) {
    return rows.slice().sort(function (a, b) {
      if (!!a.ok !== !!b.ok) return a.ok ? -1 : 1;
      return (b.mbps || 0) - (a.mbps || 0);
    });
  }

  // 构建一行。state: 'queue' 排队中 / 'testing' 测速中 / 'done' 已出结果
  function buildRow(r, rank, isBest) {
    var state = r.state || 'done';
    var tr = document.createElement('tr');
    tr.setAttribute('data-state', state);
    if (r.i != null) tr.setAttribute('data-i', r.i);
    if (isBest) tr.className = 'best';

    var rankTd = document.createElement('td');
    rankTd.innerHTML = '<span class="rank">' + rank + '</span>';
    tr.appendChild(rankTd);

    var name = document.createElement('td');
    name.className = 'name-cell';
    var nm = r.name || (r.url ? r.url.split('/')[2] : '未命名');
    name.innerHTML = escapeHtml(nm) + '<div class="sub">' + (r.type === 'hls' ? 'HLS' : '文件') + '</div>';
    tr.appendChild(name);

    var sp = document.createElement('td');
    if (state === 'queue') {
      sp.innerHTML = '<span class="pill gray">排队</span>';
    } else if (state === 'testing') {
      sp.innerHTML = '<span class="pill gray"><span class="spin"></span>测速中</span>';
    } else if (r.ok) {
      sp.innerHTML = '<span class="speed-val">' + mb(r.mbps).toFixed(2) + '<span class="unit">MB/s</span></span>';
    } else {
      sp.innerHTML = '<span class="pill gray">失败</span>';
    }
    tr.appendChild(sp);

    var tt = document.createElement('td');
    tt.textContent = (state === 'done' && r.ok) ? (r.ttfb + ' ms') : '—';
    tt.style.color = 'var(--ink-tertiary)';
    tr.appendChild(tt);

    var ra = document.createElement('td');
    if (state === 'queue') {
      ra.innerHTML = '<span class="pill gray">待测</span>';
    } else if (state === 'testing') {
      ra.innerHTML = '<span class="pill gray">—</span>';
    } else if (r.ok && r.ratio != null) {
      var cls = r.ratio < 0.7 ? 'green' : (r.ratio < 1 ? 'orange' : 'red');
      var label = r.ratio < 0.7 ? '流畅' : (r.ratio < 1 ? '偏紧' : '会卡');
      ra.innerHTML = '<span class="pill ' + cls + '">' + label + ' ' + r.ratio + '</span>';
    } else if (r.ok) {
      ra.innerHTML = '<span class="pill green">可用</span>';
    } else {
      var full = r.error || '不可用';
      ra.innerHTML = '<span class="pill red" title="' + escapeHtml(full) + '">' + failLabel(full) + '</span>';
    }
    tr.appendChild(ra);

    var url = document.createElement('td');
    url.className = 'url-cell';
    url.textContent = r.url || '';
    url.title = r.url || '';
    tr.appendChild(url);

    var act = document.createElement('td');
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.addEventListener('click', function () { copy(r.url || ''); });
    act.appendChild(btn);
    tr.appendChild(act);

    return tr;
  }

  // 最终渲染：按速度降序重排，第一名高亮
  function render(list) {
    var sorted = sortRows(list || []);
    tbody.innerHTML = '';
    resultWrap.hidden = false;
    var okCount = sorted.filter(function (r) { return r.ok; }).length;
    resultSub.textContent = '共 ' + sorted.length + ' 条，可用 ' + okCount + ' 条 · 按速度降序';
    if (!sorted.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">没有可展示的结果</td></tr>';
      return;
    }
    sorted.forEach(function (r, i) {
      r.state = 'done';
      tbody.appendChild(buildRow(r, i + 1, !!r.ok && i === 0));
    });
  }

  // 流式过程中只替换单行，避免整表重绘导致视觉跳动
  function replaceRow(i) {
    var old = tbody.querySelector('tr[data-i="' + i + '"]');
    if (!old || !rowList[i]) return;
    old.parentNode.replaceChild(buildRow(rowList[i], i + 1, false), old);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 失败原因压成 ≤4 字标签（表格列窄，长文案会撑破布局）；完整原因挂在 pill 的 title 上，悬停可看
  function failLabel(e) {
    e = String(e || '');
    if (/速度为 0/.test(e)) return '零速度';
    if (/timeout|timed out|超时/i.test(e)) return '超时';
    if (/没找到.*地址/.test(e)) return '未找到源';
    if (/未给出直链/.test(e)) return '无直链';
    if (/挑战页|突破挑战/.test(e)) return '挑战失败';
    if (/无可用 variant/i.test(e)) return '无清晰度';
    if (/未找到分片/.test(e)) return '无分片';
    if (/采样不足/.test(e)) return '采样不足';
    var m = e.match(/\b(\d{3})\b/);
    if (m) return '源' + m[1];
    if (/返回 0\b|connect|连接/i.test(e)) return '连不上';
    if (/失败/.test(e)) return '请求失败';
    return '不可用';
  }
  function copy(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制地址'); }, function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制地址'); } catch (e) { toast('复制失败'); }
    document.body.removeChild(ta);
  }

  var urlInput = $('urlInput'), btnProbe = $('btnProbe');
  var btnLabel = btnProbe.textContent;
  var progressEl = $('progress'), progressBar = $('progressBar'), progressText = $('progressText');
  var progressLabel = $('progressLabel');
  var progressSpin = progressText.querySelector('.spin');

  var rowList = [];     // 与后端 items 同序（流式过程中不重排，完成后才按速度排）
  var totalN = 0;
  var running = false;
  var doneSeen = false;

  // mode: 'indet'（总时长未知）| 'det'（已知总数）；spinning=false 时收掉旋转图标（完成态）
  function prog(mode, cur, total, text, spinning) {
    progressEl.hidden = false;
    progressLabel.textContent = text || '';
    progressSpin.hidden = spinning === false;
    if (mode === 'indet') {
      progressBar.classList.add('indet');
      progressBar.style.width = '';
    } else {
      progressBar.classList.remove('indet');
      progressBar.style.width = (total ? Math.round(cur / total * 100) : 0) + '%';
    }
  }
  function progDone() { prog('det', 1, 1, '', false); }
  function progHide() {
    progressEl.hidden = true;
    progressBar.classList.remove('indet');
    progressBar.style.width = '0';
  }

  function onEvent(ev) {
    if (ev.t === 'phase') {
      prog('indet', 0, 0, ev.msg);
      btnProbe.textContent = ev.phase === 'parse' ? '解析线路中…' : '连接中…';
    } else if (ev.t === 'log') {
      log('· ' + ev.msg);
    } else if (ev.t === 'parse') {
      // 线路解析要并发抓十几个子页，这几秒必须给出计数，否则又像卡死
      prog('indet', 0, 0, '正在解析线路… ' + ev.done + '/' + ev.total);
      btnProbe.textContent = '解析线路中…';
    } else if (ev.t === 'sources') {
      totalN = ev.total;
      rowList = ev.items.map(function (it) { it.state = 'queue'; return it; });
      resultWrap.hidden = false;
      resultSub.textContent = '共 ' + totalN + ' 条 · 逐个测速中，完成后按速度降序';
      tbody.innerHTML = '';
      rowList.forEach(function (r) { tbody.appendChild(buildRow(r, r.i + 1, false)); });
      btnProbe.textContent = '测速中 0/' + totalN;
      prog('det', 0, totalN, '共 ' + totalN + ' 条线路，开始测速');
    } else if (ev.t === 'testing') {
      rowList[ev.i].state = 'testing';
      replaceRow(ev.i);
      btnProbe.textContent = '测速中 ' + ev.n + '/' + ev.total;
      prog('det', ev.n - 1, ev.total, '正在测速 ' + ev.n + '/' + ev.total + ' · ' + ev.name);
    } else if (ev.t === 'result') {
      var r = ev.r || {};
      for (var k in r) { if (Object.prototype.hasOwnProperty.call(r, k)) rowList[ev.i][k] = r[k]; }
      rowList[ev.i].state = 'done';
      replaceRow(ev.i);
      btnProbe.textContent = '测速中 ' + ev.n + '/' + ev.total;
      prog('det', ev.n, ev.total, '已完成 ' + ev.n + '/' + ev.total);
    } else if (ev.t === 'error') {
      log('× ' + ev.msg, 'err');
    } else if (ev.t === 'done') {
      doneSeen = true;
      log('✓ 测速完成，耗时 ' + ev.elapsed + 's（可用 ' + ev.ok + '/' + ev.total + '）', 'ok');
      progDone();
      progressLabel.textContent = '完成 · 共 ' + ev.total + ' 条，用时 ' + ev.elapsed + 's';
      btnProbe.textContent = btnLabel;
      if (ev.speeds && ev.speeds.length) render(ev.speeds);
    }
  }

  // 逐行读取 NDJSON（服务端 chunked 推送）
  function consume(url) {
    return fetch(base() + '/api/probe-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url, segs: 3, timeout: 15 })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body || !res.body.getReader) {
        // 退化路径：浏览器不支持流式读取，整包收完再解析
        return res.text().then(function (t) {
          t.split('\n').forEach(function (l) { if (l.trim()) onEvent(JSON.parse(l)); });
        });
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          buf += dec.decode(chunk.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, idx);
            buf = buf.slice(idx + 1);
            if (line.trim()) { try { onEvent(JSON.parse(line)); } catch (e) { /* 半行/坏行忽略 */ } }
          }
          return pump();
        });
      }
      return pump();
    });
  }

  // 连接失败：只给一句能落地的原因
  function logConnHint(msg) {
    if (location.protocol === 'https:') {
      log('× 浏览器拦截了对本机服务的访问（网站设置里允许「本地网络访问」）', 'err');
      return;
    }
    log('× 连不上解析服务（' + API_BASE + '）：' + msg, 'err');
    if (isLanHost(location.hostname)) {
      log('  确认服务在跑、与电脑同一 Wi-Fi、防火墙放行 TCP 8899。', 'err');
    } else {
      log('  服务没启动 → 在 tools 目录执行：python probe_server.py', 'err');
    }
  }

  function doProbe() {
    var url = urlInput.value.trim();
    if (!url) { toast('请先粘贴播放页地址'); urlInput.focus(); return; }
    if (running) return;
    running = true;
    doneSeen = false;
    clearLog();
    tbody.innerHTML = '';
    resultWrap.hidden = true;
    rowList = [];
    totalN = 0;
    btnProbe.disabled = true;
    btnProbe.textContent = '连接中…';
    prog('indet', 0, 0, '正在请求播放页…');

    consume(url).catch(function (e) {
      var msg = String((e && e.message) || e);
      if (/Failed to fetch|NetworkError|Load failed|ERR_/i.test(msg)) {
        logConnHint(msg);
      } else {
        log('× 请求失败：' + msg, 'err');
      }
    }).then(function () {
      running = false;
      btnProbe.disabled = false;
      btnProbe.textContent = btnLabel;
      if (!doneSeen) progHide();   // 中途断流/服务端报错：别把进度条永远停在半路
    });
  }

  btnProbe.addEventListener('click', doProbe);
  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doProbe(); }
  });

})();
</script>
</body>
</html>
