<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob: https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'self';">
<link rel="stylesheet" href="common.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>手轮贴片字表 - WLi Tools</title>
<style>
/* ============================================================
   手轮贴片字表（wlili tools）
   视觉骨架照 cube-tile-table.html（3D 魔方字表）：
   深灰底板 #2B3041 + 象牙白芯片 #fffdf8 + 虚线空槽 #4a5064。
   ⛔ 与魔方不同：这里是「M 列轮盘 × N 行面序」，一列 = 一套 N 字字表。
   ============================================================ */
.whl-sec{padding:14px 0 10px; --inset-line:#dfe3ea;}  /* 统一白框浅灰描边（照 3D 魔方预览卡）*/
.whl-sec .section-inner{max-width:none; padding:0 24px;}

/* 顶部：只留读数 + 共 X 片（参数输入已移到右侧竖排按钮组） */
.whl-bar{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:var(--space-3);
  padding:0 0 var(--space-2);
}
.whl-count{font-size:var(--fs-sm); color:var(--ink-tertiary); white-space:nowrap;}
.whl-count b{color:var(--ink); font-variant-numeric:tabular-nums;}
/* ⛔ 规格串（Ø55.7275 / 面宽 12.0 / 贴片 11.0×15.8 / 字高 6.6 · 占片宽 60%）不在前端显示（用户 2026-11-08 定）；
   尺寸仍由 tileSpec() 照常算出并驱动格子布局，只是这行文案隐藏，要恢复删掉 display:none 即可 */
.whl-specbar{
  display:none;
  font-size:var(--fs-sm); color:var(--ink-tertiary); white-space:normal; line-height:1.5; text-align:center;
  padding:0 2px 10px; font-variant-numeric:tabular-nums;
}
.whl-specbar b{color:var(--ink-secondary);}

/* 字表：M 列横排，每列竖排 N 行（面序）。
   --tw/--th/--fs 由 JS 按真实贴片尺寸联动写入：格子 = 一片贴片的等比缩略，
   字按插件默认字号 18 mm（超贴片时按内边距自动缩放）的真实占比居中，
   才能预览「字贴上去占多大」。
   整块水平居中；每列的格子区是固定高度视窗，装不下时由右侧 ▲/▼ 按面序逐格平移。 */
.whl-stage{
  display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:16px; width:100%;
}
.whl-grid{ min-width:0;
  display:flex; gap:16px; align-items:flex-start;
  overflow-x:auto; overflow-y:hidden; padding:2px 2px 0;
  max-width:100%;
  /* ⛔ 别在这里写 --tw/--th 默认值：局部变量会压掉从 #stage 继承的
     插件派生值，导致格子与右侧按钮尺寸不同源。只留 --cells-h。 */
  --cells-h:300px;}
.whl-col{flex:0 0 auto; display:flex; align-items:stretch; gap:6px;
  width:calc(var(--tw) + 40px);}   /* 主区（片）+ 右侧独立翻页列；序号改为 hover 框内显示，不再占左侧列宽 */
.whl-col-main{flex:0 0 auto; min-width:0; width:var(--tw);}
/* 列头照魔方 .face-head：色块 + 面名 + 已填/总数 */
.whl-col-head{display:flex; align-items:center; gap:6px; padding:0 2px 5px; width:100%; flex-wrap:wrap;}
.whl-swatch{
  width:12px; height:12px; border-radius:4px; flex:none;
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25);
}
.whl-col-head b{font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap;}
/* 列内容互换拖柄（照 3D 魔方 .drag-h，2026-11-09）：⛔ 只有它能发起拖动 */
.whl-drag-h{
  display:inline-flex; align-items:center; justify-content:center;
  width:14px; height:18px; flex:none; font-size:12px; line-height:1;
  color:var(--ink-secondary,#8a90a0); cursor:grab; user-select:none; border-radius:4px;
}
.whl-drag-h:hover{background:rgba(43,48,65,.08); color:var(--ink,#2b3041);}
.whl-drag-h:active{cursor:grabbing;}
.whl-col.dragging{opacity:.4;}
.whl-col.drop-target{outline:2px dashed #65a30d; outline-offset:3px; border-radius:14px;}
/* 点选式互换（触屏兜底）：点一下源列、再点目标列。选中后其余列头变绿＝可点目标 */
#grid.picking .whl-col-head{background:rgba(101,163,13,.10); border-radius:8px;}
#grid.picking .whl-drag-h{color:#2f6d0a; background:rgba(101,163,13,.16);}
.whl-col.pick-src{outline:2px dashed #65a30d; outline-offset:3px; border-radius:14px;}
.whl-col.pick-src .whl-col-head{background:rgba(101,163,13,.22);}
.whl-drag-tip{display:none; font-size:var(--fs-sm,13px); color:var(--ink-tertiary);}
/* 轻提示（与魔方 #ctg_toast 同规格） */
#whl_toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--fill-black,#2b3041); color:#fff; padding:9px 20px; border-radius:999px;
  font-size:var(--fs-sm,13px); opacity:0; pointer-events:none; transition:all .25s; z-index:1400;
}
#whl_toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* 色槽 UI 已隐藏（用户 2026-11-08 定稿）：列头只留「小方块 + 面n」，
   后台 state.wcols[j] 仍保留 {bg,fg} 两种材质（底色默认 #fffdf8 白、字色默认=小方块色）。
   下列 .whl-cslot / 取色弹层样式保留备用，不参与渲染。 */
.whl-cslot{
  display:inline-flex; align-items:center; gap:3px; padding:1px 5px 1px 2px;
  border:1.5px solid var(--inset-line); border-radius:8px; background:#fffdf8;
  cursor:pointer; font-style:normal; line-height:1;
  transition:border-color .12s, box-shadow .12s;
}
.whl-cslot:hover{border-color:var(--link); box-shadow:0 0 0 2px rgba(224,131,58,.18);}
.whl-cslot .whl-csw{
  width:14px; height:14px; border-radius:4px; flex:none;
  border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.22);
}
.whl-cslot i{font-style:normal; font-size:9.5px; font-weight:700; color:var(--ink-secondary);}
/* 取色弹层 */
.whl-pop{
  position:fixed; z-index:1300; min-width:176px; padding:10px;
  background:var(--bg-white); border:1.5px solid var(--inset-line); border-radius:12px;
  box-shadow:0 16px 40px -12px rgba(20,22,30,.45); display:none;
}
.whl-pop.show{display:block;}
.whl-pop .pp-h{font-size:11px; color:var(--ink-tertiary); margin-bottom:7px;
  display:flex; justify-content:space-between; align-items:center;}
.whl-pop .pp-close{border:none; background:transparent; color:var(--ink-tertiary);
  cursor:pointer; font-size:15px; line-height:1; padding:0 2px;}
.whl-pop .pp-close:hover{color:var(--ink);}
.whl-pop .pp-sw{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.whl-pop .pp-sw button{
  width:26px; height:26px; border-radius:7px; border:2px solid #fff; cursor:pointer; padding:0;
  box-shadow:0 0 0 1px rgba(0,0,0,.18); position:relative;
}
.whl-pop .pp-sw button.on{box-shadow:0 0 0 2px var(--link);}
.whl-pop .pp-custom{display:flex; align-items:center; gap:7px;
  border-top:1px dashed var(--inset-line); padding-top:8px;}
.whl-pop .pp-custom input[type=color]{width:30px; height:26px; border:1px solid var(--inset-line);
  border-radius:6px; padding:0; background:none; cursor:pointer;}
.whl-pop .pp-add{border:1.5px solid var(--inset-line); background:#fffdf8; color:var(--ink);
  border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer;}
.whl-pop .pp-add:hover{background:var(--link); color:#fff;}
.whl-pop .pp-err{color:#d91f1f; font-size:11px; margin-top:6px; min-height:14px;}
.whl-fcount{display:block; font-size:9px; color:var(--ink-tertiary);
  font-variant-numeric:tabular-nums; white-space:nowrap; text-align:left; padding:4px 2px 0;}
.whl-cells{
  width:var(--tw); height:var(--cells-h); overflow:hidden; box-sizing:border-box;
  background:#3a4356; padding:6px; border-radius:12px;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
}
/* 格子 = 照 3D 魔方 .cell：空 = 虚线槽 #4a5064（透出深底板）；有字 = 纯象牙白芯片 #fffdf8，无内描边 */
.whl-track{
  display:flex; flex-direction:column; gap:6px;
  transform:translateY(0);   /* ⛔ 不加 transition：逐格翻页要即时到位，连点不追赶 */
}
.whl-row{display:flex; align-items:center; gap:6px;}
.whl-cell{
  position:relative;                              /* 序号角标定位基准 */
  flex:0 0 auto; box-sizing:border-box; width:100%; height:var(--th); padding:0;
  border:1.5px dashed #4a5064; border-radius:9px;   /* 空槽（照 .cell.empty） */
  background:transparent; color:var(--ink);          /* 透出 #2B3041 底板 */
  font-family:inherit; font-size:var(--fs); font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  text-align:center; cursor:pointer; user-select:none; outline:none; overflow:hidden;
  transition:transform .12s, box-shadow .12s, border-color .12s;
}
.whl-cell:hover{transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(0,0,0,.22);}
.whl-cell.sel{box-shadow:0 0 0 2px rgba(224,131,58,.55);}
/* 有字 = 贴了片：照 3D 魔方 .cell —— 象牙白芯片 #fffdf8 + 深墨字；
   深底与白芯片之间加一条浅灰绿「粗描边」（照参考图：深底↔白芯片的粗边），
   格子四周的「深色边框」由 .whl-cells 深底 + 格子间 gap 形成（与魔方 .grid9 一致）*/
.whl-cell.filled{
  border:5px solid #d9e3dc; background:#fffdf8; color:var(--ink);
}
.whl-cell.filled:hover{
  box-shadow:0 4px 10px rgba(0,0,0,.22);
}
.whl-cell .ch{display:block; max-width:100%; overflow:hidden;}
/* 序号角标：默认隐藏，鼠标移上才浮现。宽 = 格子内容宽 2/3，居中覆盖，字号随格子等比 */
.whl-ano{
  position:absolute; left:50%; top:50%; z-index:2;
  transform:translate(-50%,-50%);
  width:66.6%; box-sizing:border-box;
  padding:.18em 0; border-radius:9px; text-align:center;
  font-size:calc(var(--tw) * .155); line-height:1.25;
  background:rgba(255,255,255,.95); color:#6b6459;
  border:1px solid rgba(0,0,0,.10);
  box-shadow:0 2px 8px rgba(43,48,65,.18);
  letter-spacing:.5px; font-variant-numeric:tabular-nums; pointer-events:none;
  opacity:0; transition:opacity .12s;
}
.whl-cell:hover .whl-ano{opacity:1;}

/* 右侧竖排分组：每组 = 卡片外的浅色小标题 + 深底卡片（照魔方 .tb-face）
   ⛔ 标题必须在深底**外面**（用户 2026-11-09 定，同魔方 .tb-head 规则：
      塞进深色卡片就变成「黑框里的一行小字」，一眼半成品）。 */
.whl-side{
  flex:0 0 auto;
  /* 2px 上内边距 = .whl-grid 的同名留白，第一组标题才能和「面1」那行齐平 */
  display:flex; flex-direction:column; gap:14px; align-items:stretch;
  padding:2px 0 0;
}
.whl-grp{
  /* gap:0 —— 标题自带 5px 下留白（同 .whl-col-head），再叠 gap 会把卡片顶边推离格顶 */
  display:flex; flex-direction:column; gap:0; width:98px;
}
/* 组标题：与列头「面1」同规格（11px / 600 / 5px 下留白），
   行高对齐列头那一行 —— 卡片顶边才能与贴片格顶边齐平 */
.whl-grp-h{
  display:flex; align-items:center; justify-content:center;
  height:21px; box-sizing:border-box; padding:0 2px 5px;
  font-size:11px; font-weight:600; color:var(--ink-tertiary);
  line-height:1; letter-spacing:.2px; white-space:nowrap;
}
/* 深色卡片：只装控件，不装标题 */
.whl-grp-body{
  display:flex; flex-direction:column; gap:6px;
  padding:8px; border-radius:14px; background:#3a4356;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
}
/* 功能方块按钮：象牙白芯片；尺寸独立于填字白框，做得更大、文字更满更大（单行） */
.whl-sq{
  position:relative; overflow:hidden;
  width:100%; min-height:52px;
  padding:6px 4px; border:1.5px solid var(--inset-line); border-radius:10px;
  background:#fffdf8; color:var(--ink); font-weight:600; font-size:15px;
  font-family:inherit; line-height:1.25; text-align:center; white-space:nowrap;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .12s, box-shadow .12s;
}
.whl-sq span{display:block; width:100%;}
.whl-sq:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.25);}
.whl-sq:active{transform:scale(.98);}
/* 热端两档切换：照魔方 .whl-hot，但在组内占满宽 */
.whl-hot{display:inline-flex; border:1px solid #3a4156; border-radius:8px;
  overflow:hidden; width:100%;}
.whl-hot button{
  flex:1 1 0; border:none; background:#fffdf8; color:var(--ink-secondary);
  padding:7px 4px; font-size:12px; font-family:inherit; cursor:pointer;
  border-right:1px solid #3a4156;
}
.whl-hot button:last-child{border-right:none;}
.whl-hot button.on{background:#e0833a; color:#fff;}
/* 数量按钮：点击开数量弹窗 */
.whl-cnt{width:100%; border:1.5px solid var(--inset-line); border-radius:9px; background:#fffdf8;
  color:var(--ink); font-weight:600; padding:8px 6px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:transform .12s, box-shadow .12s;}
.whl-cnt:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.25);}
.whl-cnt b{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1;}
.whl-cnt span{font-size:10px; color:var(--ink-tertiary);}

/* 每列右侧的独立翻页：▲/▼ 各列一套，点一下滚动一格；中间不放文字 */
.whl-col-pg{
  flex:0 0 auto; display:flex; flex-direction:column;
  justify-content:center; align-items:center; gap:8px; width:34px;
}
.whl-pg-btn{
  width:34px; height:34px; border-radius:9px; border:1.5px solid var(--inset-line);
  background:#fffdf8; color:var(--ink-secondary); cursor:pointer;
  font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  transition:background .12s, color .12s;
}
.whl-pg-btn:hover:not(:disabled){background:#e0833a; color:#fff;}
.whl-pg-btn:disabled{opacity:.35; cursor:default;}

/* 弹窗（自绘一套类名，避免后台 missing-class 陷阱） */
.whl-mask{
  position:fixed; inset:0; background:rgba(20,22,30,.44); z-index:1200;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.whl-mask.show{display:flex;}
.whl-dlg{
  background:var(--bg-white); border-radius:var(--radius-lg); width:640px; max-width:94vw;
  padding:var(--space-6); box-shadow:0 24px 60px rgba(0,0,0,.3); max-height:92vh;
  display:flex; flex-direction:column;
}
.whl-dlg.wide{width:min(1040px,94vw);}
.whl-dlg .btn-outline, .whl-dlg .btn-filled{
  padding:6px 14px; font-size:14px; line-height:1.3; border-width:1px; gap:6px;
}
.whl-dlg h3{font-size:var(--fs-lg); font-weight:600; margin-bottom:var(--space-4);
  display:flex; align-items:center; gap:var(--space-2); flex:none;}
.face-tag{font-size:12px; font-weight:600; color:var(--ink-tertiary);
  background:var(--bg); padding:2px 8px; border-radius:999px;}
.whl-x{margin-left:auto; flex:none; width:28px; height:28px; padding:0; border-radius:50%;
  border:none; background:transparent; color:var(--ink-tertiary); cursor:pointer;
  display:flex; align-items:center; justify-content:center; line-height:1;}
.whl-x:hover{background:rgba(0,0,0,.06); color:var(--ink);}
.whl-x svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round;}

/* 编辑格子弹窗 */
.whl-ed-body{display:flex; gap:var(--space-5); flex:1 1 auto; min-height:0;}
.whl-ed-left{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:var(--space-3);}
.whl-fld2{display:flex; flex-direction:column; gap:5px;}
.whl-fld2 > label{font-size:var(--fs-sm); color:var(--ink-secondary); font-weight:600;}
.whl-fld2 input[type=text], .whl-fld2 input[type=number], .whl-fld2 select{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px;
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg-white); width:100%;
}
.whl-fld2 input:focus, .whl-fld2 select:focus{outline:none; border-color:var(--link);}
.whl-ed-note{font-size:var(--fs-xs); color:var(--ink-tertiary); line-height:1.5;}
/* 自动缩放开关（照魔方 .ctg-sw） */
.whl-sw{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
.whl-sw input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
.whl-sw .tk{width:38px; height:22px; border-radius:11px; background:var(--border);
  position:relative; flex:none; transition:background .16s ease;}
.whl-sw .tk::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
  border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.28); transition:transform .16s ease;}
.whl-sw input:checked + .tk{background:var(--link);}
.whl-sw input:checked + .tk::after{transform:translateX(16px);}
.whl-sw input:focus-visible + .tk{outline:2px solid var(--link); outline-offset:2px;}
.whl-sw .tx{font-size:var(--fs-sm); color:var(--ink-secondary); font-weight:600; min-width:2.2em;}
.whl-sw .tx.off{color:var(--ink-tertiary); font-weight:400;}
.whl-sw .tx .dft{font-weight:400; color:var(--ink-tertiary);}
/* 贴片预览卡（照魔方 .ctg-prev） */
.whl-ed-right{flex:0 0 auto; width:180px; display:flex; flex-direction:column;
  align-items:center; gap:var(--space-2);}
.whl-cap{font-size:var(--fs-xs); color:var(--ink-tertiary);}
.whl-prev{position:relative; overflow:hidden; width:180px; height:180px;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:#2B3041; display:flex; align-items:center; justify-content:center;}
.whl-prev .ch{color:#fffdf8; font-weight:700; line-height:1; max-width:90%; text-align:center;
  overflow:hidden;}

.whl-exp-row{display:flex; align-items:center; gap:8px; margin-bottom:var(--space-2); flex:none;
  font-size:var(--fs-sm); color:var(--ink-secondary);}
.whl-exp-row select, .whl-exp-row input[type=text]{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 8px;
  font-family:inherit; font-size:var(--fs-sm); color:var(--ink); background:var(--bg-white);
}
.whl-exp-row input[type=text]{flex:1 1 auto; min-width:0;}
.whl-exp-row input[type=number]{width:72px; padding:5px 8px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-family:inherit; font-size:var(--fs-sm);
  font-variant-numeric:tabular-nums;}
.whl-exp-row .ext{color:var(--ink-tertiary); font-variant-numeric:tabular-nums;}
.whl-ta{
  flex:1 1 auto; min-height:270px; width:100%; resize:vertical;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12.5px; line-height:1.55; color:var(--ink); background:var(--bg);
}
.whl-foot{display:flex; align-items:center; gap:8px; padding-top:var(--space-4); flex:none;}
.whl-foot .sp{flex:1 1 auto;}
.whl-foot .left{display:flex; gap:8px;}
.whl-hint{font-size:var(--fs-sm); color:var(--ink-tertiary); padding-top:6px; flex:none;}

/* 加密包（CTGTILE/3，与魔方同一套容器/密钥）——客户视角只有这一档：
   标签栏整条藏起来，明文 md/json 收进调试模式（?dev=1 或连点标题 5 次）。 */
.whl-dlg .whl-tabs{display:flex;}
body:not(.dev) .whl-dlg .whl-tabs{display:none;}
.whl-tab.dev-tab{display:none;}
body.dev .whl-tab.dev-tab{display:flex;}
.whl-pack{
  display:none; flex:1 1 auto; min-height:min(34vh, 300px);
  flex-direction:column; align-items:center; justify-content:center; text-align:center;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:linear-gradient(180deg, #fbfcff 0%, #f5f7fb 100%);
  padding:var(--space-5);
}
.whl-pack.on{display:flex;}
.whl-pack .pk-ic{
  flex:none; width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#e8effc; color:#2f6be0;
}
.whl-pack .pk-ic svg{width:26px; height:26px; display:block;}
.whl-pack .pk-t{margin-top:16px; font-size:var(--fs-md); font-weight:600; color:var(--ink); line-height:1.4;}
.whl-pack .pk-s{margin-top:7px; max-width:min(560px, 100%); font-size:var(--fs-xs); color:var(--ink-tertiary); line-height:1.6;}
.whl-pack .pk-dl{margin-top:22px;}
.whl-pack.err .pk-ic{background:#fdeaea; color:#c0392b;}
.whl-pack.err .pk-t{color:#c0392b;}
.whl-pack-hint{display:none; font-size:var(--fs-sm); line-height:1.6; color:var(--ink-tertiary);
  padding-top:8px; flex:none;}
.whl-pack-hint.on{display:block;}
.whl-pack-hint b{color:var(--ink-secondary); font-weight:600;}
.whl-out{flex:1 1 auto; min-height:0; display:flex;}
.btn-outline:disabled{opacity:.45; cursor:not-allowed;}

/* 预览弹窗：iframe 载入现有 wheel-assembly.html?embed=1 */
.whl-pv-frame{
  width:100%; height:min(72vh,620px); min-height:380px;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:var(--bg); display:block;
}
.whl-pv-note{font-size:var(--fs-sm); color:var(--ink-tertiary); padding-top:8px; flex:none;}

@media (max-width:768px){
  .whl-sec .section-inner{padding:0 12px;}
  .whl-col{width:142px;}
  .whl-pv-frame{height:min(66vh,480px);}
  /* 触控 44px 基线（同魔方 2026-11-09 定稿）：热端两档 28px、翻页箭头 34px 在手机上点不准。
     列宽 142px 里本来就留了余量，箭头放大到 44 不会挤到贴片。 */
  .whl-hot button{min-height:44px; font-size:13.5px;}
  .whl-col-pg{width:44px;}
  .whl-pg-btn{width:44px; height:44px; font-size:15px;}
  /* 2026-11-09 17:31 用户定「要换行的」：手机上 5 列不再横向滑动，改成 2-3 行排列。
     ⛔ 配套：JS layout() 在窄屏跳过「一屏收敛」——换行成多行后强求一屏会把可见行压到 1 格。 */
  /* ⛔ 必须写简写 overflow:visible —— 只写 overflow-x:visible 而 overflow-y 仍是 hidden 时，
        CSS 规范会把 visible 计算回 auto（横滚条仍在）。 */
  .whl-grid{flex-wrap:wrap; overflow:visible; justify-content:center; width:100%;}
  /* 触屏点选互换：整条列头 44px 高当点击热区（色块/面名只作展示，无其它点击功能） */
  .whl-col-head{min-height:44px; cursor:pointer; flex-wrap:nowrap;}
  .whl-drag-tip{display:inline;}
}
</style>
</head>
<body>

<section class="section whl-sec">
  <div class="section-inner">
    <div class="whl-bar">
      <span class="whl-count" id="count">共 <b>50</b> 片</span>
      <span class="whl-drag-tip">点两下列头 ⠿ 即可互换两列字表（触屏也能用）</span>
    </div>

    <!-- 贴片等比读数单独一行：不挤参数条，也让「字占片多少」一眼可见 -->
    <div class="whl-specbar" id="spec"></div>
    <div class="whl-stage" id="stage">
      <div class="whl-grid" id="grid"></div>
      <div class="whl-side">
        <!-- A 组：重置 + 热端（照魔方排版，置于生成预览上方） -->
        <div class="whl-grp">
          <div class="whl-grp-h">重置 / 热端</div>
          <div class="whl-grp-body">
            <button class="whl-sq" id="btn_reset" type="button" data-act="reset" title="重置字表"><span>重置字表</span></button>
            <div class="whl-hot" id="hotend" role="group" aria-label="贴片热端（喷嘴）">
              <button type="button" data-h="H02" title="0.2 喷嘴：孔 φ2.25 / 销 φ2.10 / 间隙 0.15">0.2</button>
              <button type="button" data-h="H04" class="on" title="0.4 喷嘴：孔 φ2.30 / 销 φ2.10 / 间隙 0.20">0.4</button>
            </div>
          </div>
        </div>
        <!-- B 组：操作（生成预览这组按钮） -->
        <div class="whl-grp">
          <div class="whl-grp-h">操作</div>
          <div class="whl-grp-body">
            <button class="whl-sq" id="btn_preview" type="button" title="3D 预览"><span>生成预览</span></button>
            <button class="whl-sq" id="btn_export" type="button" title="导出字表"><span>导出字表</span></button>
            <button class="whl-sq" id="btn_import" type="button" title="导入字表"><span>导入字表</span></button>
          </div>
        </div>
        <!-- C 组：数量（点击开弹窗编辑） -->
        <div class="whl-grp">
          <div class="whl-grp-h">数量</div>
          <div class="whl-grp-body">
            <button class="whl-cnt" id="btn_n" type="button" title="设置轮盘面数"><b>10</b><span>轮盘面数</span></button>
            <button class="whl-cnt" id="btn_m" type="button" title="设置轮盘数量"><b>5</b><span>轮盘数量</span></button>
          </div>
        </div>
      </div>
    </div>
    <input type="file" id="import_file" accept=".ctgz,.md,.markdown,.json,text/markdown,application/json" hidden>
  </div>
</section>

<!-- 导出弹窗 -->
<div class="whl-mask" id="exp_mask">
  <div class="whl-dlg">
    <h3>导出字表
      <button class="whl-x" id="exp_close_x" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
      </button>
    </h3>
    <div class="whl-tabs" id="exp_tabs">
      <button class="whl-tab on" type="button" data-t="ctgz">加密包 · ctgz</button>
      <button class="whl-tab dev-tab" type="button" data-t="md">Blender 插件 · md</button>
      <button class="whl-tab dev-tab" type="button" data-t="json">整套数据 · json</button>
    </div>
    <div class="whl-exp-row">
      <span>文件名</span>
      <input type="text" id="exp_name" spellcheck="false" autocomplete="off" placeholder="留空 = 自动命名">
      <button class="btn-outline" id="exp_name_def" type="button">自动</button>
    </div>
    <!-- 加密包只露摘要，密文不进 DOM 文本（客户不需要、也不该看到那串 base64）。
         竖排居中：图标 / 标题 / 规格体积 / 下载按钮，全部在这张卡片里 -->
    <div class="whl-pack" id="exp_pack">
      <div class="pk-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10.5" width="16" height="10" rx="2.4"/>
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
          </g>
          <circle cx="12" cy="15.4" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="pk-t" id="exp_pack_t">正在生成加密包…</div>
      <div class="pk-s" id="exp_pack_s"></div>
      <button class="btn-outline pk-dl" id="exp_download_pk" type="button" disabled>下载文件</button>
    </div>
    <div class="whl-out" id="exp_ta_wrap"><textarea class="whl-ta" id="exp_ta" readonly spellcheck="false"></textarea></div>
    <div class="whl-pack-hint" id="exp_hint"></div>
    <div class="whl-foot">
      <div class="left"><button class="btn-outline" id="exp_download" type="button">下载文件</button></div>
      <span class="sp"></span>
      <button class="btn-outline" id="exp_close" type="button">关闭</button>
      <button class="btn-filled" id="exp_copy" type="button">复制到剪贴板</button>
    </div>
  </div>
</div>

<!-- 数量设置弹窗 -->
<div class="whl-mask" id="cnt_mask">
  <div class="whl-dlg" style="width:min(420px,94vw)">
    <h3>设置数量
      <button class="whl-x" id="cnt_close_x" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
      </button>
    </h3>
    <div class="whl-exp-row"><span>轮盘面数 (N)</span><input type="number" id="cnt_n" min="3" max="24" step="1"></div>
    <div class="whl-exp-row"><span>轮盘数量 (M)</span><input type="number" id="cnt_m" min="1" max="8" step="1"></div>
    <div class="whl-hint">面数 = 每个轮盘的贴片数（N 行面序）；轮盘数量 = 列数（一套 N 字 × M 轮盘）。</div>
    <div class="whl-foot">
      <span class="sp"></span>
      <button class="btn-outline" id="cnt_cancel" type="button">取消</button>
      <button class="btn-filled" id="cnt_apply" type="button">应用</button>
    </div>
  </div>
</div>

<!-- 编辑格子弹窗 -->
<div class="whl-mask" id="ed_mask">
  <div class="whl-dlg">
    <h3><span id="ed_title">编辑格子</span><span class="face-tag" id="ed_face"></span></h3>
    <div class="whl-ed-body">
      <div class="whl-ed-left">
        <div class="whl-fld2"><label>文字（单字）</label><input type="text" id="ed_ch" maxlength="1" placeholder="单字" autocomplete="off" spellcheck="false"></div>
        <div class="whl-fld2"><label>排版类型</label>
          <select id="ed_kind">
            <option value="SINGLE" selected>单字</option>
          </select>
        </div>
        <div class="whl-fld2"><label>字号 (mm)</label><input type="number" id="ed_size" min="1" max="30" step="0.1"></div>
        <div class="whl-fld2"><label>字体</label>
          <select id="ed_font">
            <option value="def">默认（等线）</option>
            <option value="deng">等线</option>
            <option value="hei">黑体</option>
            <option value="kai">楷体</option>
            <option value="mono">等宽</option>
          </select>
        </div>
        <label class="whl-sw"><input type="checkbox" id="ed_auto"><span class="tk"></span><span class="tx" id="ed_auto_tx">开 <span class="dft">默认</span></span></label>
        <div class="whl-ed-note">字号默认 18 mm（插件同口径）；自动缩放 = 装不下时把字等比缩到贴片边距内（默认开）；关 = 按设定字号原样排（可能顶满甚至超出边界）。</div>
      </div>
      <div class="whl-ed-right">
        <div class="whl-cap">贴片预览（正视 · 1:1）</div>
        <div class="whl-prev" id="ed_prev"><span class="ch" id="ed_prev_ch"></span></div>
      </div>
    </div>
    <div class="whl-foot">
      <div class="left">
        <button class="btn-outline" id="ed_reset_cell" type="button">重置本格</button>
        <button class="btn-outline" id="ed_clear" type="button">清空此格</button>
      </div>
      <span class="sp"></span>
      <button class="btn-outline" id="ed_cancel" type="button">取消</button>
      <button class="btn-filled" id="ed_save" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="whl-mask" id="pv_mask">
  <div class="whl-dlg wide">
    <h3>轮盘 3D 预览
      <button class="whl-x" id="pv_close_x" title="关闭预览" aria-label="关闭预览">
        <svg viewBox="0 0 24 24"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg>
      </button>
    </h3>
    <iframe class="whl-pv-frame" id="pv_frame" src="about:blank" title="轮盘 3D 装配预览"></iframe>
    <div class="whl-pv-note">预览按当前「面数 / 轮盘数量」生成；右侧图标可切换盖端外形、自动旋转、拆解、图例。</div>
  </div>
</div>

<!-- 取色弹层（每轮盘 字色/底色 两个色槽） -->
<div class="whl-pop" id="whl_pop">
  <div class="pp-h"><span id="pp_title">取色</span><button class="pp-close" id="pp_close" title="关闭" aria-label="关闭">×</button></div>
  <div class="pp-sw" id="pp_sw"></div>
  <div class="pp-custom">
    <input type="color" id="pp_color" value="#1a61cc" aria-label="自定义颜色">
    <button class="pp-add" id="pp_add" type="button">添加新色</button>
  </div>
  <div class="pp-err" id="pp_err"></div>
</div>

<script src="nav.js?v=e5f3a7b9"></script>
<script>
/* ============================================================
   手轮贴片字表 · 数据 / 渲染 / 导出 / 导入 / 预览 / 单格编辑
   - state.cols[m][n] = 单字；一列 = 一个轮盘的一套 N 字字表
   - state.style[m][n] = null | {size(mm), font, auto, kind}：单格样式覆盖
   - 导出默认 .ctgz（CTGTILE/3，与 3D 魔方同一套容器/密钥，插件用私钥解）；
     md = 全套 M 节（每节「## 轮盘 k」+ N 行），json = 整套数据。
     两者都收进调试模式（?dev=1 或连点标题 5 次），客户视角只有加密包。
   ============================================================ */
(function(){
  var KEY = 'whl_wheel_table_v1';
  var STATE_VER = 3;              // v3（2026-11-09 17:31）：默认字表改 4 数字面 + 面3 十符号
                                  // v2（16:40）：热端默认改 0.4，与插件 TILE_HOTEND_DEFAULT 对齐
  var DEF = {n:10, m:5, hotend:'H04'};
  var state = null;

  /* ⛔ 轮盘外径 / 面宽是 Blender 插件（WHG）的参数，不在本页设置。
     这里只固定「插件默认值」用于算格子等比，让字占面比例有个依据：
       DISC_DIA = 2·BASE_R = 55.7275（wheel_generator.py DEFAULTS.disc_dia）
       BASE_T   = 12.00              （DEFAULTS.disc_w）
     插件里改了外径/面宽，本页格子比例不会跟着变 —— 以插件实物为准。 */
  var PLUGIN = {dia:55.7275, t:12.0};

  function clamp(v, lo, hi, d){ v = Math.round(+v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }

  /* 贴片真实尺寸（mm）—— 严格照抄 wheel_generator.py 的 TILE / make_params：
       W = dia·sin(π/N)         周向弦长（轮盘一个面的「高」）
       tileCir = W − 2×0.70     周向贴片高（退棱，不越过棱线）
       tileAx  = T − 2×0.50     轴向贴片宽（避开象脚/端面）
       字号    = 18 mm（插件 TILE.text_size，用户 2026-11-08 定稿）
                 ⛔ 18 对默认贴片必然超出，靠「自动缩放到边距内」压回（插件同语义，只缩不放）；
                 旧的 0.60×tileAx（=6.6mm）口径已作废。
     格子 / 字都按同一 k 缩放，所以「字占片的比例」与实物一致。 */
  var PX_PER_MM = 6.2;
  var FONT_MM = 18.0;          // 默认字号（mm）= 插件 TILE.text_size
  var TEXT_MARGIN_MM = 0.8;    // 自动缩放内边距（mm）= 插件 WHL_TileText.margin 默认
  var GLYPH_W_EM = 0.62;       // 【兜底】量不出墨迹盒时的字宽 em 估算（canvas 不可用才走）
  var CELL_PAD = 12;           // .whl-cells 左右 padding 6+6：吃掉格子的可视宽
  var CELL_BORDER = 5;         // .whl-cell.filled 边框 5+5：⚠ 格子是 border-box，内框 = 外框 − 10
  // 格子内框补偿：--tw/--th 给的是「外框」，内框正好 = 贴片 mm×k → 预览恢复与实物等比。
  // ⛔ 2026-11-08 实测：不补偿时内框只有 46.2×88.1px，而字号按 58.3×88.2 在算 → 字必然溢出。
  // 列头色块沿用 3D 魔方 PALETTE 顺序；轮盘数最多 8，循环取色
  var PALETTE = ['#f27317','#d91f1f','#1a61cc','#219e40','#0f0f12','#7340b3'];
  /* 默认字表（2026-11-09 17:31 用户定稿）：
       面1 = 0-9 数字、面2 = 0-9 数字、面4 = 0-9 数字、面5 = 0-9 数字
       面3 = 10 个数学符号：+ − × ÷ ≈ > < ≥ ≤ =
     ⛔ 历史 · 已作废：11-08 版是「面1 数字 / 面2-4 英文字母 / 面5 五符号循环」，
        用户改口径为「4 个数字面 + 1 个符号面」，且符号面移到面3。
     字符口径：减号用 U+2212(−) 不用 ASCII 短横（与 + 等宽、笔画够粗）；
       > < 用半角 U+003E/003C，不用全角 ＞＜（全角会和 ≈ ≥ ≤ 明显不齐）。
       n>10 时数字面自然到 10、11…；符号面按 10 个循环（默认 n=10 正好一轮）。 */
  var SYMBOLS = ['+','\u2212','\u00D7','\u00F7','\u2248','>','<','\u2265','\u2264','='];
  var SYM_FACE = 2;                       // 面3（下标 2）
  function defaultChar(j, i){
    if(j === SYM_FACE) return SYMBOLS[i % SYMBOLS.length];
    return String(i);                    // ⛔ 从 0 起（用户 2026-11-08 纠正：不是 1–10，是 0–9）
  }
  /* 旧版默认字表指纹：仅用于判断老存档是否「一字未改」，好安全升级到新默认。
     ⛔ 绝不无脑覆盖用户编辑过的字表。 */
  function legacyDefaultChar(j, i){
    var oldSym = ['+','\u2212','\u00D7','\u00F7','='];
    if(j === 0) return String(i);
    if(j === 4) return oldSym[i % 5];
    return String.fromCharCode(65 + (i % 26));
  }
  function isLegacyDefault(s){
    if(!s || !Array.isArray(s.cols)) return false;
    for(var j=0;j<s.m;j++){
      var c = s.cols[j];
      if(!Array.isArray(c)) return false;
      for(var i=0;i<s.n;i++){
        if(String(c[i] == null ? '' : c[i]).slice(0,1) !== legacyDefaultChar(j, i)) return false;
      }
    }
    return true;
  }
  var FONTS = {
    def:'inherit',
    deng:'"DengXian","Microsoft YaHei",sans-serif',
    hei:'"Microsoft YaHei","PingFang SC",sans-serif',
    kai:'"KaiTi","STKaiti",serif',
    mono:'ui-monospace,Consolas,monospace'
  };
  function filledOf(j){
    var c = state.cols[j] || [], n = 0;
    for(var i=0;i<c.length;i++) if(String(c[i] || '').length) n++;
    return n;
  }
  function tileSpec(){
    var W = PLUGIN.dia * Math.sin(Math.PI / state.n);
    var cir = Math.max(0.4, W - 1.40);
    var ax  = Math.max(0.4, PLUGIN.t - 1.00);
    // 极端参数保护：N 小+外径大时片高会到 400px → 上限 240px 等比缩小；
    // N 大+外径小时片高只剩 16px（不好点）→ 下限 32px 等比放大。
    // 两者都是整体缩放，宽/高/字同比变化 → 片比例不失真。
    var k = Math.max(32 / cir, Math.min(PX_PER_MM, 240 / cir));
    var w = ax * k, h = cir * k;
    // 格子外框（含 .whl-cells padding 与格子边框）→ CSS 内框 = w / h，与实物等比
    var cellW = w + CELL_PAD + 2 * CELL_BORDER;
    var cellH = h + 2 * CELL_BORDER;
    var mg = TEXT_MARGIN_MM * k;                                 // 内边距(px)
    var availW = Math.max(4, w - 2 * mg), availH = Math.max(4, h - 2 * mg);  // 墨迹可用区(px)
    // 默认字号 18mm 对默认贴片必然超出 → 按插件 auto 同语义压到「贴片 − 2×内边距」。
    // capMm 是 em 口径的预压（与插件 size 语义一致）；真正的一刀是 cellFont 里的墨迹实测。
    var capY = Math.max(0.5, cir - 2 * TEXT_MARGIN_MM);          // 字身高可用（mm）
    var capX = Math.max(0.5, ax  - 2 * TEXT_MARGIN_MM);          // 读向可用（mm）
    var capMm = Math.min(capY, capX / GLYPH_W_EM);               // 可用字号上限（mm）
    var mm = Math.min(FONT_MM, capMm);                           // 实际生效字号（mm）
    var guard = Math.min(availH, availW / GLYPH_W_EM);           // 极端参数下的绝对护栏（px）
    var fs = Math.min(mm * k, guard);
    return {W:W, cir:cir, ax:ax, font:FONT_MM, k:k,
            w:w, h:h, cellW:cellW, cellH:cellH, mg:mg, availW:availW, availH:availH,
            fs:fs, mm:mm, capMm:capMm,
            capPx:Math.min(capMm * k, guard),
            ratioW:ax/cir, autoShrunk:(mm < FONT_MM - 1e-6)};
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function defaultState(){
    var s = {ver:STATE_VER, n:DEF.n, m:DEF.m, hotend:DEF.hotend, cols:[], style:[], palette:PALETTE.slice(), wcols:[]};
    for(var j=0;j<s.m;j++){
      var col=[], scol=[];
      for(var i=0;i<s.n;i++){
        col.push(defaultChar(j, i));  // 面1/2/4/5=0-9 数字、面3=十个数学符号
        scol.push(null);
      }
      s.cols.push(col); s.style.push(scol);
      s.wcols.push({bg:'#fffdf8', fg:PALETTE[j % PALETTE.length]});  // 每轮盘：底色(象牙白) + 字色(轮盘色)
    }
    return s;
  }
  /* 确保 state.palette / state.wcols 存在且长度 = m；wcols 缺省 底色=象牙白、字色=轮盘色；色值统一转小写避免重复判定漏判 */
  function ensureColors(s){
    if(!Array.isArray(s.palette) || !s.palette.length) s.palette = PALETTE.slice();
    s.palette = s.palette.map(function(h){ return normHex(h) || String(h).toLowerCase(); });
    var wc = Array.isArray(s.wcols) ? s.wcols : [];
    var out = [];
    for(var j=0;j<s.m;j++){
      var e = wc[j] || {};
      out.push({
        bg: normHex(e.bg) || '#fffdf8',
        fg: normHex(e.fg) || s.palette[j % s.palette.length]
      });
    }
    s.wcols = out;
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(KEY) || sessionStorage.getItem(KEY);
      if(!raw) return defaultState();
      var s = JSON.parse(raw);
      if(!s || !Array.isArray(s.cols) || !s.cols.length) return defaultState();
      s.n = clamp(s.n,3,24,DEF.n); s.m = clamp(s.m,1,8,DEF.m);
      // 旧版本存档里可能还有 dia/t：⛔ 直接丢弃，尺寸一律以插件默认常量为准
      delete s.dia; delete s.t;
      // 分段迁移：⛔ 不能一看到 ver 不同就重设热端 —— 那会把 ver2 里用户手动选的 0.2 冲回 0.4。
      var v = (typeof s.ver === 'number' && s.ver >= 1) ? s.ver : 1;
      if(v < 2) s.hotend = DEF.hotend;                 // v1→v2：热端默认 0.4
      if(v < 3 && isLegacyDefault(s)){                 // v2→v3：只升级「一字未改」的旧默认字表
        for(var mj=0;mj<s.m;mj++){
          var mc=[];
          for(var mi=0;mi<s.n;mi++) mc.push(defaultChar(mj, mi));
          s.cols[mj] = mc;
        }
        // style（单格字号/字体覆盖）保持原样：用户可能只调过样式没改字
        // ⛔ 编辑过字表的老存档一律原样保留，绝不覆盖用户内容
      }
      s.ver = STATE_VER;
      if(s.hotend !== 'H04' && s.hotend !== 'H02') s.hotend = DEF.hotend;
      // 补齐/裁到 n×m，⛔ 不静默保留脏数据
      var cols=[], style=[];
      for(var j=0;j<s.m;j++){
        var src = Array.isArray(s.cols[j]) ? s.cols[j] : [], col=[], scol=[];
        var ssrc = Array.isArray(s.style) && Array.isArray(s.style[j]) ? s.style[j] : [];
        for(var i=0;i<s.n;i++){
          col.push(String(src[i] == null ? '' : src[i]).slice(0,1));
          scol.push(ssrc[i] != null ? ssrc[i] : null);
        }
        cols.push(col); style.push(scol);
      }
      s.cols = cols; s.style = style;
      ensureColors(s);
      if(v !== STATE_VER){                             // 迁移结果落在补齐之后，避免写回脏数据
        try{ var mig = JSON.stringify(s); localStorage.setItem(KEY, mig); sessionStorage.setItem(KEY, mig); }catch(e){}
      }
      return s;
    }catch(e){ return defaultState(); }
  }
  function saveState(){
    try{
      state.ver = STATE_VER;
      var raw = JSON.stringify(state);
      localStorage.setItem(KEY, raw); sessionStorage.setItem(KEY, raw);
    }catch(e){}
  }
  function resize(n, m){
    var cols=[], style=[];
    for(var j=0;j<m;j++){
      var src = state.cols[j] || [], ssrc = (state.style && state.style[j]) || [], col=[], scol=[];
      for(var i=0;i<n;i++){
        col.push(src[i] != null ? String(src[i]).slice(0,1) : defaultChar(j, i));
        scol.push(ssrc[i] != null ? ssrc[i] : null);
      }
      cols.push(col); style.push(scol);
    }
    state.n=n; state.m=m; state.cols=cols; state.style=style;
    ensureColors(state);                 // 补齐每轮盘底色/字色（保留已有、补新列默认）
    colStart = [];                       // 参数变了各列回面 0
    saveState(); render();
  }

  /* ---------- 字形墨迹实测（2026-11-08） ----------
     CSS 的 font-size 是 em 盒不是字高，÷ × = − 等符号墨迹与数字差异很大
     （100px 实测：0→62×75、A→71×71、÷→61×59），em 估算必溢出。
     这里用 canvas measureText 量「真实墨迹盒」，照插件 auto 同一语义：
     只缩不放，压进「格子内框 − 2×内边距」，并给出墨迹居中所需的平移量。 */
  var _ink = {cache:{}, cv:null, fam:null};
  function bodyFam(){
    if(_ink.fam === null){
      try{ _ink.fam = getComputedStyle(document.body).fontFamily || 'sans-serif'; }
      catch(e){ _ink.fam = 'sans-serif'; }
    }
    return _ink.fam;
  }
  function inkBox(ch, fam){
    if(!ch) return null;
    fam = fam || bodyFam();
    var key = fam + '|' + ch;
    if(_ink.cache[key] !== undefined) return _ink.cache[key];
    var out = null;
    try{
      var cv = _ink.cv || (_ink.cv = document.createElement('canvas'));
      var ctx = cv.getContext('2d');
      ctx.font = '700 100px ' + fam;
      var m = ctx.measureText(ch);
      var w = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
      var h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if(w > 0 && h > 0){
        var fa = m.fontBoundingBoxAscent || 80, fd = m.fontBoundingBoxDescent || 20;
        out = {w:w, h:h,
               dx:(m.width - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft)) / 2,   // 水平居中修正
               dy:((fd - fa) - (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent)) / 2}; // 垂直居中修正
      }
    }catch(e){ out = null; }
    _ink.cache[key] = out;
    return out;
  }
  function inkShift(ink, px){
    return (ink && (ink.dx || ink.dy))
      ? 'transform:translate(' + (ink.dx * px / 100).toFixed(2) + 'px,' + (ink.dy * px / 100).toFixed(2) + 'px);' : '';
  }

  /* 某格的显示字号(px)与字体：style 覆盖优先；auto（默认开，= 插件 auto 只缩不放）
     时按墨迹实测压回「内框 − 2×内边距」。ts.mm 本身就是 18mm 压好的默认值。 */
  function cellFont(c, i, ts){
    ts = ts || tileSpec();
    var sizeMm = ts.mm, fam = '', st = state.style[c] && state.style[c][i];
    if(st){
      if(st.size) sizeMm = st.size;
      fam = FONTS[st.font] || '';
    }
    var px = sizeMm * ts.k;
    var auto = !st || !!st.auto;                 // 默认开（与插件 WHL_TileText.auto 默认一致）
    var ink = auto ? inkBox(state.cols[c][i] || '', fam) : null;
    if(ink){
      px = Math.min(px, 100 * ts.availW / ink.w, 100 * ts.availH / ink.h);
    }else if(auto && px > ts.capPx){
      px = ts.capPx;                             // 兜底：量不出墨迹退回 em 估算
    }
    return {px:px, fam:fam, ink:ink};
  }

  function render(){
    if(pickCol >= 0) clearPick();      // DOM 重建前清掉选中态（互换 / 重置 / 导入都走这里）
    var ts = tileSpec();
    /* --tw/--th/--fs 写在 #stage：格子与右侧功能按钮同源，按钮尺寸自动 = 白框 */
    var stageEl = document.getElementById('stage');
    stageEl.style.setProperty('--tw', ts.cellW.toFixed(1) + 'px');
    stageEl.style.setProperty('--th', ts.cellH.toFixed(1) + 'px');
    stageEl.style.setProperty('--fs', ts.fs.toFixed(1) + 'px');
    document.getElementById('spec').innerHTML =
      '按插件默认 <b>Ø' + PLUGIN.dia + ' / 面宽 ' + PLUGIN.t.toFixed(1) +
      '</b> 等比 · 贴片 <b>' + ts.ax.toFixed(1) + ' × ' + ts.cir.toFixed(1) + '</b> mm（宽:高 ' +
      (ts.ratioW*100).toFixed(0) + ':100） · 默认字号 <b>' + ts.font.toFixed(1) + '</b> mm' +
      (ts.autoShrunk
        ? ' · 超贴片，自动缩放后 <b>' + ts.mm.toFixed(1) + '</b> mm'
        : ' · 未超贴片');
    var html = '';
    var swPal = (Array.isArray(state.palette) && state.palette.length) ? state.palette : PALETTE;  // 列头小方块取色兜底
    for(var j=0;j<state.m;j++){
      var wc = state.wcols[j] || {bg:'#fffdf8', fg:PALETTE[j % PALETTE.length]};
      var rows = '';
      for(var i=0;i<state.n;i++){
        var ch = state.cols[j][i] || '';
        var f = cellFont(j, i, ts);
        var stAttr = 'font-size:' + f.px.toFixed(1) + 'px;' + (f.fam ? 'font-family:' + f.fam + ';' : '');
        if(ch) stAttr += 'background:' + wc.bg + ';color:' + wc.fg + ';';  // 逐轮盘底色/字色
        rows += '<div class="whl-row">'
              +   '<div class="whl-cell' + (ch ? ' filled' : '') + '" data-c="' + j + '" data-i="' + i + '"'
              +   ' style="' + stAttr + '" title="轮盘 ' + (j+1) + ' 面 ' + i + '">'
              +   '<span class="whl-ano">' + i + '</span>'
              +   '<span class="ch" style="' + inkShift(f.ink, f.px) + '">' + esc(ch) + '</span></div>'
              + '</div>';
      }
      html += '<div class="whl-col" data-c="' + j + '">'
            +   '<div class="whl-col-main">'
            +     '<div class="whl-col-head">'
            +       '<span class="whl-drag-h" draggable="true" data-c="' + j + '" title="桌面：拖到另一列；手机：点一下再点目标列头 —— 两列互换整套字表（轮盘位置与配色留在原位）">⠿</span>'
            +       '<span class="whl-swatch" style="background:' + swPal[j % swPal.length] + '"></span>'
            +       '<b>面' + (j+1) + '</b>'
            +     '</div>'
            +     '<div class="whl-cells"><div class="whl-track" data-c="' + j + '">' + rows + '</div></div>'
            +     '<span class="whl-fcount">' + filledOf(j) + '/' + state.n + '</span>'
            +   '</div>'
            +   '<div class="whl-col-pg">'
            +     '<button class="whl-pg-btn" data-c="' + j + '" data-d="-1" type="button" title="上移一格" aria-label="上移一格">▲</button>'
            +     '<button class="whl-pg-btn" data-c="' + j + '" data-d="1" type="button" title="下移一格" aria-label="下移一格">▼</button>'
            +   '</div>'
            + '</div>';
    }
    document.getElementById('grid').innerHTML = html;
    document.getElementById('count').innerHTML = '共 <b>' + (state.n * state.m) + '</b> 片';
    document.querySelectorAll('#hotend button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-h') === state.hotend);
    });
    // 数量按钮读数
    document.querySelector('#btn_n b').textContent = state.n;
    document.querySelector('#btn_m b').textContent = state.m;
    layout();
  }

  /* ================= 列内容互换（照 3D 魔方 swapFaceTiles，2026-11-09）=================
     列头最左 ⠿ 拖柄拖到另一列松手 = 两列的「整套 N 格字表」互换。
     ⛔ 语义 = 两两互换，不是插入顺延（魔方首版顺延被用户当场否掉，勿重蹈）。
     ⛔ 留在原位：列位置（data-c / 列头「面N」）、逐轮盘配色 wcols[j]、各列翻页位置 colStart[j]。
     ⛔ 跟着字走：cols[j]（N 个字）+ style[j]（单格样式与字一一对应，不一起换会错位）。
     导出（.ctgz / md / json）与 3D 预览都现读 state → 互换后无需额外同步；
     saveState() 落 localStorage/sessionStorage，刷新不丢。 */
  function swapColumnTiles(f, g){
    if(f === g || !(f >= 0 && f < state.m) || !(g >= 0 && g < state.m)) return false;
    var t = state.cols[f]; state.cols[f] = state.cols[g]; state.cols[g] = t;
    var s = state.style[f]; state.style[f] = state.style[g]; state.style[g] = s;
    saveState(); render();
    return true;
  }
  window.__swapColumnTiles = swapColumnTiles;   // CDP 验证用（与魔方 __swapFaceTiles 同例）

  var toastTimer = null;
  function whlToast(msg){
    var t = document.getElementById('whl_toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ---------- 拖放：只认列头拖柄，其余元素一律取消 ---------- */
  var dragCol = -1;
  var pickCol = -1;                  // 点选式互换的源列（触屏兜底，不依赖 HTML5 drag）
  var suppressClickUntil = 0;       // 刚完成一次拖放 → 别把同一手势又当成点选
  function clearPick(){
    pickCol = -1;
    var g = document.getElementById('grid');
    if(g) g.classList.remove('picking');
    var all = document.querySelectorAll('#grid .whl-col');
    for(var i=0;i<all.length;i++) all[i].classList.remove('pick-src');
  }
  function colIdxOf(el){
    var c = el && el.closest ? el.closest('.whl-col') : null;
    if(!c) return -1;
    var v = +c.getAttribute('data-c');
    return isFinite(v) && v >= 0 && v < state.m ? v : -1;
  }
  function cleanupColDrag(){
    dragCol = -1;
    var all = document.querySelectorAll('#grid .whl-col');
    for(var i=0;i<all.length;i++) all[i].classList.remove('dragging','drop-target');
  }
  function bindColDrag(grid){
    grid.addEventListener('dragstart', function(e){
      var h = e.target && e.target.closest ? e.target.closest('.whl-drag-h') : null;
      if(!h){ e.preventDefault(); return; }   // 格子 / 翻页按钮 / 列头色块都不能发起拖动
      suppressClickUntil = Date.now() + 800; // 拖放手势结束后抑制一次 click，避免误进点选模式
      dragCol = +h.getAttribute('data-c');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain', String(dragCol)); }catch(err){}
      }
      var src = grid.querySelector('.whl-col[data-c="' + dragCol + '"]');
      if(src) src.classList.add('dragging');
    });
    grid.addEventListener('dragover', function(e){
      if(dragCol < 0) return;
      var g = colIdxOf(e.target);
      if(g < 0) return;
      e.preventDefault();                     // 允许在此列 drop
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      if(g === dragCol) return;
      var all = grid.querySelectorAll('.whl-col');
      for(var i=0;i<all.length;i++) all[i].classList.remove('drop-target');
      var dst = grid.querySelector('.whl-col[data-c="' + g + '"]');
      if(dst) dst.classList.add('drop-target');
    });
    grid.addEventListener('drop', function(e){
      if(dragCol < 0) return;
      e.preventDefault();
      var f = dragCol, g = colIdxOf(e.target);
      cleanupColDrag();
      if(g >= 0 && g !== f && swapColumnTiles(f, g)){
        whlToast('已互换整套字表：面' + (f+1) + ' ↔ 面' + (g+1) + '（轮盘位置与配色留在原位）');
      }
    });
    grid.addEventListener('dragend', cleanupColDrag);
    grid.addEventListener('dragleave', function(e){
      var g = colIdxOf(e.target);
      if(g >= 0 && g !== dragCol){
        var el = grid.querySelector('.whl-col[data-c="' + g + '"]');
        if(el) el.classList.remove('drop-target');
      }
    });

    /* ---------- 点选式互换（2026-11-09 17:31 用户「要能互换的」）----------
       HTML5 drag 在触屏上根本不触发 → 点一下源列，再点目标列即互换；再点自己 / Esc 取消。
       ⛔ 桌面只认 ⠿ 拖柄（避免点色块、面名误触）；手机整条列头都是 44px 热区。
       ⛔ 语义与拖放完全一致：cols + style 走，列位置 / 配色 / 翻页位留原位。 */
    grid.addEventListener('click', function(e){
      if(Date.now() < suppressClickUntil) return;
      var t = e.target;
      if(!t || !t.closest) return;
      var isHandle = !!t.closest('.whl-drag-h');
      var isHead   = !!t.closest('.whl-col-head');
      if(!isHandle && !(window.innerWidth <= 768 && isHead)) return;
      var colEl = t.closest('.whl-col');
      var c = colEl ? +colEl.getAttribute('data-c') : -1;
      if(!(c >= 0 && c < state.m)) return;
      if(pickCol < 0){
        pickCol = c;
        grid.classList.add('picking');
        if(colEl) colEl.classList.add('pick-src');
        whlToast('已选中面' + (c+1) + '：再点另一列的 ⠿ / 列头完成互换（点自己取消）');
      }else if(pickCol === c){
        clearPick(); whlToast('已取消互换');
      }else{
        var f = pickCol; clearPick();
        if(swapColumnTiles(f, c))
          whlToast('已互换整套字表：面' + (f+1) + ' ↔ 面' + (c+1) + '（轮盘位置与配色留在原位）');
      }
    });
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pickCol >= 0){ clearPick(); whlToast('已取消互换'); }
  });
  /* 拖到网格外松手：浏览器默认会拿 text/plain 去导航，全局拦掉（同魔方） */
  document.addEventListener('dragover', function(e){ if(dragCol >= 0) e.preventDefault(); });
  document.addEventListener('drop', function(e){ if(dragCol >= 0) e.preventDefault(); });

  /* ---------- 一屏内显示 / 每列独立逐格翻页 ----------
     ⛔ 每列各有一个 colStart[j]，右侧 ▲/▼ 只翻自己那一列（用户 2026-11-08 定稿）；
     视窗高度仍全体共用（同一套 --cells-h），可下行数 vis 全列一致。
     视窗高度按当前窗口可用高度动态算，改窗口 / 改参数都会重排。 */
  var colStart = [];              // 每列的起始面序
  var ROWGAP = 6;                 // 与 .whl-track gap 一致
  var FIXED = 62;                 // 列头 ~24 + 底部留白 ~18 + 余量

  function visibleRows(step){
    var stage = document.getElementById('stage');
    var top = stage ? stage.getBoundingClientRect().top : 150;
    var avail = window.innerHeight - top - FIXED;
    if(avail < step) avail = step;
    var n = Math.floor((avail + ROWGAP) / step);
    return Math.max(1, Math.min(state.n, n));
  }
  var lastVis = 1;                 // 最近一次算出的可见行数，供翻页时复用
  function fitHeight(h, vis){
    var grid = document.getElementById('grid');
    grid.style.setProperty('--cells-h', (vis*h + (vis-1)*ROWGAP + 12).toFixed(1) + 'px');
  }
  function trackOff(c, step){
    var t = document.querySelector('.whl-track[data-c="' + c + '"]');
    if(t) t.style.transform = 'translateY(' + (-(colStart[c]||0) * step).toFixed(1) + 'px)';
  }
  function pgBtns(c){
    var col = document.querySelector('.whl-col[data-c="' + c + '"]');
    return col ? col.querySelectorAll('.whl-pg-btn') : [];
  }
  function refreshPg(maxStart){
    for(var j=0;j<state.m;j++){
      var s = colStart[j] || 0;
      var b = pgBtns(j);
      if(b.length >= 2){
        b[0].disabled = (s <= 0);
        b[1].disabled = (s >= maxStart);
      }
    }
  }
  function layout(){
    var grid = document.getElementById('grid');
    var cs = getComputedStyle(grid);
    var h = parseFloat(cs.getPropertyValue('--th')) || 82;
    var step = h + ROWGAP;
    var vis = visibleRows(step);
    var narrow = window.innerWidth <= 768;
    /* ⛔ 宽屏才做「一屏收敛」：手机上 5 列已换行成 2-3 行，再强求整页不滚动
       会把可见行一路压到 1 格（每列只剩一格，字表没法看）。窄屏改为自然纵向滚动，
       每列给 5 格上限，▲/▼ 逐格翻页照常可用。 */
    if(narrow) vis = Math.min(vis, 5);
    fitHeight(h, vis);
    if(!narrow){
      /* 别只靠估算：导航高度、字体、section padding 都会吃掉空间。
         按真实 scrollHeight 逐行收敛，直到整页不超过一屏（最多 N 次）。 */
      for(var guard=0; guard<state.n; guard++){
        if(document.documentElement.scrollHeight <= window.innerHeight + 2) break;
        if(vis <= 1) break;
        vis--; fitHeight(h, vis);
      }
    }
    lastVis = vis;
    var maxStart = Math.max(0, state.n - vis);
    if(colStart.length !== state.m){
      colStart = []; for(var k=0;k<state.m;k++) colStart.push(0);
    }
    for(var j=0;j<state.m;j++){
      colStart[j] = Math.min(colStart[j]||0, maxStart);
      trackOff(j, step);
    }
    refreshPg(maxStart);
  }
  function pageBy(c, d){
    var maxStart = Math.max(0, state.n - lastVis);
    var next = Math.max(0, Math.min(maxStart, (colStart[c]||0) + d));
    if(next === colStart[c]) return;
    colStart[c] = next;
    var grid = document.getElementById('grid');
    var h = parseFloat(getComputedStyle(grid).getPropertyValue('--th')) || 82;
    trackOff(c, h + ROWGAP);
    refreshPg(maxStart);
  }

  /* ---------- 导出 ---------- */
  /* 加密包：CTGTILE/3，与 3D 魔方（cube-tile-table.html）**同一套密钥与算法**。
     - 页面只有 RSA 公钥（只能加密），私钥只在 wheel_generator.py / ctg_tile_generator.py
     - ⛔ 与插件 _ctg_decrypt() 必须字节级一致：AAD 拼接、子钥标签、分块长度、OAEP 参数
     - 客户视角默认只看到这一档；md / json 收进调试模式（?dev=1 或连点标题 5 次） */
  var CTG_MAGIC = 'CTGTILE/3';
  var CTG_MAGIC_V2 = 'CTGTILE/2';      // 旧试作版，只用于报一句准确的错
  var CTG_MAGIC_V1 = 'CTGTILE/1';      // 授权码时代，只用于报错
  var CTG_PUB_JWK = {kty:"RSA", n:"zWhObge-fgimBD_4O4HsWqO3hng5bm_RFJfvxStgJrf8hDYHnIveMvgOdmONMWcS7KTbQnXA2Buvf4YBD2Zg2HIPwfq332HqxrY6fWlMQHo_pdA-zMKvI-NAhVfFo0pOchzVmDKDJ6uaObx18qalj9dNRG34iKzL78ktyo7eQYrJ7Yqp1We6fKnCJh2V_C2kFi-0ZGiFfBuZLY948KNfvmQ0KE3MPVsFXdy3LdX4qoOALCYYwQ4SmgBukPaLWuvni5nboSgMb7RdEk9GraYE5IZa5Ngieqw3lW7hyCF_o9hizUVpyD-thGw2d26S1gQzRfchiwiZ27ezVutEjuuQSw", e:"AQAB", alg:"RSA-OAEP-256", ext:true};
  var CTG_LS_PREFIX = 'ctgz_k_';
  function ctgB64Enc(u8){
    var s = '', C = 0x8000;
    for(var i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C));
    return btoa(s);
  }
  function ctgB64Dec(str){
    var bin = atob(String(str || '').replace(/\s+/g, ''));
    var u = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function ctgCat(){
    var n = 0, i;
    for(i = 0; i < arguments.length; i++) n += arguments[i].length;
    var out = new Uint8Array(n), off = 0;
    for(i = 0; i < arguments.length; i++){ out.set(arguments[i], off); off += arguments[i].length; }
    return out;
  }
  var ctgPubCache = null;
  async function ctgPubKey(){
    if(ctgPubCache) return ctgPubCache;
    ctgPubCache = await crypto.subtle.importKey('jwk', CTG_PUB_JWK, {name:'RSA-OAEP', hash:'SHA-256'},
                                               false, ['encrypt']);
    return ctgPubCache;
  }
  async function ctgSubkey(raw32, label){
    var base = await crypto.subtle.importKey('raw', raw32, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    var sig  = await crypto.subtle.sign('HMAC', base, new TextEncoder().encode(label));
    return crypto.subtle.importKey('raw', new Uint8Array(sig), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  }
  async function ctgKeysFor(raw32){
    return { enc: await ctgSubkey(raw32, 'ctg3-enc'), mac: await ctgSubkey(raw32, 'ctg3-mac') };
  }
  async function ctgHmac(key, bytes){
    return new Uint8Array(await crypto.subtle.sign('HMAC', key, bytes));
  }
  async function ctgStream(keyEnc, nonce, len){
    var out = new Uint8Array(len), off = 0, i = 0;
    while(off < len){
      var msg = new Uint8Array(20);
      msg.set(nonce, 0);
      msg[16] = (i >>> 24) & 255; msg[17] = (i >>> 16) & 255; msg[18] = (i >>> 8) & 255; msg[19] = i & 255;
      var blk = await ctgHmac(keyEnc, msg);
      var take = Math.min(32, len - off);
      for(var j = 0; j < take; j++) out[off + j] = blk[j];
      off += take; i++;
    }
    return out;
  }
  /* 本机留一份 K，使「同机再导入」可行；文件本身不含 K 明文 */
  function ctgRememberKey(idStr, K){
    try{
      localStorage.setItem(CTG_LS_PREFIX + idStr, ctgB64Enc(K));
      var keys = [], i;
      for(i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(CTG_LS_PREFIX) === 0) keys.push(k);
      }
      while(keys.length > 20){ try{ localStorage.removeItem(keys.shift()); }catch(e){} }
    }catch(e){}
  }
  function ctgRecallKey(idStr){
    try{
      var v = localStorage.getItem(CTG_LS_PREFIX + idStr);
      return v ? ctgB64Dec(v) : null;
    }catch(e){ return null; }
  }
  function ctgNeedCrypto(){
    if(window.crypto && crypto.subtle && crypto.getRandomValues) return;
    /* ⛔ HTTP + 局域网 IP 不是安全上下文，浏览器不给 crypto.subtle —— 与浏览器新旧无关 */
    var err;
    if(window.isSecureContext === false){
      err = new Error('此页面不是安全上下文（' + location.origin + '），浏览器在这种地址下不开放加密接口。'
        + '请改用 http://localhost:8080 或 http://127.0.0.1:8080 打开本页；线上 https 链接不受影响。');
      err.ctgInsecure = true;
      err.ctgNoHint = true;
      throw err;
    }
    err = new Error('当前浏览器不支持网页加密（crypto.subtle 不可用），请换新版 Chrome / Edge / Safari。');
    err.ctgNoHint = true;
    throw err;
  }
  /* 局域网 HTTP 打开时，给出同一页面的 https 地址（本地服务 8443 监听） */
  function ctgHttpsHint(){
    if(location.protocol === 'https:') return '';
    var h = location.hostname;
    if(!h || h === 'localhost' || h === '127.0.0.1') return '';
    return 'https://' + h + ':8443' + location.pathname + location.search;
  }
  async function ctgEncrypt(plain){
    ctgNeedCrypto();
    var id    = crypto.getRandomValues(new Uint8Array(8));
    var K     = crypto.getRandomValues(new Uint8Array(32));
    var nonce = crypto.getRandomValues(new Uint8Array(16));
    var pt = new TextEncoder().encode(plain);
    var k  = await ctgKeysFor(K);
    var ks = await ctgStream(k.enc, nonce, pt.length);
    var ct = new Uint8Array(pt.length);
    for(var i = 0; i < pt.length; i++) ct[i] = pt[i] ^ ks[i];
    var ek = new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'}, await ctgPubKey(), K));
    var aad = new TextEncoder().encode(CTG_MAGIC);
    var tag = await ctgHmac(k.mac, ctgCat(aad, id, ek, nonce, ct));
    ctgRememberKey(ctgB64Enc(id), K);
    return [CTG_MAGIC, 'id=' + ctgB64Enc(id), 'ek=' + ctgB64Enc(ek), 'nonce=' + ctgB64Enc(nonce),
            'data=' + ctgB64Enc(ct), 'tag=' + ctgB64Enc(tag)].join('\n') + '\n';
  }
  function ctgIsPacked(text){ return /^\s*CTGTILE\//.test(String(text || '')); }
  function ctgFields(text){
    var out = {}, lines = String(text).replace(/\r/g, '').split('\n');
    var head = (lines[0] || '').trim();
    if(head === CTG_MAGIC_V1 || head === CTG_MAGIC_V2){
      throw new Error('这是旧版加密字表（' + head + '），请让客户用新版网页重新导出');
    }
    if(head !== CTG_MAGIC) throw new Error('不是本工具的加密字表（首行标识不对）');
    for(var i = 1; i < lines.length; i++){
      var p = lines[i].indexOf('=');
      if(p > 0) out[lines[i].slice(0, p).trim()] = lines[i].slice(p + 1).trim();
    }
    return out;
  }
  async function ctgDecrypt(text){
    ctgNeedCrypto();
    var f = ctgFields(text);
    var id = ctgB64Dec(f.id), ek = ctgB64Dec(f.ek), nonce = ctgB64Dec(f.nonce),
        ct = ctgB64Dec(f.data), tag = ctgB64Dec(f.tag);
    if(!id.length || ek.length !== 256 || nonce.length !== 16 || tag.length !== 32){
      throw new Error('加密字表已损坏（字段长度不对）');
    }
    var K = ctgRecallKey(f.id);
    if(!K || K.length !== 32){
      throw new Error('这个加密包只有卖家的 Blender 插件能打开（本页不含解密密钥）。'
                    + '要继续编辑，请在本页重新填写 —— 本机填过的内容会自动保留');
    }
    var k = await ctgKeysFor(K);
    var aad = new TextEncoder().encode(CTG_MAGIC);
    var want = await ctgHmac(k.mac, ctgCat(aad, id, ek, nonce, ct));
    var diff = 0;
    for(var i = 0; i < 32; i++) diff |= (want[i] ^ tag[i]);
    if(diff !== 0) throw new Error('文件已损坏或被改过（校验失败），请让客户重新导出一份');
    var ks = await ctgStream(k.enc, nonce, ct.length);
    var pt = new Uint8Array(ct.length);
    for(var j = 0; j < ct.length; j++) pt[j] = ct[j] ^ ks[j];
    return new TextDecoder().decode(pt);
  }

    var isPack = expTab === 'ctgz';
    document.getElementById('exp_ta_wrap').style.display = isPack ? 'none' : 'flex';
    pkBox.classList.toggle('on', isPack);
    document.getElementById('exp_hint').classList.toggle('on', isPack);
    document.getElementById('exp_copy').style.display = isPack ? 'none' : '';
    /* 加密包档：下载只有一个落点 —— 卡片里的 pk-dl，底部那个藏起来 */
    var footLeft = document.querySelector('.whl-foot .left');
    if(footLeft) footLeft.style.display = isPack ? 'none' : '';
    pkDl.disabled = true;
    if(!isPack){
      document.getElementById('exp_ta').value = expTab === 'md' ? buildMD() : buildJSON();
      document.getElementById('exp_hint').textContent = expTab === 'md'
        ? 'md 含全部 ' + state.m + ' 个轮盘（每轮盘一节、每节 ' + state.n + ' 行），插件点「导入字表生成」一次读完。'
        : 'json 含全部 ' + state.m + ' 个轮盘 × ' + state.n + ' 个面（含单格样式），供本页导入或插件整套生成。';
      return;
    }
    var seq = ++expSeq;
    expPackText = '';
    pkBox.classList.remove('err');
    pkT.textContent = '正在生成加密包…';
    pkS.textContent = '';
    try{
      var pack = await ctgEncrypt(JSON.stringify(jsonObj()));
      if(seq !== expSeq) return;
      expPackText = pack;
      pkT.textContent = '加密包已生成';
      pkS.textContent = expPackSummary(pack);
      pkDl.disabled = false;
    }catch(e){
      if(seq !== expSeq) return;
      pkBox.classList.add('err');
      pkT.textContent = '加密包生成失败';
      pkS.textContent = (e && e.message ? e.message : String(e)) + (e && e.ctgNoHint ? '' : '　（建议换新版 Chrome / Edge / Safari）');
      if(e && e.ctgInsecure && ctgHttpsHint()){
        pkS.appendChild(document.createTextNode('　'));
        var aid = document.createElement('a');
        aid.href = ctgHttpsHint();
        aid.textContent = '点这里用 https 打开';
        aid.style.cssText = 'color:inherit;text-decoration:underline;font-weight:600;white-space:nowrap';
        pkS.appendChild(aid);
      }
    }
  }
  function downloadExp(){
    var text = expTab === 'ctgz' ? expPackText : document.getElementById('exp_ta').value;
    if(expTab === 'ctgz' && !ctgIsPacked(text)){
      alert(pkBox.classList.contains('err') ? '加密包生成失败，先按上面那行提示处理'
                                            : '加密包还没生成好，稍等一下再点');
      return;
    }
    var name = document.getElementById('exp_name').value || (autoBase() + expExt());
    var mime = expTab === 'ctgz' ? 'text/plain;charset=utf-8'
             : (expTab === 'md' ? 'text/markdown;charset=utf-8' : 'application/json;charset=utf-8');
    var blob = new Blob([text], {type:mime});
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
  }
  function openExp(){
    document.getElementById('exp_name').dataset.dirty = '';
    document.getElementById('exp_name').value = autoBase() + expExt();
    refreshExp();
    document.getElementById('exp_mask').classList.add('show');
  }
  function closeExp(){ document.getElementById('exp_mask').classList.remove('show'); }
  /* 调试模式：明文导出平时藏起来，只给内部排查用（?dev=1 或连点弹窗标题 5 次） */
  function devModeOn(){ return /[?&]dev=1(&|$)/.test(String(location.search || '')); }
  if(devModeOn()) document.body.classList.add('dev');
  (function(){
    var h = document.querySelector('#exp_mask h3'), cnt = 0;
    if(!h) return;
    h.addEventListener('click', function(){
      if(document.body.classList.contains('dev')) return;
      if(++cnt >= 5){
        document.body.classList.add('dev');
        if(expTab === 'ctgz'){ expTab = 'md'; }
        document.querySelectorAll('#exp_tabs .whl-tab').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-t') === expTab);
        });
        refreshExp();
        alert('调试模式：已显示明文导出（md / json）');
      }
    });
  })();

  /* ---------- 导入 ---------- */
  /* JSON（含 .ctgz 解密后的载荷）→ 整套 M×N */
  function parseJSONObj(o){
    if(!o || o.type !== 'wheel-tile-table' || !Array.isArray(o.cols) || !o.cols.length) return null;
    var n = clamp(o.n,3,24,DEF.n), mm = clamp(o.m,1,8,DEF.m), cols=[], style=[];
    for(var j=0;j<mm;j++){
      var src = Array.isArray(o.cols[j]) ? o.cols[j] : [], col=[];
      var ssrc = (o.style && Array.isArray(o.style[j])) ? o.style[j] : [], scol=[];
      for(var i=0;i<n;i++){
        col.push(String(src[i] == null ? '' : src[i]).slice(0,1));
        scol.push(ssrc[i] != null ? ssrc[i] : null);
      }
      cols.push(col); style.push(scol);
    }
    var imp = {n:n, m:mm, hotend:(o.hotend === 'H04' ? 'H04' : 'H02'), cols:cols, style:style, whole:true};
    if(Array.isArray(o.palette) && o.palette.length) imp.palette = o.palette.slice();
    if(Array.isArray(o.wcols)) imp.wcols = o.wcols;
    ensureColors(imp);
    return imp;
  }
  /* md：按「## 轮盘 k」分节，每节一张 N 行表 —— 一次读完全部轮盘。
     旧格式（单节无 ##，标题写「· 轮盘 k」）仍兼容：只回填那一个轮盘。 */
  function parseMD(text){
    var lines = text.split(/\r?\n/), secs = [], cur = null, legacyPick = 0;
    var mt = text.match(/^#\s*手轮贴片字表\s*·\s*轮盘\s*(\d+)/m);
    if(mt) legacyPick = Math.max(0, parseInt(mt[1], 10) - 1);
    for(var k=0;k<lines.length;k++){
      var s = lines[k].trim();
      var ms = s.match(/^##\s*轮盘\s*(\d+)/);
      if(ms){ cur = {idx:Math.max(0, parseInt(ms[1], 10) - 1), rows:[]}; secs.push(cur); continue; }
      if(s.indexOf('##') === 0){ cur = null; continue; }     // ## 机器可读 等：结束当前节
      if(s.charAt(0) !== '|') continue;
      var cells = s.slice(1, -1).split('|').map(function(x){ return x.trim(); });
      if(cells.length < 2 || !/^\d+$/.test(cells[0])) continue;
      var row = {i:+cells[0], ch:cells[1].replace(/\\\|/g,'|').slice(0,1)};
      if(cur) cur.rows.push(row); else secs.push({idx:null, rows:[row]});
    }
    /* 旧格式：所有行没被任何 ## 节收走 */
    if(!secs.length) throw new Error('字表里没找到「| 面序 | 字 |」表格行');
    var grouped = secs.filter(function(x){ return x.idx !== null; });
    if(!grouped.length){
      var rows0 = secs[0].rows.slice().sort(function(a,b){ return a.i - b.i; });
      if(rows0.length !== state.n)
        throw new Error('字表 ' + rows0.length + ' 行 != 当前轮盘面数 ' + state.n + '（不静默补齐/截断）');
      return {whole:false, pick:legacyPick, col:rows0.map(function(r){ return r.ch; })};
    }
    var n = 0, cols = [];
    grouped.forEach(function(sec){
      var rows = sec.rows.slice().sort(function(a,b){ return a.i - b.i; });
      if(!n) n = rows.length;
      if(rows.length !== n)
        throw new Error('「轮盘 ' + (sec.idx+1) + '」只有 ' + rows.length + ' 行，与其它轮盘的 ' + n + ' 行不一致（不静默补齐/截断）');
      cols[sec.idx] = rows.map(function(r){ return r.ch; });
    });
    /* 中间缺号（比如只有轮盘 1、3）用默认字补齐，保证列连续 */
    var m = cols.length;
    for(var j=0;j<m;j++) if(!cols[j]) cols[j] = new Array(n).fill('');
    var imp = {n:n, m:m, hotend:state.hotend, cols:cols, style:[], whole:true};
    for(var q=0;q<m;q++) imp.style.push(new Array(n).fill(null));
    ensureColors(imp);
    return imp;
  }
  function parseImport(text){
    var m = text.match(/```json\s*([\s\S]*?)```/);
    if(m){
      var imp = parseJSONObj(JSON.parse(m[1]));
      if(imp) return imp;
    }
    if(/^\s*\{/.test(text)){
      try{
        var o2 = parseJSONObj(JSON.parse(text));
        if(o2) return o2;
      }catch(e){}
    }
    return parseMD(text);
  }

  /* ---------- 预览 ---------- */
  function openPv(){
    var g = encodeURIComponent(JSON.stringify(state.cols));
    var url = './wheel-assembly.html?embed=1&n=' + state.n + '&cnt=' + state.m + '&g=' + g;
    document.getElementById('pv_frame').src = url;
    document.getElementById('pv_mask').classList.add('show');
  }
  function closePv(){
    document.getElementById('pv_mask').classList.remove('show');
    document.getElementById('pv_frame').src = 'about:blank';  // 释放 3D / WebGL
  }

  /* ---------- 取色弹层（每轮盘 字色/底色 两个色槽；调色板全局防重复） ---------- */
  var pop = null, popC = 0, popSlot = 'fg';
  function normHex(v){
    if(typeof v !== 'string') return '';
    v = v.trim();
    if(v.charAt(0) !== '#') v = '#' + v;
    if(/^#[0-9a-fA-F]{3}$/.test(v)) v = '#' + v[1]+v[1] + v[2]+v[2] + v[3]+v[3];
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : '';
  }
  function buildPopSw(){
    var box = document.getElementById('pp_sw'); box.innerHTML = '';
    var cur = state.wcols[popC][popSlot];
    state.palette.forEach(function(hex){
      var b = document.createElement('button');
      b.type = 'button'; b.style.background = hex; b.title = hex;
      b.setAttribute('data-hex', hex);
      if(hex === cur) b.classList.add('on');
      b.addEventListener('click', function(){ pickColor(hex); });
      box.appendChild(b);
    });
  }
  function openColorPop(c, slot, anchor){
    pop = document.getElementById('whl_pop'); popC = c; popSlot = slot;
    var wc = state.wcols[c];
    document.getElementById('pp_title').textContent = '轮盘 ' + (c+1) + (slot === 'fg' ? ' · 字色' : ' · 底色');
    document.getElementById('pp_err').textContent = '';
    document.getElementById('pp_color').value = normHex(wc[slot]) || '#1a61cc';
    buildPopSw();
    pop.classList.add('show');
    var r = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = r.left, top = r.bottom + 6;
    if(left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    if(top + ph > window.innerHeight - 8) top = r.top - ph - 6;
    pop.style.left = Math.max(8, left) + 'px';
    pop.style.top = Math.max(8, top) + 'px';
  }
  function closeColorPop(){ if(pop) pop.classList.remove('show'); }
  function pickColor(hex){
    state.wcols[popC][popSlot] = hex; saveState(); render(); closeColorPop();
  }
  function addColor(){
    var hex = normHex(document.getElementById('pp_color').value);
    var err = document.getElementById('pp_err');
    if(!hex){ err.textContent = '颜色格式无效'; return; }
    if(state.palette.indexOf(hex) >= 0){ err.textContent = '该颜色已存在，不能重复添加'; return; }
    state.palette.push(hex); saveState(); buildPopSw();
    pickColor(hex);   // 加到调色板并立即应用到当前槽
  }

  /* ---------- 绑定 ---------- */
  function boot(){
    state = loadState();
    render();

    // 每列独立翻页 + 单格编辑：事件委托（data-c / data-i）
    var gridEl = document.getElementById('grid');
    bindColDrag(gridEl);                    // 列内容拖放（拖柄 dragstart / 整列 drop）
    gridEl.addEventListener('click', function(e){
      var cs = e.target.closest ? e.target.closest('.whl-cslot') : null;
      if(cs){ openColorPop(+cs.dataset.c, cs.dataset.slot, cs); return; }
      var cell = e.target.closest ? e.target.closest('.whl-cell') : null;
      if(cell){ openEditor(+cell.dataset.c, +cell.dataset.i); return; }
      var b = e.target.closest ? e.target.closest('.whl-pg-btn') : null;
      if(b) pageBy(+b.getAttribute('data-c'), +b.getAttribute('data-d'));
    });
    document.getElementById('grid').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var cell = e.target.closest ? e.target.closest('.whl-cell') : null;
        if(cell){ e.preventDefault(); openEditor(+cell.dataset.c, +cell.dataset.i); }
      }
    });
    var rzTimer = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rzTimer); rzTimer = setTimeout(layout, 80);
    });
    document.getElementById('hotend').addEventListener('click', function(e){
      var b = e.target.closest('button[data-h]'); if(!b) return;
      state.hotend = b.getAttribute('data-h'); saveState(); render();
    });
    document.getElementById('btn_reset').addEventListener('click', function(){
      if(!confirm('把全部 ' + (state.n*state.m) + ' 格重置为默认字表？')) return;
      /* ⛔ 「重置字表」只清字，不动热端档：0.2 喷嘴用户点一下重置就被换成 0.4 的孔径，
         等于悄悄配错孔（与魔方页一致：reset 保留当前热端）。 */
      var keepHot = state.hotend;
      state = defaultState(); state.hotend = keepHot; saveState(); render();
    });
    document.getElementById('btn_preview').addEventListener('click', openPv);
    document.getElementById('btn_export').addEventListener('click', openExp);
    document.getElementById('btn_import').addEventListener('click', function(){
      document.getElementById('import_file').click();
    });
    document.getElementById('btn_n').addEventListener('click', openCount);
    document.getElementById('btn_m').addEventListener('click', openCount);
    document.getElementById('import_file').addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0]; if(!f) return;
      var rd = new FileReader();
      rd.onload = async function(){
        try{
          var raw = String(rd.result);
          /* .ctgz：本机导出过的包能解（K 在 localStorage）；跨设备的包只有插件私钥能开 */
          if(ctgIsPacked(raw)){
            try{ raw = await ctgDecrypt(raw); }
            catch(err){
              throw new Error(err.message + '\n\n（插件导入不受影响：把 .ctgz 直接拖进 Blender 即可）');
            }
          }
          var r = parseImport(raw);
          if(r.whole){
            state = {n:r.n, m:r.m, hotend:r.hotend, cols:r.cols, style:r.style,
                     palette:r.palette, wcols:r.wcols};
          }else{
            var pick = Math.min(r.pick || 0, state.m - 1);
            state.cols[pick] = r.col;
          }
          saveState(); render();
          alert('导入成功' + (r.whole ? '（整套 ' + state.m + ' 个轮盘 × ' + state.n + ' 面）'
                                     : '（只回填轮盘 ' + ((r.pick||0)+1) + '）'));
        }catch(err){ alert('导入失败：' + err.message); }
        e.target.value = '';
      };
      rd.readAsText(f, 'utf-8');
    });

    document.getElementById('exp_tabs').addEventListener('click', function(e){
      var b = e.target.closest('button[data-t]'); if(!b) return;
      expTab = b.getAttribute('data-t');
      document.querySelectorAll('#exp_tabs .whl-tab').forEach(function(x){
        x.classList.toggle('on', x === b);
      });
      refreshExp();
    });
    document.getElementById('exp_name').addEventListener('input', function(){ this.dataset.dirty = '1'; });
    document.getElementById('exp_name_def').addEventListener('click', function(){
      var n = document.getElementById('exp_name');
      n.value = autoBase() + expExt(); n.dataset.dirty = '';
      refreshExp();
    });
    document.getElementById('exp_copy').addEventListener('click', function(){
      var ta = document.getElementById('exp_ta');
      ta.select(); document.execCommand('copy');
      this.textContent = '已复制'; var self = this;
      setTimeout(function(){ self.textContent = '复制到剪贴板'; }, 1200);
    });
    document.getElementById('exp_download').addEventListener('click', downloadExp);
    document.getElementById('exp_download_pk').addEventListener('click', downloadExp);
    document.getElementById('exp_close').addEventListener('click', closeExp);
    document.getElementById('exp_close_x').addEventListener('click', closeExp);

    // 数量弹窗
    document.getElementById('cnt_apply').addEventListener('click', applyCount);
    document.getElementById('cnt_cancel').addEventListener('click', closeCount);
    document.getElementById('cnt_close_x').addEventListener('click', closeCount);

    // 编辑格子弹窗
    document.getElementById('ed_ch').addEventListener('input', updatePrev);
    document.getElementById('ed_size').addEventListener('input', updatePrev);
    document.getElementById('ed_font').addEventListener('change', updatePrev);
    document.getElementById('ed_auto').addEventListener('change', function(){ updateAutoTx(); updatePrev(); });
    document.getElementById('ed_reset_cell').addEventListener('click', resetCellStyle);
    document.getElementById('ed_clear').addEventListener('click', clearCell);
    document.getElementById('ed_save').addEventListener('click', saveEditor);
    document.getElementById('ed_cancel').addEventListener('click', closeEditor);

    // 取色弹层：关闭 / 新增颜色（调色板全局防重复）
    document.getElementById('pp_close').addEventListener('click', closeColorPop);
    document.getElementById('pp_add').addEventListener('click', addColor);
    document.addEventListener('click', function(e){
      if(!pop || !pop.classList.contains('show')) return;
      if(pop.contains(e.target)) return;
      if(e.target.closest && e.target.closest('.whl-cslot')) return;
      closeColorPop();
    });

    document.getElementById('pv_close_x').addEventListener('click', closePv);
    document.querySelectorAll('.whl-mask').forEach(function(mask){
      mask.addEventListener('click', function(e){
        if(e.target === mask){
          if(mask.id === 'exp_mask') closeExp();
          else if(mask.id === 'cnt_mask') closeCount();
          else if(mask.id === 'ed_mask') closeEditor();
          else closePv();
        }
      });
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(pop && pop.classList.contains('show')) closeColorPop();
        if(document.getElementById('pv_mask').classList.contains('show')) closePv();
        if(document.getElementById('exp_mask').classList.contains('show')) closeExp();
        if(document.getElementById('cnt_mask').classList.contains('show')) closeCount();
        if(document.getElementById('ed_mask').classList.contains('show')) closeEditor();
      }
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<div id="whl_toast"></div>
</body>
</html>
