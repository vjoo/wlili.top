     Edit View
     ============================================ */
  function goToEdit(prompt) {
    /* Set currentPrompt so savePrompt uses the correct ID */
    if (prompt) {
      currentPrompt = prompt;
    }
    /* If editing existing, load data; if new, start blank */
    if (prompt) {
      document.getElementById('editTitle').value = prompt.title || '';
      document.getElementById('editPrompt').value = prompt.template || '';
      editTags = (prompt.tags && prompt.tags.slice()) || [];
      editImages = (prompt.images && prompt.images.map(function(src, i) {
        return { dataURL: src, isCover: i === (prompt.coverIndex || 0) };
      })) || [];
      if (editImages.length > 0 && !editImages.some(function(img) { return img.isCover; })) {
        editImages[0].isCover = true;
      }
    } else {
      document.getElementById('editTitle').value = '';
      document.getElementById('editPrompt').value = '';
      editTags = [];
      editImages = [];
    }
    renderEditTags();
    renderEditImages();
    renderEditVarDefaults();
    /* Reset edit-page translation state */
    editOriginalText = null;
    editShowingTranslated = false;
    var editTransLabel = document.getElementById('btnTranslateEditLabel');
    if (editTransLabel) editTransLabel.textContent = '翻译';
    switchView('edit');
  }

  function renderEditTags() {
    var row = document.getElementById('editTagsRow');
    row.innerHTML = '';
    /* Render predefined categories as selectable chips (skip "all") */
    CATEGORIES.forEach(function(cat) {
      if (cat.key === 'all') return;
      var chip = document.createElement('span');
      var isSelected = editTags.indexOf(cat.key) !== -1;
      chip.className = 'tag-select-chip' + (isSelected ? ' selected' : '');
      chip.textContent = cat.label;
      chip.addEventListener('click', function() {
        var idx = editTags.indexOf(cat.key);
        if (idx === -1) {
          editTags.push(cat.key);
        } else {
          editTags.splice(idx, 1);
        }
        renderEditTags();
      });
      row.appendChild(chip);
    });
    /* Also show any custom tags that don't match predefined categories */
    editTags.forEach(function(tag) {
      var isPredefined = CATEGORIES.some(function(c) { return c.key === tag; });
      if (isPredefined) return;
      var chip = document.createElement('span');
      chip.className = 'tag-select-chip selected';
      chip.innerHTML = escapeHtml(tag) + ' <button style="background:none;border:none;color:#fff;cursor:pointer;font-size:14px;padding:0 0 0 2px;">×</button>';
      chip.querySelector('button').addEventListener('click', function(e) {
        e.stopPropagation();
        var idx = editTags.indexOf(tag);
        if (idx !== -1) editTags.splice(idx, 1);
        renderEditTags();
      });
      row.appendChild(chip);
    });
  }

        actions.innerHTML =

          '<button class="var-tag-btn var-tag-cancel" title="取消"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
          '<button class="var-tag-btn var-tag-reset" title="重置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>';
        attachEditTagEditActions(tag);
        showRecDropdown(tag, varName, display, hiddenInput);
      } else {
        tag.classList.remove('is-editing');
        display.contentEditable = 'false';
        hideRecDropdown(tag);
        actions.innerHTML =
          '<button class="var-tag-btn var-tag-edit" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
          '<button class="var-tag-btn var-tag-delete" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
        attachEditTagNormalActions(tag);
      }
    }

    function parseDisplayText(text, varName) {
      var colonIdx = varName.search(/[:：]/);
      var dispName = colonIdx >= 0 ? varName.substring(0, colonIdx) : varName;
      var prefix = dispName + '：';
      if (text.indexOf(prefix) === 0) return text.substring(prefix.length).trim();
      prefix = dispName + ':';
      if (text.indexOf(prefix) === 0) return text.substring(prefix.length).trim();
      if (text.trim() === dispName) return '';
      return text.trim();
    }

    function buildDisplayHTML(varName, val) {
      var colonIdx = varName.search(/[:：]/);
      var dispName = colonIdx >= 0 ? varName.substring(0, colonIdx) : varName;
      var hint = colonIdx >= 0 ? varName.substring(colonIdx + 1) : '';
      var showVal = val || hint;
      if (showVal && showVal !== varName) {
        return '<span class="vname">' + escapeHtml(dispName) + '</span>：' + escapeHtml(showVal);
      }
      return '<span class="vname">' + escapeHtml(dispName) + '</span>';
    }

    function attachEditTagEditActions(tag) {
      var display = tag.querySelector('.var-tag-display');
      var hiddenInput = tag.querySelector('.var-input');
      var varName = hiddenInput.dataset.var;

      tag.querySelector('.var-tag-save').addEventListener('click', function(e) {
        e.stopPropagation();
        var raw = display.textContent.trim();
        var newVal = parseDisplayText(raw, varName);
        hiddenInput.value = newVal;
        display.innerHTML = buildDisplayHTML(varName, newVal);
        display.contentEditable = 'false';
        setEditTagEditMode(tag, false);
      });

      tag.querySelector('.var-tag-cancel').addEventListener('click', function(e) {
        e.stopPropagation();
        var curVal = hiddenInput.value;
        display.innerHTML = buildDisplayHTML(varName, curVal);
        display.contentEditable = 'false';
        setEditTagEditMode(tag, false);
      });

      tag.querySelector('.var-tag-reset').addEventListener('click', function(e) {
        e.stopPropagation();
        var originalVal = hiddenInput.dataset.original || '';
        hiddenInput.value = originalVal;
        display.innerHTML = buildDisplayHTML(varName, originalVal);
      });

      display.addEventListener('keydown', function handler(e) {
        if (e.key === 'Enter') { e.preventDefault(); display.blur(); tag.querySelector('.var-tag-save').click(); }
        if (e.key === 'Escape') { e.preventDefault(); tag.querySelector('.var-tag-cancel').click(); }
      });
    }

    function attachEditTagNormalActions(tag) {
      tag.querySelector('.var-tag-edit').addEventListener('click', function(e) {
        e.stopPropagation();
        setEditTagEditMode(tag, true);
      });

      tag.querySelector('.var-tag-unmark').addEventListener('click', function(e) {
        e.stopPropagation();
        var hiddenInput = tag.querySelector('.var-input');
        var varName = hiddenInput.dataset.var;
        var defaultVal = hiddenInput.value || '';
        /* Remove {{varName}} from textarea and replace with default value */
        var ta = document.getElementById('editPrompt');
        var text = ta.value;
        var escapedVarName = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var regex = new RegExp('\\{\\{' + escapedVarName + '\\}\\}', 'g');
        text = text.replace(regex, defaultVal);
        ta.value = text;
        /* Delete variable definition */
        if (currentPrompt && currentPrompt.variables) {
          delete currentPrompt.variables[varName];
        }
        /* Trigger update */
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        showToast('已取消标记，文案已恢复');
      });

      tag.querySelector('.var-tag-delete').addEventListener('click', function(e) {
        e.stopPropagation();
        var hiddenInput = tag.querySelector('.var-input');
        var display = tag.querySelector('.var-tag-display');
        var varName = hiddenInput.dataset.var;
        hiddenInput.value = '';
        display.innerHTML = buildDisplayHTML(varName, '');
      });
    }

    panel.querySelectorAll('.var-tag').forEach(function(tag) {
      attachEditTagNormalActions(tag);
    });
  }

  /* ============================================
     Save
     ============================================ */
  function savePrompt() {
    var title = document.getElementById('editTitle').value.trim();
    var template = document.getElementById('editPrompt').value.trim();
    if (!template) {
      showToast('请输入提示词内容');
      return;
    }
    if (!title) title = '未命名提示词';

    /* Defensive: verify currentPrompt is consistent with the editing record */
    var isNewFlag = document.getElementById('editTitle').dataset.new === '1';
    if (!isNewFlag && (!currentPrompt || !currentPrompt.id)) {
      console.error('[savePrompt] BUG: editing existing but currentPrompt is null/has no id. This would create a new record instead of updating.',
        'currentPrompt:', currentPrompt);
      showToast('保存异常：未找到当前编辑的记录，请重试');
      return;
    }

    var vars = extractVars(template);
    var varDefaults = {};
    vars.forEach(function(v) {
      var inp = document.querySelector('#editVarDefaults .var-input[data-var="' + v + '"]');
      varDefaults[v] = inp ? inp.value : '';
    });

    var images = editImages.map(function(img) { return img.dataURL; });
    var coverIndex = 0;
    for (var i = 0; i < editImages.length; i++) {
      if (editImages[i].isCover) { coverIndex = i; break; }
    }

    var now = Date.now();
    var isNew = !currentPrompt || !currentPrompt.id || isNewFlag;

    var recordId;
    if (currentPrompt && currentPrompt.id && !isNewFlag) {
      recordId = currentPrompt.id;
    } else {
      recordId = genId();
    }

    /* Final guard: if editing existing, recordId must match currentPrompt.id */
    if (!isNewFlag && recordId !== currentPrompt.id) {
      console.error('[savePrompt] BUG: ID mismatch! recordId=' + recordId + ' but currentPrompt.id=' + currentPrompt.id + '. Aborting to prevent data corruption.');
      showToast('保存异常：ID 不匹配，已中止以防数据覆盖');
      return;
    }

    var record = {
      id: recordId,
      title: title,
      template: template,
      variables: varDefaults,
      images: images,
      coverIndex: coverIndex,
      tags: editTags.slice(),
      createdAt: (currentPrompt && currentPrompt.createdAt) ? currentPrompt.createdAt : now,
      updatedAt: now
    };

    dbPut(record).then(function() {
      showToast(isNew ? '提示词已保存' : '提示词已更新');
      currentPrompt = record;
      /* Mark as no longer new so subsequent saves update the same record */
      document.getElementById('editTitle').dataset.new = '0';
      loadAll().then(function() { renderList(); switchView('list'); });
    }).catch(function(err) {
      showToast('保存失败：' + (err.message || '未知错误'));
    });
  }

  /* ============================================
     Helpers
     ============================================ */
  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function loadAll() {
    return dbGetAll().then(function(list) {
      allPrompts = list || [];
    });
  }

  function fileToDataURL(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result); };
      reader.onerror = function(e) { reject(e); };
      reader.readAsDataURL(file);
    });
  }

  /* ============================================
     Image Auto-Compress — 上传/粘贴时自动压缩大图
     - 仅压缩最长边 > MAX_EDGE 的图（视觉无损）
     - 透明 PNG 保留原格式，其余转 JPEG quality 0.85
     ============================================ */
  var MAX_EDGE = 2048;          /* 最长边像素上限 */
  var JPEG_QUALITY = 0.85;      /* JPEG 质量 */

  /* 核心压缩：把一张已解码的图压到 MAX_EDGE 内 */
  function compressImageToDataURL(img, keepAlpha) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = 1;
    if (w > MAX_EDGE || h > MAX_EDGE) {
      scale = Math.min(MAX_EDGE / w, MAX_EDGE / h);
      w = Math.round(w * scale);
      h = Math.round(h * scale);
    }
    var canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    if (keepAlpha) {
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL('image/png');
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
  }

  /* 压缩已有 dataURL（用于存量图片优化） */
  function compressDataURL(src) {
    return new Promise(function(resolve, reject) {
      /* GIF 动图跳过，避免丢失动画帧 */
      if (src.indexOf('data:image/gif') === 0) { resolve(src); return; }
      var img = new Image();
      img.onload = function() {
        try {
          var keepAlpha = (src.indexOf('data:image/png') === 0 ||
                           src.indexOf('data:image/webp') === 0);
          resolve(compressImageToDataURL(img, keepAlpha));
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = function() { reject(new Error('图片解码失败')); };
      img.src = src;
    });
  }

  function compressImageFile(file) {
    return new Promise(function(resolve, reject) {
      if (!file.type || file.type.indexOf('image/') !== 0) {
        reject(new Error('不是图片文件'));
        return;
      }
      /* GIF 动图跳过，避免丢失动画帧 */
      if (file.type === 'image/gif') {
        fileToDataURL(file).then(resolve, reject);
        return;
      }
      /* 小文件（<500KB）直接走原图，避免无谓开销 */
      if (file.size < 500 * 1024) {
        fileToDataURL(file).then(resolve, reject);
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function() {
        URL.revokeObjectURL(url);
        try {
          var keepAlpha = (file.type === 'image/png' || file.type === 'image/webp');
          resolve(compressImageToDataURL(img, keepAlpha));
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        reject(new Error('图片解码失败'));
      };
      img.src = url;
    });
  }

  /* 编辑视图图片处理：压缩后入列 */
  function addEditImage(file) {
    compressImageFile(file).then(function(dataURL) {
      editImages.push({ dataURL: dataURL, isCover: editImages.length === 0 });
      renderEditImages();
    }).catch(function(err) {
      showToast('图片处理失败：' + (err.message || '未知错误'));
    });
  }

  /* 存量图片一键压缩：遍历所有记录，压缩超限大图并回写 */
  function compressAllImages() {
    showToast('正在压缩现有图片…');
    var wasAuto = isAutoBackupEnabled();
    if (wasAuto) setAutoBackupEnabled(false); /* 临时关闭，避免逐条备份拖慢 */
    dbGetAll().then(function(list) {
      var total = 0, changed = 0;
      var promises = list.map(function(record) {
        if (!record.images || !record.images.length) return Promise.resolve();
        var imgPromises = record.images.map(function(src) {
          total++;
          return compressDataURL(src).then(function(compressed) {
            if (compressed && compressed.length < src.length) {
              changed++;
              return compressed;
            }
            return src;
          }).catch(function() { return src; });
        });
        return Promise.all(imgPromises).then(function(newImages) {
          record.images = newImages;
          return dbPut(record);
        });
      });
      return Promise.all(promises).then(function() {
        loadAll().then(function() {
          if (wasAuto) {
            setAutoBackupEnabled(true);
            triggerAutoBackup(); /* 压缩完成后统一备份一次 */
          }
          renderList();
          showToast('图片优化完成：' + changed + '/' + total + ' 张已压缩');
        });
      });
    }).catch(function(err) {
      if (wasAuto) setAutoBackupEnabled(true);
      showToast('图片优化失败：' + (err.message || '未知错误'));
    });
  }

  /* ============================================
     Dev Self-Check — catches bugs at dev stage
     Run via console: __devCheck() or auto on ?dev=1
     ============================================ */
  function runDevCheck() {
    var results = [];
    var pass = 0, fail = 0;

    function check(name, condition, detail) {
      if (condition) {
        pass++;
        results.push('✓ ' + name);
      } else {
        fail++;
        results.push('✗ ' + name + (detail ? ' → ' + detail : ''));
      }
    }

    /* 1. Critical DOM elements exist */
    var requiredIds = ['searchInput', 'btnNewPrompt', 'viewList', 'viewDetail', 'viewEdit',
      'promptGrid', 'categoryFilter', 'editTitle', 'editPrompt', 'editVarDefaults',
      'detailTitle', 'detailInfo', 'detailPromptText', 'varPanel', 'previewBox', 'previewSection',
      'btnCopyPrompt', 'btnSaveAsNew', 'btnTranslate', 'btnTranslatePreview',
      'btnCopyTemplate', 'detailBack', 'detailEdit', 'detailDelete'];
    requiredIds.forEach(function(id) {
      check('DOM #' + id + ' exists', !!document.getElementById(id));
    });

    /* 2. CSP allows translation APIs */
    var cspMeta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
    var cspContent = cspMeta ? cspMeta.getAttribute('content') : '';
    check('CSP allows translate.googleapis.com', cspContent.indexOf('translate.googleapis.com') !== -1,
      'connect-src missing Google translate API');
    check('CSP allows api.mymemory.translated.net', cspContent.indexOf('mymemory.translated.net') !== -1,
      'connect-src missing MyMemory fallback API');

    /* 2b. translateText multi-source function exists (MyMemory primary for China) */
    check('translateText is defined', typeof translateText === 'function');
    check('tryMyMemory is defined', typeof tryMyMemory === 'function');
    check('tryGoogleTranslate is defined', typeof tryGoogleTranslate === 'function');
    check('fetchWithTimeout is defined', typeof fetchWithTimeout === 'function',
      'fetch requests need AbortController timeout to avoid hanging on blocked APIs');
    check('decodeHtmlEntities is defined', typeof decodeHtmlEntities === 'function',
      'MyMemory may return HTML entities that need decoding');
    /* Verify MyMemory is tried first (China-friendly order) */
    check('translateText tries MyMemory first', translateText.toString().indexOf('tryMyMemory') !== -1 &&
      translateText.toString().indexOf('tryMyMemory') < translateText.toString().indexOf('tryGoogleTranslate'),
      'MyMemory must be primary source (works in China), Google as fallback only');

    /* 3. goToEdit sets currentPrompt (non-destructive check) */
    check('goToEdit is defined', typeof goToEdit === 'function');
    check('goToEdit sets currentPrompt when given a prompt',
      goToEdit.toString().indexOf('currentPrompt = prompt') !== -1 || goToEdit.toString().indexOf('currentPrompt=prompt') !== -1,
      'goToEdit must set currentPrompt = prompt to prevent save overwriting wrong record');

    /* 4. savePrompt has defensive guards (non-destructive source code check) */
    check('savePrompt is defined', typeof savePrompt === 'function');
    var saveSrc = savePrompt.toString();
    check('savePrompt guards against null currentPrompt',
      saveSrc.indexOf('currentPrompt') !== -1 && saveSrc.indexOf('isNewFlag') !== -1,
      'savePrompt must check currentPrompt before using its id');
    check('savePrompt has ID mismatch guard',
      saveSrc.indexOf('ID mismatch') !== -1 || saveSrc.indexOf('recordId !== currentPrompt.id') !== -1,
      'savePrompt must abort if recordId !== currentPrompt.id');

    /* 5. extractVars works */
    check('extractVars is defined', typeof extractVars === 'function');
    try {
      var testVars = extractVars('hello {{name}} world {{age}}');
      check('extractVars finds variables', testVars.length === 2 && testVars.indexOf('name') !== -1 && testVars.indexOf('age') !== -1,
        'got: ' + JSON.stringify(testVars));
    } catch(e) {
      check('extractVars finds variables', false, e.message);
    }

    /* 6. fillTemplate works */
    check('fillTemplate is defined', typeof fillTemplate === 'function');
    try {
      var filled = fillTemplate('hello {{name}}', { name: 'world' });
      check('fillTemplate replaces variables', filled === 'hello world', 'got: ' + filled);
    } catch(e) {
      check('fillTemplate replaces variables', false, e.message);
    }

    /* 7. smartParse returns { template, defaults } */
    check('smartParse is defined', typeof smartParse === 'function');
    try {
      var parsed = smartParse('a beautiful landscape');
      check('smartParse returns object with template', parsed && typeof parsed.template === 'string');
      check('smartParse returns object with defaults', parsed && typeof parsed.defaults === 'object');
    } catch(e) {
      check('smartParse works', false, e.message);
    }

    /* 8. convertVarNames converts English to Chinese */
    check('convertVarNames is defined', typeof convertVarNames === 'function');
    try {
      var converted = convertVarNames('{{quality}} test', { quality: '8k' });
      check('convertVarNames converts English tags', converted.template.indexOf('画质') !== -1, 'got: ' + converted.template);
    } catch(e) {
      check('convertVarNames converts English tags', false, e.message);
    }

    /* 9. DB functions exist */
    check('openDB is defined', typeof openDB === 'function');
    check('dbPut is defined', typeof dbPut === 'function');
    check('dbGet is defined', typeof dbGet === 'function');
    check('dbDelete is defined', typeof dbDelete === 'function');
    check('loadAll is defined', typeof loadAll === 'function');

    /* 10. View switching works */
    check('switchView is defined', typeof switchView === 'function');
    try {
      switchView('list');
      check('switchView shows list', document.getElementById('viewList').classList.contains('active'));
    } catch(e) {
      check('switchView shows list', false, e.message);
    }

    /* 11. No orphan CSS selectors referencing removed elements */
    check('.list-toolbar not in HTML', !document.querySelector('.list-toolbar'),
      'list-toolbar was removed from HTML, check CSS cleanup');
    check('DEFAULT_COVER not referenced', typeof DEFAULT_COVER === 'undefined',
      'DEFAULT_COVER var should be removed');

    /* 12. Event bindings check */
    check('searchInput has listener', typeof searchInput !== 'undefined');

    /* Output */
    var summary = '\n===== Dev Self-Check =====\n' +
      results.join('\n') + '\n\n' +
      pass + ' passed, ' + fail + ' failed' +
      (fail > 0 ? ' ⚠️  FIX NEEDED' : ' ✅ ALL CLEAR') + '\n';
    console.log(summary);
    if (fail > 0) console.warn('Run __devCheck() again after fixes.');
    return { pass: pass, fail: fail, results: results };
  }
  window.__devCheck = runDevCheck;

  /* Auto-run in dev mode */
  if (window.location.search.indexOf('dev=1') !== -1) {
    setTimeout(runDevCheck, 500);
  }

  /* Click main image to open lightbox */
  document.getElementById('galleryMain').addEventListener('click', function(e) {
    if (e.target.closest('.gallery-nav') || e.target.closest('.gallery-cover-btn') || e.target.closest('.gallery-counter')) return;
    var mainImg = this.querySelector('img');
    if (!mainImg || !mainImg.src) return;
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightboxImg');
    lbImg.src = mainImg.src;
    lb.classList.add('active');
  });

  /* Close lightbox */
  document.getElementById('lightboxClose').addEventListener('click', function() {
    document.getElementById('lightbox').classList.remove('active');
  });
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  /* Keyboard navigation: arrows for gallery (detail view), Esc for lightbox */
  document.addEventListener('keydown', function(e) {
    /* Esc closes lightbox */
    if (e.key === 'Escape') {
      var lb = document.getElementById('lightbox');
      if (lb.classList.contains('active')) {
        lb.classList.remove('active');
        return;
      }
    }
    /* Arrow keys navigate gallery only on detail view */
    if (currentView !== 'detail') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    var imgs = (currentPrompt && currentPrompt.images) || [];
    if (imgs.length === 0) return;
    if (e.key === 'ArrowLeft' && galleryIndex > 0) {
      galleryIndex--; renderGallery();
    } else if (e.key === 'ArrowRight' && galleryIndex < imgs.length - 1) {
      galleryIndex++; renderGallery();
    }
  });

  /* Gallery set cover */
  document.getElementById('galleryCoverBtn').addEventListener('click', function() {
    if (!currentPrompt) return;
    currentPrompt.coverIndex = galleryIndex;
    dbPut(currentPrompt).then(function() {
      showToast('已设为封面');
      renderGallery();
      loadAll().then(function() { renderList(); });
    });
  });

  /* Copy template (original with {{}}) */
  document.getElementById('btnCopyTemplate').addEventListener('click', function() {
    var p = currentPrompt;
    if (!p) return;
    var text = showingTranslated && translatedTemplate ? translatedTemplate : p.template;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('已复制原始模板');
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  /* Translate prompt — toggle between original and translated */
  document.getElementById('btnTranslate').addEventListener('click', function() {
    var p = currentPrompt;
    if (!p) return;
    var btn = this;

    /* If already translated, toggle back to original */
    if (showingTranslated) {
      showingTranslated = false;
      btn.title = '中英互译';
      document.getElementById('detailPromptText').innerHTML = renderPromptText(p.template, p.variables);
      return;
    }

    /* If cached, show immediately */
    if (translatedTemplate) {
      showingTranslated = true;
      btn.title = '查看原文';
      document.getElementById('detailPromptText').innerHTML = renderPromptText(translatedTemplate, p.variables);
      return;
    }

    /* Detect language: count Chinese vs English characters */
    var chineseChars = (p.template.match(/[\u4e00-\u9fff]/g) || []).length;
    var targetLang = chineseChars > p.template.length * 0.3 ? 'en' : 'zh-CN';

    /* Show loading state */
    btn.disabled = true;
    btn.title = '翻译中...';

    /* Protect {{variable}} placeholders before translation */
    var placeholders = [];
    var textToTranslate = p.template.replace(/\{\{([^}]+)\}\}/g, function(match) {
      var idx = placeholders.length;
      placeholders.push(match);
      return ' XVAR' + idx + 'X ';
    });

    translateText(textToTranslate, targetLang).then(function(translated) {
      /* Restore placeholders */
      translated = translated.replace(/XVAR\s*(\d+)\s*X/g, function(match, num) {
        return placeholders[parseInt(num)] || match;
      });
      /* Clean up extra spaces around placeholders */
      translated = translated.replace(/\s*(\{\{[^}]+\}\})\s*/g, '$1');

      translatedTemplate = translated;
      showingTranslated = true;
      btn.disabled = false;
      btn.title = '查看原文';
      document.getElementById('detailPromptText').innerHTML = renderPromptText(translated, p.variables);
      showToast(targetLang === 'en' ? '已翻译为英文' : '已翻译为中文');
    }).catch(function(err) {
      btn.disabled = false;
      btn.title = '中英互译';
      console.error('[translate]', err);
      showToast('翻译失败：' + (err.message || '所有翻译服务均不可用'));
    });
  });

  /* Translate generated preview */
  document.getElementById('btnTranslatePreview').addEventListener('click', function() {
    var p = currentPrompt;
    if (!p) return;
    var btn = this;

    /* If already translated, toggle back to preview */
    if (showingPreviewTranslated) {
      showingPreviewTranslated = false;
      btn.title = '中英互译';
      updatePreview();
      return;
    }

    /* Build current preview text */
    var vars = {};
    document.querySelectorAll('#varPanel .var-input').forEach(function(inp) {
      vars[inp.dataset.var] = inp.value;
    });
    var previewText = fillTemplate(p.template, vars);
    previewText = previewText.replace(/\{\{[^}]+\}\}/g, '');
    previewText = previewText.replace(/[，,\s]*[，,][，,\s]*/g, '，').replace(/^[，,\s]+|[，,\s]+$/g, '').trim();

    if (!previewText) { showToast('预览内容为空'); return; }

    /* If cached, show immediately */
    if (translatedPreview) {
      showingPreviewTranslated = true;
      btn.title = '查看原文';
      document.getElementById('previewBox').innerHTML = escapeHtml(translatedPreview);
      return;
    }

    /* Detect language */
    var chineseChars = (previewText.match(/[\u4e00-\u9fff]/g) || []).length;
    var targetLang = chineseChars > previewText.length * 0.3 ? 'en' : 'zh-CN';

    btn.disabled = true;
    btn.title = '翻译中...';

    translateText(previewText, targetLang).then(function(translated) {
      translatedPreview = translated;
      showingPreviewTranslated = true;
      btn.disabled = false;
      btn.title = '查看原文';
      document.getElementById('previewBox').innerHTML = escapeHtml(translated);
      showToast(targetLang === 'en' ? '已翻译为英文' : '已翻译为中文');
    }).catch(function(err) {
      btn.disabled = false;
      btn.title = '中英互译';
      console.error('[translate preview]', err);
      showToast('翻译失败：' + (err.message || '所有翻译服务均不可用'));
    });
  });

  /* Copy generated prompt (filled, no {{}}) — respects translation state */
  document.getElementById('btnCopyPrompt').addEventListener('click', function() {
    var p = currentPrompt;
    if (!p) return;

    var text;
    /* If showing translated preview, copy the translated text */
    if (showingPreviewTranslated && translatedPreview) {
      text = translatedPreview;
    } else {
      var vars = {};
      document.querySelectorAll('#varPanel .var-input').forEach(function(inp) {
        vars[inp.dataset.var] = inp.value;
      });
      text = fillTemplate(p.template, vars);
      /* Remove any remaining {{}} */
      text = text.replace(/\{\{[^}]+\}\}/g, '');
      text = text.replace(/[，,\s]*[，,][，,\s]*/g, '，').replace(/^[，,\s]+|[，,\s]+$/g, '').trim();
    }
    /* Copy to clipboard */
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('已复制到剪贴板');
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制到剪贴板'); }
    catch(e) { showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }

  /* Save as new */
  document.getElementById('btnSaveAsNew').addEventListener('click', function() {
    if (!currentPrompt) return;
    var p = currentPrompt;
    var vars = {};
    document.querySelectorAll('#varPanel .var-input').forEach(function(inp) {
      vars[inp.dataset.var] = inp.value;
    });
    var filled = fillTemplate(p.template, vars);
    /* Remove any remaining {{}} */
    filled = filled.replace(/\{\{[^}]+\}\}/g, '');
    filled = filled.replace(/[，,\s]*[，,][，,\s]*/g, '，').replace(/^[，,\s]+|[，,\s]+$/g, '').trim();
    var newRecord = {
      id: genId(),
      title: p.title + ' (副本)',
      template: filled,
      variables: {},
      images: p.images ? p.images.slice() : [],
      coverIndex: p.coverIndex || 0,
      tags: p.tags ? p.tags.slice() : [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    dbAdd(newRecord).then(function() {
      showToast('已另存为新提示词');
      loadAll().then(function() {
        goToDetail(newRecord.id);
      });
    });
  });

  /* Edit back — return to list */
  document.getElementById('editBack').addEventListener('click', function() {
    loadAll().then(function() { renderList(); switchView('list'); });
  });
  document.getElementById('editCancel').addEventListener('click', function() {
    loadAll().then(function() { renderList(); switchView('list'); });
  });

  /* Edit save */
  document.getElementById('editSave').addEventListener('click', savePrompt);

  /* Prompt editor: live update var defaults */
  document.getElementById('editPrompt').addEventListener('input', renderEditVarDefaults);

  /* Smart parse */
  var originalTextBeforeParse = null;
  document.getElementById('btnSmartParse').addEventListener('click', function() {
    var ta = document.getElementById('editPrompt');
    var text = ta.value;
    if (!text.trim()) { showToast('请先输入提示词'); return; }
    /* Save original text for undo */
    originalTextBeforeParse = text;
    var parsed = smartParse(text);
    ta.value = parsed.template;
    /* Save parsed defaults to currentPrompt for later use */
    if (!currentPrompt) currentPrompt = {};
    if (!currentPrompt.variables) currentPrompt.variables = {};
    Object.keys(parsed.defaults).forEach(function(k) {
      currentPrompt.variables[k] = parsed.defaults[k];
    });
    renderEditVarDefaults();
    /* Show undo button */
    document.getElementById('btnUndoParse').style.display = '';
    showToast('智能解析完成，已自动填充原始值');
  });

  /* Undo smart parse — restore original text */
  document.getElementById('btnUndoParse').addEventListener('click', function() {
    if (originalTextBeforeParse === null) return;
    var ta = document.getElementById('editPrompt');
    ta.value = originalTextBeforeParse;
    originalTextBeforeParse = null;
    document.getElementById('btnUndoParse').style.display = 'none';
    renderEditVarDefaults();
    showToast('已还原到解析前的文案');
  });

  /* Translate in edit mode (operates directly on the textarea) */
  var editOriginalText = null;      /* saved original text before translation */
  var editShowingTranslated = false;

  document.getElementById('btnTranslateEdit').addEventListener('click', function() {
    var btn = this;
    var textarea = document.getElementById('editPrompt');

    /* If currently showing translated, restore original */
    if (editShowingTranslated && editOriginalText !== null) {
      editShowingTranslated = false;
      btn.title = '中英互译';
      textarea.value = editOriginalText;
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }

    var text = textarea.value.trim();
    if (!text) { showToast('请先输入提示词内容'); return; }

    /* Detect language */
    var chineseChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
    var targetLang = chineseChars > text.length * 0.3 ? 'en' : 'zh-CN';

    btn.disabled = true;
    btn.title = '翻译中...';

    /* Protect {{variable}} placeholders */
    var placeholders = [];
    var textToTranslate = text.replace(/\{\{([^}]+)\}\}/g, function(match) {
      var idx = placeholders.length;
      placeholders.push(match);
      return ' XVAR' + idx + 'X ';
    });

    translateText(textToTranslate, targetLang).then(function(translated) {
      /* Restore placeholders */
      translated = translated.replace(/XVAR\s*(\d+)\s*X/g, function(match, num) {
        return placeholders[parseInt(num)] || match;
      });
      translated = translated.replace(/\s*(\{\{[^}]+\}\})\s*/g, '$1');

      /* Save original, apply translated text */
      editOriginalText = textarea.value;
      textarea.value = translated;
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      editShowingTranslated = true;
      btn.disabled = false;
      btn.title = '查看原文';
      showToast(targetLang === 'en' ? '已翻译为英文' : '已翻译为中文');
    }).catch(function(err) {
      btn.disabled = false;
      btn.title = '中英互译';
      console.error('[translate edit]', err);
      showToast('翻译失败：' + (err.message || '所有翻译服务均不可用'));
    });
  });

  /* Mark as variable */
  document.getElementById('btnMarkVar').addEventListener('click', function() {
    markMode = !markMode;
    var btn = document.getElementById('btnMarkVar');
    if (markMode) {
      btn.classList.add('mark-active');
      showToast('选中文字后点击此处标记为变量');
    } else {
      btn.classList.remove('mark-active');
    }
  });

  document.getElementById('editPrompt').addEventListener('mouseup', function() {
    if (!markMode) return;
    var ta = this;
    var start = ta.selectionStart;
    var end = ta.selectionEnd;
    if (start === end) return;
    var selected = ta.value.substring(start, end).trim();
    if (!selected) return;
    /* Generate variable name from selection — preserve special chars like ° */
    var varName = selected.length > 8 ? selected.substring(0, 8) : selected;
    /* Only replace characters that conflict with {{}} syntax or whitespace */
    varName = varName.replace(/[\{\}\s]/g, '_');
    var before = ta.value.substring(0, start);
    var after = ta.value.substring(end);
    /* Check if already wrapped */
    if (before.endsWith('{{') && after.startsWith('}}')) return;
    ta.value = before + '{{' + varName + '}}' + after;
    /* Set default value to the original selected text */
    if (!currentPrompt) currentPrompt = {};
    if (!currentPrompt.variables) currentPrompt.variables = {};
    currentPrompt.variables[varName] = selected;
    markMode = false;
    document.getElementById('btnMarkVar').classList.remove('mark-active');
    renderEditVarDefaults();
    showToast('已标记为变量: {{' + varName + '}}，默认值已填入');
  });

  /* Upload images */
  document.getElementById('uploadAdd').addEventListener('click', function() {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', function() {
    var files = Array.prototype.slice.call(this.files);
    if (files.length === 0) return;
    files.forEach(function(f) { addEditImage(f); });
    document.getElementById('fileInput').value = '';
  });

  /* Paste images — works when edit view is active */
  document.addEventListener('paste', function(e) {
    if (currentView !== 'edit') return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var hasImage = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        hasImage = true;
        var file = items[i].getAsFile();
        if (!file) continue;
        addEditImage(file);
      }
    }
    if (hasImage) {
      e.preventDefault();
      showToast('图片已粘贴');
    }
  });

  /* Modal */
  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalConfirm').addEventListener('click', function() {
    if (modalCallback) modalCallback();
    hideModal();
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) hideModal();
  });

  /* ============================================
     Data Management Event Listeners
     ============================================ */
  /* Settings button — open modal */
  document.getElementById('btnDataSettings').addEventListener('click', function() {
    document.getElementById('dataSettingsOverlay').classList.add('active');
    /* Refresh backup status when opening */
    if (isAutoBackupEnabled()) {
      backupToLocalStorage().then(function(count) {
        var status = document.getElementById('backupStatus');
        if (status) status.textContent = '自动备份已启用，' + count + ' 条已备份';
      });
    } else {
      var backup = getBackupFromLocalStorage();
      var status = document.getElementById('backupStatus');
      if (status) {
        if (backup) {
          status.textContent = '上次备份 ' + backup.prompts.length + ' 条 (' + new Date(backup.exportedAt).toLocaleString() + ')';
        } else {
          status.textContent = '尚未备份';
        }
      }
    }
  });
  /* Close modal */
  document.getElementById('dataSettingsClose').addEventListener('click', function() {
    document.getElementById('dataSettingsOverlay').classList.remove('active');
  });
  document.getElementById('dataSettingsOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  /* Export */
  document.getElementById('btnExportData').addEventListener('click', exportAllData);

  /* Import */
  document.getElementById('btnImportData').addEventListener('click', function() {
    document.getElementById('importFileInput').click();
  });
  document.getElementById('importFileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    importDataFromFile(file).then(function(records) {
      /* Default to merge (safest: keeps existing, overwrites same ID) */
      mergeImportRecords(records).then(function(result) {
        showToast('导入完成：新增 ' + result.added + ' 条，覆盖 ' + result.updated + ' 条');
        loadAll().then(renderList);
      }).catch(function(err) {
        showToast('导入失败：' + (err.message || '未知错误'));
      });
    }).catch(function(err) {
      showToast('导入失败：' + (err.message || '未知错误'));
    });
    this.value = '';
  });

  /* Backup now */
  document.getElementById('btnBackupNow').addEventListener('click', function() {
    backupToLocalStorage().then(function(count) {
      var status = document.getElementById('backupStatus');
      if (status) {
        var now = new Date();
        status.textContent = '已备份 ' + count + ' 条 (' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + ')';
      }
      showToast('已备份 ' + count + ' 条数据到浏览器');
    }).catch(function(err) {
      showToast('备份失败：' + (err.message || '未知错误'));
    });
  });

  /* Compress existing images */
  document.getElementById('btnCompressImages').addEventListener('click', compressAllImages);

  /* Auto backup toggle */
  var autoBackupToggle = document.getElementById('autoBackupToggle');
  autoBackupToggle.checked = isAutoBackupEnabled();
  autoBackupToggle.addEventListener('change', function() {
    setAutoBackupEnabled(this.checked);
    if (this.checked) {
      backupToLocalStorage().then(function(count) {
        var status = document.getElementById('backupStatus');
        if (status) status.textContent = '自动备份已启用，' + count + ' 条已备份';
        showToast('自动备份已开启');
      });
    } else {
      document.getElementById('backupStatus').textContent = '自动备份已关闭';
      showToast('自动备份已关闭');
    }
  });

  /* ============================================
     Floating Category Bar & Back-to-Top
     ============================================ */
  var floatingCatBar = document.getElementById('floatingCatBar');
  var floatingCategoryFilter = document.getElementById('floatingCategoryFilter');
  var floatScrollLeft = document.getElementById('floatScrollLeft');
  var floatScrollRight = document.getElementById('floatScrollRight');
  var backToTopBtn = document.getElementById('backToTop');
  var originalCatFilter = document.getElementById('categoryFilter');
  var SCROLL_AMOUNT_FLOAT = 200;

  /* Render floating categories (mirrors main categories) */
  function renderFloatingCategories() {
    floatingCategoryFilter.innerHTML = '';
    CATEGORIES.forEach(function(cat, idx) {
      var btn = document.createElement('button');
      var cls = 'cat-pill' + (cat.key === activeCategory ? ' active' : '');
      if (idx === 0) cls += ' is-pinned';
      btn.className = cls;
      btn.textContent = cat.label;
      btn.addEventListener('click', function() {
        activeCategory = cat.key;
        renderCategories();
        renderFloatingCategories();
        renderList();
      });
      floatingCategoryFilter.appendChild(btn);
    });
    setTimeout(updateFloatScrollBtns, 0);
  }

  function updateFloatScrollBtns() {
    if (!floatingCategoryFilter) return;
    var maxScroll = floatingCategoryFilter.scrollWidth - floatingCategoryFilter.clientWidth;
    var scrolled = floatingCategoryFilter.scrollLeft;
    if (scrolled <= 1) {
      floatScrollLeft.classList.add('is-disabled');
    } else {
      floatScrollLeft.classList.remove('is-disabled');
    }
    if (scrolled >= maxScroll - 1) {
      floatScrollRight.classList.add('is-disabled');
    } else {
      floatScrollRight.classList.remove('is-disabled');
    }
  }

  floatScrollLeft.addEventListener('click', function() {
    floatingCategoryFilter.scrollBy({ left: -SCROLL_AMOUNT_FLOAT, behavior: 'smooth' });
  });
  floatScrollRight.addEventListener('click', function() {
    floatingCategoryFilter.scrollBy({ left: SCROLL_AMOUNT_FLOAT, behavior: 'smooth' });
  });
  floatingCategoryFilter.addEventListener('scroll', updateFloatScrollBtns);

  /* Sync scroll position between original and floating filters */
  var syncTimer = null;
  function syncScroll(source, target) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function() {
      target.scrollLeft = source.scrollLeft;
    }, 10);
  }
  originalCatFilter.addEventListener('scroll', function() {
    if (floatingCatBar.classList.contains('is-visible')) {
      syncScroll(originalCatFilter, floatingCategoryFilter);
    }
  });
  floatingCategoryFilter.addEventListener('scroll', function() {
    syncScroll(floatingCategoryFilter, originalCatFilter);
  });

  /* Scroll handler: show/hide floating bar and back-to-top */
  function handleScrollVisibility() {
    var scrollY = window.scrollY;
    var viewportH = window.innerHeight;
    var catRect = originalCatFilter.getBoundingClientRect();

    /* Show floating bar when original filter scrolls out of view (1 screen down) */
    if (catRect.bottom < 48 && document.getElementById('viewList').classList.contains('active')) {
      floatingCatBar.classList.add('is-visible');
    } else {
      floatingCatBar.classList.remove('is-visible');
    }

    /* Show back-to-top after 3 screen heights */
    if (scrollY > viewportH * 3) {
      backToTopBtn.classList.add('is-visible');
    } else {
      backToTopBtn.classList.remove('is-visible');
    }
  }

  window.addEventListener('scroll', handleScrollVisibility, { passive: true });
  window.addEventListener('resize', function() {
    updateFloatScrollBtns();
    handleScrollVisibility();
  });

  /* Back to top click */
  backToTopBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ============================================
     Init
     ============================================ */
  openDB().then(function() {
    renderCategories();
    renderFloatingCategories();
    /* Check if DB is empty but localStorage has backup */
    checkAndOfferRestore();
    return loadAll();
  }).then(function() {
    renderList();
    handleScrollVisibility();
  }).catch(function(err) {
    console.error('Init error:', err);
    showToast('初始化失败，请刷新重试');
  });

})();
</script>

</body>
</html>
