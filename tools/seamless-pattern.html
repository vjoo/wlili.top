        buildPrompt: function() {
            var s = this.genState;
            if (s.subjects.length === 0 && s.decorations.length === 0) return '';
            var pal = getPalettes().find(function(p){ return p.id === s.paletteId; }) || DEFAULT_PALETTES[0];
            // 色名去重：同一色名出现多次时追加序号区分（如"浅杏1"、"浅杏2"）
            var _nameCount = {};
            var colorList = pal.colors.map(function(c){
                var name = hexToColorName(c);
                if (_nameCount[name] !== undefined) {
                    _nameCount[name]++;
                    name = name + _nameCount[name];
                } else {
                    _nameCount[name] = 0;
                }
                return name + ' ' + c;
            }).join('、');
            var style = STYLES[s.styleIndex];

            var hasOutfits = s.outfits.length > 0 && s.subjects.length > 0;

            // 构建头饰集合（用于冲突检测：头饰不可叠加，需分配给不同角色）
            var elements = getElements();
            var headwearSet = {};
            elements.outfits.forEach(function(cat) {
                if (cat.category === '头饰') {
                    cat.items.forEach(function(item) { headwearSet[item] = true; });
                }
            });
            // 构建表情动作集合（用于单主体重复时分配不同表情）
            var expressionSet = {};
            elements.outfits.forEach(function(cat) {
                if (cat.category === '表情动作') {
                    cat.items.forEach(function(item) { expressionSet[item] = true; });
                }
            });

            // 构建主体元素描述
            var subjectStr = s.subjects.join('、');

            // 拟人化描述：按类别分组，生成自然语言
            if (hasOutfits) {
                // 区分职业套装和普通配饰
                var professionSets = [];
                var normalOutfits = [];
                s.outfits.forEach(function(item) {
                    if (item.indexOf('（') > 0 && item.indexOf('）') > 0) {
                        professionSets.push(item);
                    } else {
                        normalOutfits.push(item);
                    }
                });

                // 职业套装：提取括号内细节，直接展开描述
                var outfitDescParts = [];
                professionSets.forEach(function(ps) {
                    var match = ps.match(/（(.+?)）/);
                    if (match) {
                        var setName = ps.substring(0, ps.indexOf('（'));
                        outfitDescParts.push(setName + '造型（' + match[1] + '）');
                    }
                });

                // 普通配饰：按前缀分组
                var groups = { '穿': [], '戴': [], '系': [], '架': [], '拿': [], '背': [], '挎': [], '推': [], '骑': [], '捧': [], '抱': [] };
                var exprParts = [];
                normalOutfits.forEach(function(item) {
                    var firstChar = item.charAt(0);
                    if (groups[firstChar]) {
                        groups[firstChar].push(item.substring(1));
                    } else {
                        // 表情动作类（不以穿/戴/拿等开头）
                        exprParts.push(item);
                    }
                });

                // ===== 头饰分配逻辑（核心：每只角色仅佩戴一种主要头饰，不叠加）=====
                // 从戴类中分离出头饰和非头饰（围巾眼镜等）
                var headwearSelected = [];
                var otherWear = [];
                groups['戴'].forEach(function(itemName) {
                    var fullItem = '戴' + itemName;
                    if (headwearSet[fullItem]) {
                        headwearSelected.push(itemName);
                    } else {
                        otherWear.push(itemName);
                    }
                });

                if (headwearSelected.length > 0) {
                    if (headwearSelected.length === 1) {
                        // 只选了一种头饰：所有角色都戴这种
                        outfitDescParts.push('头戴' + headwearSelected[0]);
                    } else {
                        // 选了多种头饰：分配给不同角色，每只仅戴一种
                        var distribParts = [];
                        for (var hi = 0; hi < headwearSelected.length; hi++) {
                            distribParts.push('一只戴' + headwearSelected[hi]);
                        }
                        outfitDescParts.push('各角色佩戴不同头饰互不叠加（' + distribParts.join('，') + '）');
                    }
                }
                // 非头饰戴类（墨镜等）：所有角色可共同佩戴
                if (otherWear.length > 0) {
                    outfitDescParts.push('佩戴' + otherWear.join('、'));
                }

                // 围巾
                if (groups['系'].length > 0) outfitDescParts.push('系着' + groups['系'].join('、'));
                // 眼镜
                if (groups['架'].length > 0) outfitDescParts.push('架着' + groups['架'].join('、'));
                // 服装
                if (groups['穿'].length > 0) outfitDescParts.push('身穿' + groups['穿'].join('、'));
                // 手持
                if (groups['拿'].length > 0) outfitDescParts.push('手持' + groups['拿'].join('、'));
                if (groups['背'].length > 0) outfitDescParts.push('背着' + groups['背'].join('、'));
                if (groups['挎'].length > 0) outfitDescParts.push('挎着' + groups['挎'].join('、'));
                if (groups['推'].length > 0) outfitDescParts.push('推着' + groups['推'].join('、'));
                if (groups['骑'].length > 0) outfitDescParts.push('骑着' + groups['骑'].join('、'));
                if (groups['捧'].length > 0) outfitDescParts.push('捧着' + groups['捧'].join('、'));
                if (groups['抱'].length > 0) outfitDescParts.push('抱着' + groups['抱'].join('、'));

                var exprStr = '';
                if (exprParts.length > 0) exprStr = '，表情' + exprParts.join('、');

                subjectStr = s.subjects.join('、') + '（拟人化形象：' + outfitDescParts.join('，') + exprStr + '）';
            }

            var decoStr = s.decorations.length > 0 ? s.decorations.join('、') : '';
            // 单一主体重复时在元素描述中标注
            var repeatNote = '';
            if (s.subjects.length === 1) {
                repeatNote = '（该角色以3种不同姿态重复出现3次）';
            } else if (s.subjects.length === 2) {
                repeatNote = '（每只角色以不同姿态重复出现2次）';
            }
            var elementsStr = decoStr ? subjectStr + repeatNote + '、' + decoStr : subjectStr + repeatNote;

            var p = '';
            // ===== 构图布局描述（根据构图方式 + 实际元素数量动态生成）=====
            var layoutDesc = '';
            // 单一主体自动重复以填充构图：1个主体×3姿态，2个主体×2姿态
            var uniqueSubjectCount = s.subjects.length;
            var isSingleSubjectRepeat = false;
            var repeatCount = 1;
            if (uniqueSubjectCount === 1) {
                repeatCount = 3;
                isSingleSubjectRepeat = true;
            } else if (uniqueSubjectCount === 2) {
                repeatCount = 2;
                isSingleSubjectRepeat = true;
            }
            var mainCount = uniqueSubjectCount * repeatCount;
            var auxCount = s.decorations.length;
            // 无主体时，装饰元素充当主体
            if (mainCount === 0 && auxCount > 0) { mainCount = auxCount; auxCount = 0; }
            // 辅助元素拆分为中等 + 小型
            var medCount = 0, smlCount = 0;
            if (auxCount > 0) {
                if (auxCount <= 2) { medCount = auxCount; }
                else { medCount = Math.ceil(auxCount * 0.6); smlCount = auxCount - medCount; }
            }
            // 元素层级大小描述（量化比例，确保主次分明）
            var sizeRule = '元素大小层级严格分明且整体偏小：主元素最大（仅占画面约1/10面积，小巧精致），中等辅助元素约为主元素的1/4大小，小型点缀元素约为主元素的1/8大小，所有元素都画得偏小，三层大小差异显著，辅助元素极其小巧不抢主元素视觉焦点';
            // 完整性规则：主体完整，只有小型装饰可半截
            var integrityRule = '所有主元素（角色）必须完整绘制，不可被画面边缘裁切，主体角色整体位于画面内部；仅小型点缀元素可在四角半截以保证拼接无缝';
            // 间距呼吸感规则：元素间保持充足空隙，疏密得当
            var spacingRule = '元素间距严格控制且留白充足：任意两个元素之间至少留出三个小元素宽度的空白间距，元素互不贴靠不挤压，四周元素与主元素之间留有大于主元素本身宽度的空隙，整体错落有致，疏密得当，大面积留白，元素之间有充足呼吸空间，画面松弛通透，久看不累';
            // 构建辅助元素描述片段
            var auxStr = '';
            if (auxCount > 0) {
                if (smlCount > 0) {
                    auxStr = medCount + '个中等大小辅助元素填充空隙，' + smlCount + '个小型点缀元素散布增加细节';
                } else {
                    auxStr = medCount + '个辅助元素填充空隙';
                }
            }

            if (s.layoutIndex === 0) {
                // 斜角构图：所有主元素沿对角线排列，数量动态
                layoutDesc = '斜对角线构图布局（diagonal arrangement）：' + mainCount + '个主元素沿同一条对角线对角放置' +
                    (auxStr ? '，' + auxStr : '') +
                    '，小型点缀元素随机散布于画面各处空白区域（四角半截锚定以保证拼接无缝），点缀元素分布自然有节奏感，不扎堆不偏聚，不沿边缘整齐排列，所有元素有轻微旋转和方向变化（不是全部朝同一个方向）。' + sizeRule + '。' + integrityRule + '。' + spacingRule + '。强调对角线排列（diagonal placement），不要中心构图（centered composition）';
            } else if (s.layoutIndex === 1) {
                // 三角构图：所有主元素呈三角形分布，数量动态
                layoutDesc = '三角形构图布局（triangle composition）：' + mainCount + '个主元素呈三角形分布排列' +
                    (mainCount === 3 ? '（上方一个+左下一个+右下一个）' : '，以三角形三个顶点为核心沿边延伸分布') +
                    (auxStr ? '，' + auxStr : '') +
                    '，小型点缀元素随机散布于画面各处空白区域（角落半截锚定以保证拼接无缝），点缀元素分布自然有节奏感，不沿边缘整齐排列，元素有轻微大小和旋转变化，视觉重量分布稳定，节奏均衡。' + sizeRule + '。' + integrityRule + '。' + spacingRule + '。不要居中对称，不要杂乱';
            } else if (s.layoutIndex === 2) {
                // 中心构图：1主居中 + 其余环绕，数量动态
                var centerStr = mainCount === 1 ? '1个大型主元素放在正中心位置' : '1个大型主元素放在正中心位置为主视觉焦点，其余' + (mainCount - 1) + '个主元素紧邻中心环绕分布';
                layoutDesc = '中心构图布局（central focal composition）：' + centerStr +
                    (auxStr ? '，' + auxStr : '') +
                    '，多个小型点缀元素向外辐射随机散布于画面各处空白区域（四角半截锚定以保证拼接无缝），点缀元素分布自然不扎堆，不沿边缘整齐排列，放射状分布规律，中心有强烈视觉焦点，元素从中心向外逐渐变小，基本对称但有轻微自然变化。' + sizeRule + '。' + integrityRule + '。' + spacingRule + '。不要对角线排列，不要偏中心';
            } else {
                // 散点式满铺：所有元素均匀散布
                var totalCount = mainCount + auxCount;
                layoutDesc = '散点式满铺构图（scatter pattern）：' + totalCount + '个元素大小不一、均匀散布在整个画面，没有单一视觉焦点，随机但和谐地分布，大小元素混合搭配，元素有不同的旋转角度、方向和位置，密集但不拥挤，视觉肌理一致，视觉重量分布均匀，没有空白处也没有扎堆的地方，四个角落仅有小型点缀元素半截以保证拼接无缝，有机随机排布，活泼随意的感觉。' + sizeRule + '。' + spacingRule + '。主元素完整不被裁切，仅小型点缀元素可半截。不要对角线排列，不要中心对称，不要三角形布局';
            }

            p += '无缝四方连续插画图案（seamless tileable repeat pattern），'+style+'风格，'+elementsStr+'，'+layoutDesc+'。';

            // ===== 文字元素（英文单词）专属描述 =====
            var _wordList = ['happy','luck','nice','sweet','love','joy','dream','smile','star','sun','cute','hello','honey','fun','bloom'];
            var selectedWords = s.decorations.filter(function(d) { return _wordList.indexOf(d) >= 0; });
            if (selectedWords.length > 0) {
                var ws = WORD_STYLES[s.wordStyleIndex] || WORD_STYLES[0];
                p += '文字元素：画面中的英文单词（' + selectedWords.join('、') + '）作为独立文字装饰元素出现，采用' + ws.name + '：' + ws.desc + '。文字元素专属约束：去除所有外轮廓描边、无白色包边、无贴纸白光晕、无剪贴贴纸效果，字母无外圈边框；纯粹色块构成字体，字体边缘柔和融合底色，仅依靠形体膨胀塑造体积，不依靠线条描边区分边界。重要约束：字体全程不添加任何外轮廓线条，不存在任何粗细的描边（黑/灰/白描边全部禁止），不要白边、不要轮廓框；依靠色块自身形态与微弱高光表现充气膨胀感，字母边界平滑，无分割线条。单词整体作为小型点缀装饰，大小约为主元素的1/8，各单词有不同的轻微旋转角度，颜色使用色板内色彩，与整体画面风格统一。';
            }

            // ===== 点缀元素样式约束 =====
            if (s.decorations.indexOf('小圆波点') >= 0) {
                p += '点缀元素样式：小圆波点统一为实心纯色圆形色块，严禁出现空心圆环、描边圆圈、渐变圆或双层圆等不一致形态，波点大小随机有大有小增加层次感，颜色使用色板内色彩，散布位置均匀自然不扎堆。';
            }

            // ===== 主体元素冲突规避规则 =====
            var subjectCount = s.subjects.length;

            // 检测是否包含融合角色（云朵兔等自带融合属性的角色）
            var fusionSet = {};
            elements.subjects.forEach(function(cat) {
                if (cat.category === '融合角色') {
                    cat.items.forEach(function(item) { fusionSet[item] = true; });
                }
            });
            var hasFusion = s.subjects.some(function(subj) { return fusionSet[subj]; });
            var normalSubjects = s.subjects.filter(function(subj) { return !fusionSet[subj]; });
            var fusionSubjects = s.subjects.filter(function(subj) { return fusionSet[subj]; });

            // 检测是否包含头像系列（仅头部，无身体）
            var avatarSet = {};
            elements.subjects.forEach(function(cat) {
                if (cat.category === '头像系列') {
                    cat.items.forEach(function(item) { avatarSet[item] = true; });
                }
            });
            var avatarSubjects = s.subjects.filter(function(subj) { return avatarSet[subj]; });
            var nonAvatarNormal = normalSubjects.filter(function(subj) { return !avatarSet[subj]; });

            // 融合角色描述
            if (fusionSubjects.length > 0) {
                p += '融合角色（'+fusionSubjects.join('、')+'）为动物与自然元素结合的创意形象，保留动物头部特征，身体融合云朵/棉花糖/星光等元素，呈现梦幻漂浮感，同一融合角色在不同位置可变换配色。';
            }

            // 头像系列描述：仅头部，无身体，无肢体动作
            if (avatarSubjects.length > 0) {
                p += '头像系列角色（'+avatarSubjects.join('、')+'）仅绘制头部，无身体、无肢体、无站姿动作，仅做轻微镜像和大小变化重复出现，豆豆眼搭配简约弧线小嘴。';
            }

            // 普通非头像主体冲突规避
            if (nonAvatarNormal.length > 1) {
                p += '画面中包含'+nonAvatarNormal.length+'种不同的动物角色，每种角色独立存在，严禁将不同动物的特征融合或拼接为混合生物，每只角色保持自身物种特征清晰可辨。';
                if (hasOutfits) {
                    p += '不同角色的服装配饰应有所区别，避免所有角色穿着完全相同，增加画面丰富度。';
                }
            } else if (nonAvatarNormal.length === 1 && fusionSubjects.length === 0 && avatarSubjects.length === 0) {
                // 单一主体重复描述
                var exprItems = [];
                s.outfits.forEach(function(item) {
                    if (expressionSet[item]) exprItems.push(item);
                });
                if (isSingleSubjectRepeat && repeatCount > 1) {
                    p += '画面中同一只'+nonAvatarNormal[0]+'以'+repeatCount+'种不同姿态重复出现'+repeatCount+'次，每次姿态、表情、动作各不相同';
                    if (exprItems.length >= repeatCount) {
                        // 将表情分配到各重复实例
                        var exprAssign = [];
                        for (var ri = 0; ri < repeatCount; ri++) {
                            exprAssign.push('第'+(ri+1)+'只'+exprItems[ri % exprItems.length]);
                        }
                        p += '（'+exprAssign.join('、')+'）';
                    }
                    p += '，服装配饰可略有变化增加丰富度，但角色物种特征保持完全一致，严禁变为其他动物。各重复实例之间有充足间距不重叠。';
                } else {
                    p += '主体为单一萌系动物角色，在不同位置以不同姿态重复出现。';
                }
            } else if (nonAvatarNormal.length === 2 && isSingleSubjectRepeat) {
                // 两个主体各重复2次
                p += '画面中'+nonAvatarNormal[0]+'和'+nonAvatarNormal[1]+'各以不同姿态重复出现2次（共4个角色实例），每种角色保持物种特征一致，不同角色之间严禁特征融合。';
            }

            if (hasOutfits) {
                p += '主体角色为拟人化萌系动物，具有人类般的站立姿态和穿着打扮，服装配饰细节简洁可爱，与角色整体风格统一。';
                // 头饰不叠加规则
                var hasMultipleHeadwear = false;
                if (hasOutfits) {
                    var hwCount = 0;
                    s.outfits.forEach(function(item) {
                        if (headwearSet[item]) hwCount++;
                    });
                    hasMultipleHeadwear = hwCount > 1;
                }
                if (hasMultipleHeadwear) {
                    p += '重要规则：每只角色仅佩戴一种主要头饰，严禁在同一角色上叠加多种帽子或头饰，不同角色分配不同头饰增加多样性。';
                }
                p += '每只动物穿着可略有不同增加变化。';
            }

            // ===== 弧形结构线描述 =====
            var structureLines = ['弧形灯串线', '曲线彩带', '波浪拉旗', '细绳挂饰', '小圆珠链条'];
            var hasStructureLine = s.decorations.some(function(d) { return structureLines.indexOf(d) >= 0; });
            if (hasStructureLine) {
                var slNames = s.decorations.filter(function(d) { return structureLines.indexOf(d) >= 0; });
                p += '多条独立分段短弧形'+slNames.join('、')+'横向分层错落排布，每段挂绳是独立的短弧线，不是一条长贯通曲线横穿画布，挂绳上悬挂五角星与小圆珠装饰，轻盈稀疏，空隙充足。';
            }

            p += '单位纹样四边边缘无缝对接：仅小型点缀元素超出边界从对侧延续，主元素和中等辅助元素完整位于画面内部不被裁切，确保任意位置裁切均可无缝拼接。';
            p += '相同元素在不同位置作旋转和镜像变化，方向多样不统一，避免排列呆板。';
            p += '底色奶油白 '+pal.bgColor+'，严格限定图案仅使用'+pal.colors.length+'种色彩：'+colorList+'，柔和深灰 '+pal.lineColor+' 纤细轮廓线。禁止生成色板以外任何颜色。';
            p += '三层明度秩序：大面积中间明度色彩，高明度亮色作为主体视觉，少量低明度色彩点缀；饱和度控制20~48，禁止高饱和荧光色。暖色为主，少量薄荷蓝平衡色调。';
            p += '所有元素造型全部圆润无尖角，平滑曲线，五官简化为豆豆眼加弧线小嘴，幼态软萌。';
            p += '干净iPad矢量平涂，顺滑闭合线条，无纸张纹理、无笔触噪点、无渐变、无阴影、无肌理杂色，纯色平整色块，适合AI矢量描摹、数码印花应用。';
            if (s.layoutIndex === 3) {
                p += '画面密集但不拥挤，视觉肌理一致，视觉重量分布均匀，禁止元素扎堆。';
            } else {
                p += '元素间预留充足留白，疏密均衡，轻盈通透，禁止元素过度堆砌拥挤。';
            }
            p += '画面整洁，不要水印，8K高清，正方形无缝拼接单元。';
            return p;
        },

        savePromptToLibrary: function() {
            var s = this.genState;
            var edit = document.getElementById('promptOutputEdit');
            var prompt = (edit && edit.style.display !== 'none') ? edit.value : this.buildPrompt();
            if (!prompt) { showToast('请先生成提示词'); return; }
            var pal = getPalettes().find(function(p){ return p.id === s.paletteId; }) || DEFAULT_PALETTES[0];
            var fp = makeFingerprint(s.subjects, s.outfits, s.decorations, s.paletteId, LAYOUTS[s.layoutIndex]);
            var dup = checkDuplicate(fp);
            if (dup) {
                if (!confirm('已存在相同组合的素材「'+dup.name+'」，确定要继续入库吗？')) return;
            }
            var name = s.subjects.slice(0,2).concat(s.outfits.slice(0,1)).concat(s.decorations.slice(0,2)).join('') || '未命名素材';
            var pattern = {
                id: genId('PAT'),
                name: name,
                prompt: prompt,
                elements: { subjects: s.subjects.slice(), outfits: s.outfits.slice(), decorations: s.decorations.slice() },
                paletteId: s.paletteId,
                paletteName: pal.name,
                layout: LAYOUTS[s.layoutIndex],
                style: STYLES[s.styleIndex],
                platform: '',
                generatedDate: formatDate(new Date()),
                thumbnail: '',
                fingerprint: fp,
                notes: '',
                createdAt: new Date().toISOString()
            };
            var patterns = getPatterns();
            patterns.push(pattern);
            saveData(STORAGE_KEYS.patterns, patterns);
            showToast('素材已入库：'+name);
            this.switchModule('patternAssets');
        },

                if (l.notes) html += '<div class="license-card-row"><span class="license-card-label">备注</span><span class="license-card-value" style="color:var(--text-muted);font-size:12px;">'+escapeHtml(l.notes)+'</span></div>';

        // ===== 色板管理 =====
        renderPalettes: function() {
            var palettes = getPalettes();
            var searchKw = this._paletteSearch || '';
            var filtered = palettes;
            if (searchKw) {
                var kw = searchKw.toLowerCase();
                filtered = palettes.filter(function(pal) {
                    if (pal.name.toLowerCase().indexOf(kw) >= 0) return true;
                    if (pal.desc && pal.desc.toLowerCase().indexOf(kw) >= 0) return true;
                    if (pal.bgColor.toLowerCase().indexOf(kw) >= 0) return true;
                    if (pal.lineColor.toLowerCase().indexOf(kw) >= 0) return true;
                    return pal.colors.some(function(c){ return c.toLowerCase().indexOf(kw) >= 0; });
                });
            }
            var html = '<div class="filter-bar"><span style="font-size:13px;font-weight:600;color:var(--text-primary);">色板管理</span>';
            html += '<input class="form-input" id="paletteSearchInput" style="width:200px;height:32px;font-size:13px;" placeholder="搜索色板名称或色值…" value="'+escapeHtml(searchKw)+'" oninput="app._onPaletteSearch(this.value)">';
            html += '<span style="font-size:12px;color:var(--text-muted);margin-left:auto;">共 '+filtered.length+' 个色板</span>';
            html += '<button class="btn-primary btn-sm" onclick="app.openPaletteModal(null)">+ 新增色板</button>';
            html += '</div>';
            if (palettes.length === 0) {
                return html + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg><div class="empty-state-text">暂无色板，点击右上角新增</div></div>';
            }
            if (filtered.length === 0) {
                return html + '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><div class="empty-state-text">未找到匹配「'+escapeHtml(searchKw)+'」的色板</div></div>';
            }
            html += '<div class="psc-grid">';
            filtered.forEach(function(pal) {
                var isDefault = isDefaultPalette(pal.id);
                html += '<div class="psc-card" onclick="app.openPaletteModal(\''+pal.id+'\')">';
                // 右上角 hover 操作按钮
                html += '<div class="psc-card-actions">';
                html += '<button class="psc-action-btn" title="编辑" onclick="event.stopPropagation();app.openPaletteModal(\''+pal.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
                var isFav = pal.isFavorite || false;
                html += '<button class="psc-action-btn favorite-btn'+(isFav?' active':'')+'" title="'+(isFav?'取消收藏':'收藏')+'" onclick="event.stopPropagation();app.togglePaletteFavorite(\''+pal.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>';
                if (!isDefault) {
                    html += '<button class="psc-action-btn danger" title="删除" onclick="event.stopPropagation();app.deletePalette(\''+pal.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
                }
                html += '</div>';
                // 顶部色卡展示区：始终 2行3列 = 6 格，高度固定
                html += '<div class="psc-hero" style="background:'+pal.bgColor+';">';
                html += '<div class="psc-swatches">';
                var cols = pal.colors;
                var totalCells = 6;
                for (var ci = 0; ci < totalCells; ci++) {
                    if (ci < 5 && ci < cols.length) {
                        // 前5格：正常色块
                        html += '<div class="psc-swatch" style="background:'+cols[ci]+';"></div>';
                    } else if (ci === 5 && cols.length > 6) {
                        // 第6格：超过6色时，显示 mini 多色网格（iPhone 文件夹风格）
                        var extra = cols.slice(5);
                        var gridSize = extra.length <= 4 ? 2 : 3;
                        html += '<div class="psc-swatch-more" style="grid-template-columns:repeat('+gridSize+',1fr);grid-template-rows:repeat('+gridSize+',1fr);">';
                        extra.forEach(function(ec) { html += '<div class="psc-swatch-more-cell" style="background:'+ec+';"></div>'; });
                        html += '</div>';
                    } else if (ci < cols.length) {
                        // 第6格但总数正好6或更少：正常色块
                        html += '<div class="psc-swatch" style="background:'+cols[ci]+';"></div>';
                    } else {
                        // 空位：虚线占位
                        html += '<div class="psc-swatch-empty"></div>';
                    }
                }
                html += '</div>';
                html += '</div>';
                // 底部信息区
                html += '<div class="psc-info">';
                html += '<div class="psc-name">'+escapeHtml(pal.name)+(isDefault?'<span class="psc-badge-default">基础</span>':'')+'</div>';
                html += '<div class="psc-desc">'+escapeHtml(paletteAutoDesc(pal.colors))+'</div>';
                html += '<div class="psc-meta">';
                html += '<span class="psc-meta-item"><span class="psc-meta-dot" style="background:'+pal.bgColor+';"></span>'+pal.bgColor+'</span>';
                html += '<span class="psc-meta-item"><span class="psc-meta-dot" style="background:'+pal.lineColor+';"></span>'+pal.lineColor+'</span>';
                html += '</div>';
                html += '</div>';
                html += '</div>';
            });
            html += '</div>';
            return html;
        },

        // 渲染编辑页图片网格
        renderEditImages: function() {
            var grid = document.getElementById('editUploadGrid');
            if (!grid) return;
            // 清除已有 upload-item
            grid.querySelectorAll('.upload-item').forEach(function(el){ el.remove(); });
            var addBtn = grid.querySelector('.upload-add');
            this._editImages.forEach(function(img, i) {
                var item = document.createElement('div');
                item.className = 'upload-item';
                item.innerHTML =
                    '<img src="' + img.dataURL + '">' +
                    '<button class="upload-item-cover' + (img.isCover ? ' is-cover' : '') + '" data-idx="' + i + '" title="设为封面">' +
                        (img.isCover
                            ? '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
                            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>') +
                    '</button>' +
                    '<button class="upload-item-del" data-idx="' + i + '" title="删除">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                    '</button>';
                item.querySelector('.upload-item-cover').addEventListener('click', function(e) {
                    e.stopPropagation();
                    app._editImages.forEach(function(im){ im.isCover = false; });
                    app._editImages[i].isCover = true;
                    app.renderEditImages();
                });
                item.querySelector('.upload-item-del').addEventListener('click', function(e) {
                    e.stopPropagation();
                    var wasCover = app._editImages[i].isCover;
                    app._editImages.splice(i, 1);
                    if (wasCover && app._editImages.length > 0) app._editImages[0].isCover = true;
                    app.renderEditImages();
                });
                grid.insertBefore(item, addBtn);
            });
        },

        // 画廊导航
        galleryNav: function(dir) {
            var p = getPatterns().find(function(x){ return x.id === app._galleryId; });
            if (!p) return;
            var imgs = getPatternImages(p);
            if (imgs.length <= 1) return;
            app._galleryIndex += dir;
            if (app._galleryIndex < 0) app._galleryIndex = 0;
            if (app._galleryIndex >= imgs.length) app._galleryIndex = imgs.length - 1;
            app._renderGallery();
        },

        galleryGoTo: function(idx) {
            app._galleryIndex = idx;
            app._renderGallery();
        },

        _renderGallery: function() {
            var p = getPatterns().find(function(x){ return x.id === app._galleryId; });
            if (!p) return;
            var imgs = getPatternImages(p);
            var coverIdx = getCoverIndex(p);
            var idx = app._galleryIndex;
            var main = document.getElementById('detailGalleryMain');
            if (!main) return;
            var mainImg = main.querySelector('img');
            if (mainImg) mainImg.src = imgs[idx];
            // counter
            var counter = document.getElementById('detailGalleryCounter');
            if (counter) counter.textContent = (idx+1) + ' / ' + imgs.length;
            // nav buttons
            var prev = document.getElementById('detailGalleryPrev');
            var next = document.getElementById('detailGalleryNext');
            if (prev) prev.disabled = idx === 0;
            if (next) next.disabled = idx === imgs.length - 1;
            // cover button
            var coverBtn = document.getElementById('detailGalleryCoverBtn');
            if (coverBtn) {
                if (idx === coverIdx) {
                    coverBtn.classList.add('is-cover');
                    coverBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>当前封面';
                } else {
                    coverBtn.classList.remove('is-cover');
                    coverBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>设为封面';
                }
            }
            // thumbs
            var thumbs = document.getElementById('detailGalleryThumbs');
            if (thumbs) {
                thumbs.querySelectorAll('.gallery-thumb').forEach(function(t, i) {
                    t.classList.toggle('active', i === idx);
                });
            }
            // 同步更新 lightbox 图片（如果 lightbox 处于打开状态）
            var lb = document.getElementById('lightbox');
            if (lb && lb.classList.contains('active')) {
                var lbImg = document.getElementById('lightboxImg');
                if (lbImg) lbImg.src = imgs[idx];
            }
        },

        setCoverFromGallery: function() {
            var id = app._galleryId;
            var idx = app._galleryIndex;
            var patterns = getPatterns();
            var p = patterns.find(function(x){ return x.id === id; });
            if (!p) return;
            // 确保 images 数组存在
            if (!p.images || p.images.length === 0) {
                if (p.thumbnail) { p.images = [p.thumbnail]; p.thumbnail = null; }
                else return;
            }
            p.coverIndex = idx;
            p.updatedAt = new Date().toISOString();
            saveData(STORAGE_KEYS.patterns, patterns);
            showToast('已设为封面');
            app._renderGallery();
            // 更新缩略图上的封面标记
            var thumbs = document.getElementById('detailGalleryThumbs');
            if (thumbs) {
                thumbs.querySelectorAll('.gallery-thumb').forEach(function(t, i) {
                    var mark = t.querySelector('.gallery-thumb-cover-mark');
                    if (i === idx) {
                        if (!mark) {
                            mark = document.createElement('div');
                            mark.className = 'gallery-thumb-cover-mark';
                            mark.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
                            t.appendChild(mark);
                        }
                    } else {
                        if (mark) mark.remove();
                    }
                });
            }
        },

        // 图片预览（全屏查看，使用lightbox）
        openImagePreview: function(id) {
            var p = getPatterns().find(function(x){ return x.id === id; });
            var imgs = getPatternImages(p);
            if (imgs.length === 0) return;
            var idx = (app._galleryId === id) ? (app._galleryIndex || 0) : getCoverIndex(p);
            if (idx >= imgs.length) idx = 0;
            var lb = document.getElementById('lightbox');
            var lbImg = document.getElementById('lightboxImg');
            lbImg.src = imgs[idx];
            lb.classList.add('active');
        },

        savePatternDetail: function(id) {
            var patterns = getPatterns();
            var p = patterns.find(function(x){ return x.id === id; });
            if (!p) return;
            p.name = document.getElementById('pd_name').value.trim() || p.name;
            p.platform = document.getElementById('pd_platform').value;
            p.generatedDate = document.getElementById('pd_date').value;
            p.prompt = document.getElementById('pd_prompt').value;
            p.notes = document.getElementById('pd_notes').value;
            // 保存编辑页的图片列表
            if (this._editImages) {
                p.images = this._editImages.map(function(img){ return img.dataURL; });
                var coverIdx = this._editImages.findIndex(function(img){ return img.isCover; });
                p.coverIndex = coverIdx >= 0 ? coverIdx : 0;
                // 清除旧 thumbnail 字段
                p.thumbnail = null;
            }
            p.updatedAt = new Date().toISOString();
            saveData(STORAGE_KEYS.patterns, patterns);
            showToast('素材已更新');
            this.openPatternDetail(id);
        },

        uploadPatternThumb: function(id) {
            var self = this;
            self._pasteTargetId = id;
            // 清理上次可能残留的 input
            var old = document.getElementById('_thumbFileInput');
            if (old) document.body.removeChild(old);
            var input = document.createElement('input');
            input.id = '_thumbFileInput';
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true; // 支持多选
            input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
            input.onchange = function(e) {
                var files = Array.from(e.target.files);
                files.forEach(function(file) {
                    self.savePatternThumb(id, file);
                });
                if (input.parentNode) document.body.removeChild(input);
            };
            document.body.appendChild(input);

        savePatternThumb: function(id, blob) {
            var self = this;
            // 先用 FileReader 读取为 dataURL，再通过 canvas 压缩
            var fr = new FileReader();
            fr.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    // 压缩到最大 800px，JPEG 0.85 质量
                    var maxW = 800, maxH = 800;
                    var w = img.width, h = img.height;
                    if (w > maxW || h > maxH) {
                        var scale = Math.min(maxW / w, maxH / h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    var compressed = canvas.toDataURL('image/jpeg', 0.85);
                    self._doSaveThumb(id, compressed);
                };
                img.onerror = function() {
                    // 压缩失败，直接用原图
                    self._doSaveThumb(id, ev.target.result);
                };
                img.src = ev.target.result;
            };
            fr.onerror = function() {
                showToast('图片读取失败');
            };
            fr.readAsDataURL(blob);
        },

        _doSaveThumb: function(id, dataURL) {
            var self = this;
            // 编辑模式：添加到编辑图片列表，不直接写存储
            if (document.getElementById('editUploadGrid')) {
                if (!self._editImages) self._editImages = [];
                self._editImages.push({ dataURL: dataURL, isCover: self._editImages.length === 0 });
                self.renderEditImages();
                showToast('图片已添加，记得保存');
                return;
            }
            // 详情模式：直接添加到图片数组并保存
            var patterns = getPatterns();
            var p = patterns.find(function(x){ return x.id === id; });
            if (!p) { showToast('未找到素材'); return; }
            if (!p.images) p.images = [];
            // 迁移旧 thumbnail
            if (p.thumbnail && p.images.length === 0) {
                p.images.push(p.thumbnail);
                p.thumbnail = null;
            }
            p.images.push(dataURL);
            if (p.images.length === 1) p.coverIndex = 0;
            p.updatedAt = new Date().toISOString();
            try {
                saveData(STORAGE_KEYS.patterns, patterns);
                showToast('图片已添加');
                self.openPatternDetail(id);
            } catch(e) {
                showToast('保存失败，可能图片过大');
            }
        },

        // 快速标记已付款
        markLicensePaid: function(id, fromPatternId) {
            var licenses = getLicenses();
            var l = licenses.find(function(x){ return x.id === id; });
            if (!l) return;
            // 如果有定金/尾款字段但未填，自动补全为总额
            if (!l.amount) l.amount = 0;
            if (!l.deposit) l.deposit = 0;
            if (!l.balance) l.balance = 0;
            // 自动将尾款补齐
            var received = l.deposit + l.balance;
            if (received < l.amount) {
                l.balance = l.amount - l.deposit;
            }
            l.paymentStatus = 'paid';
            saveData(STORAGE_KEYS.licenses, licenses);
            showToast('已标记为已付清');
            if (fromPatternId) {
                this.openPatternDetail(fromPatternId);
            } else {
                this.render();
            }
        },

        // 原生 color picker 选色回调
        _onColorPick: function(index, hex) {
            if (index === 'bg') {
                document.getElementById('pl_bg_text').value = hex;
                document.getElementById('pl_bg_swatch').style.background = hex;
                this._updateCmykWarn('bg', hex);
            } else if (index === 'line') {
                document.getElementById('pl_line_text').value = hex;
                document.getElementById('pl_line_swatch').style.background = hex;
                this._updateCmykWarn('line', hex);
            } else {
                document.getElementById('pl_color_text_'+index).value = hex;
                var swatch = document.getElementById('pl_color_swatch_'+index);
                if (swatch) swatch.style.background = hex;
                this._updateColorName(index, hex);
                this._updateCmykWarn(index, hex);
            }
        },

        // hex 文本框手动输入回调
        _onHexInput: function(index, val) {
            val = val.trim();
            if (!/^#[0-9a-fA-F]{6}$/.test(val)) return;
            if (index === 'bg') {
                document.getElementById('pl_bg_color').value = val;
                document.getElementById('pl_bg_swatch').style.background = val;
                this._updateCmykWarn('bg', val);
            } else if (index === 'line') {
                document.getElementById('pl_line_color').value = val;
                document.getElementById('pl_line_swatch').style.background = val;
                this._updateCmykWarn('line', val);
            } else {
                var swatch = document.getElementById('pl_color_swatch_'+index);
                if (swatch) swatch.style.background = val;
                var colorInput = document.getElementById('pl_color_color_'+index);
                if (colorInput) colorInput.value = val;
                this._updateColorName(index, val);
                this._updateCmykWarn(index, val);
            }
        },

        _updateColorName: function(i, hex) {
            var nameEl = document.getElementById('pl_color_name_'+i);
            if (nameEl) nameEl.textContent = hexToColorName(hex);
        },

        // 更新 CMYK 色域警告
        _updateCmykWarn: function(index, hex) {
            var warnId = (index === 'bg' || index === 'line')
                ? 'pl_'+index+'_cmyk'
                : 'pl_color_cmyk_'+index;
            var warnEl = document.getElementById(warnId);
            if (!warnEl) return;
            if (isOutOfCmykGamut(hex)) {
                var safeHex = getCmykSafeHex(hex);
                var tooltip = warnEl.querySelector('.warn-tooltip');
                if (tooltip) tooltip.textContent = '此色印刷可能偏色，建议使用 '+safeHex;
                warnEl.style.display = 'inline-flex';
            } else {
                warnEl.style.display = 'none';
            }
        },

        savePalette: function(id, asNew) {
            var name = document.getElementById('pl_name').value.trim();
            if (!name) { showToast('请输入色板名称'); return; }
            var colors = [];
            var i = 0;
            while (document.getElementById('pl_color_text_'+i)) {
                var v = document.getElementById('pl_color_text_'+i).value.trim();
                if (v) colors.push(v);
                i++;
            }
            if (colors.length < 3) { showToast('至少需要3个色值'); return; }
            // asNew=true 或 id 为基础色板时，始终新增
            var effectiveId = (asNew || (id && isDefaultPalette(id))) ? null : id;
            var palettes = getPalettes();
            var existingIdx = effectiveId ? palettes.findIndex(function(p){ return p.id === effectiveId; }) : -1;
            var palette = {
                id: effectiveId || genId('p'),
                name: name,
                bgColor: document.getElementById('pl_bg_text').value.trim(),
                colors: colors,
                lineColor: document.getElementById('pl_line_text').value.trim(),
                desc: paletteAutoDesc(colors),
                isFavorite: existingIdx >= 0 ? (palettes[existingIdx].isFavorite || false) : false
            };
            if (effectiveId) {
                if (existingIdx >= 0) palettes[existingIdx] = palette;
            } else {
                palettes.unshift(palette);
            }
            saveData(STORAGE_KEYS.palettes, palettes);
            showToast(effectiveId ? '色板已更新' : '新色板已添加');
            this.closeModal();
            this.render();
        },

        deletePalette: function(id) {
            if (isDefaultPalette(id)) { showToast('基础色板不可删除'); return; }
            if (!confirm('确定删除此色板？')) return;
            var palettes = getPalettes().filter(function(p){ return p.id !== id; });
            saveData(STORAGE_KEYS.palettes, palettes);
            showToast('色板已删除');
            this.render();
        },

        // ===== 数据管理 =====
        compressAllImages: function() {
            var self = this;
            var patterns = getPatterns();
            var total = 0, changed = 0;
            var maxEdge = 1200; // 与上传压缩保持一致，视觉无损
            var tasks = [];

            function compressOne(src) {
                return new Promise(function(resolve) {
                    var img = new Image();
                    img.onload = function() {
                        var w = img.width, h = img.height;
                        if (w <= maxEdge && h <= maxEdge && src.indexOf('data:image/jpeg') === 0) {
                            resolve(src); return; // 已经达标
                        }
                        var scale = Math.min(maxEdge / w, maxEdge / h);
                        if (scale >= 1) scale = 1;
                        var cw = Math.round(w * scale), ch = Math.round(h * scale);
                        var canvas = document.createElement('canvas');
                        canvas.width = cw; canvas.height = ch;
                        var ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, cw, ch);
                        ctx.drawImage(img, 0, 0, cw, ch);
                        var out = canvas.toDataURL('image/jpeg', 0.85);
                        resolve(out.length < src.length ? out : src);
                    };
                    img.onerror = function() { resolve(src); };
                    img.src = src;
                });
            }

            patterns.forEach(function(p) {
                var imgs = getPatternImages(p);
                if (!imgs.length) return;
                imgs.forEach(function(src, i) {
                    total++;
                    (function(p_, i_) {
                        tasks.push(compressOne(src).then(function(newSrc) {
                            if (newSrc !== src) { changed++; p_.images[i_] = newSrc; }
                        }));
                    })(p, i);
                });
            });

            if (total === 0) { showToast('没有可压缩的图片'); return; }
            showToast('正在压缩 ' + total + ' 张图片…');
            Promise.all(tasks).then(function() {
                try {
                    saveData(STORAGE_KEYS.patterns, patterns);
                    showToast('图片优化完成：' + changed + '/' + total + ' 张已压缩');
                } catch(e) {
                    showToast('保存失败，图片可能过大');
                }
                app.render();
            });
        },

        exportData: function() {
            var data = {
                patterns: getPatterns(),
                licenses: getLicenses(),
                elements: getElements(),
                palettes: getPalettes(),
                exportDate: new Date().toISOString(),
                version: DATA_VERSION
            };
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'seamless-pattern-data-' + formatDate(new Date()) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        },

        handleImport: function(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!confirm('导入将覆盖现有数据，确定继续？')) return;
                    if (data.patterns) saveData(STORAGE_KEYS.patterns, data.patterns);
                    if (data.licenses) saveData(STORAGE_KEYS.licenses, data.licenses);
                    if (data.elements) saveObject(STORAGE_KEYS.elements, data.elements);
                    if (data.palettes) saveData(STORAGE_KEYS.palettes, data.palettes);
                    showToast('数据已导入');
                    app.render();
                } catch(err) {
                    showToast('导入失败：文件格式错误');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        },

    };

    window.toggleSidebar = function() { app.toggleSidebar(); };
    app.init();

    // 全局粘贴图片监听 — 与 prompt-library.html 相同的交互模式
    // 在素材详情页/编辑页时，直接 Ctrl+V 粘贴图片到当前素材
    document.addEventListener('paste', function(e) {
        if (!app._pasteTargetId) return;
        var items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image/') === 0) {
                var file = items[i].getAsFile();
                if (!file) continue;
                e.preventDefault();
                showToast('正在处理图片...');
                app.savePatternThumb(app._pasteTargetId, file);
                return;
            }
        }
    });

    // Lightbox 关闭：点击关闭按钮
    document.getElementById('lightboxClose').addEventListener('click', function() {
        document.getElementById('lightbox').classList.remove('active');
    });
    // Lightbox 关闭：点击背景（非图片区域）
    document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    // 键盘导航：方向键切换画廊，Esc 关闭 Lightbox — 与 prompt-library.html 一致
    document.addEventListener('keydown', function(e) {
        // Esc 关闭 Lightbox
        if (e.key === 'Escape') {
            var lb = document.getElementById('lightbox');
            if (lb.classList.contains('active')) {
                lb.classList.remove('active');
                return;
            }
        }
        // 方向键仅在详情页且不在输入框中时生效
        if (!app._galleryId) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        var p = getPatterns().find(function(x){ return x.id === app._galleryId; });
        if (!p) return;
        var imgs = getPatternImages(p);
        if (imgs.length <= 1) return;
        if (e.key === 'ArrowLeft' && app._galleryIndex > 0) {
            app._galleryIndex--;
            app._renderGallery();
        } else if (e.key === 'ArrowRight' && app._galleryIndex < imgs.length - 1) {
            app._galleryIndex++;
            app._renderGallery();
        }
    });
    </script>
</body>
</html>
