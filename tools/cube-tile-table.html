<html lang="zh-CN">

<title>魔方贴片字表编辑器 - WLi Tools</title>
<style>
/* ============================================================
   魔方贴片 · 字表编辑器（wlili tools）
   外壳/按钮/下拉一律复用 common.css + _shared/ui-select.css
   本文件只写本工具专属样式，颜色间距用全站令牌
   ============================================================ */

/* ---------- 操作区 = 网格里的「第七格」+ 挂在面板外面的面头（2026-10-27） ----------
   外层 .tb-wrap 是 .cube 网格的第 3 列第 1 行 —— 面1 右边、面4 上面，
   参与行高计算，永远不会叠到别人身上（原来是 position:fixed 靠像素偏移硬贴，会压面4）。
   内层 .tb-face 与 .grid9 完全同款：深灰面板 + 圆角 + 同阴影 + 三列白贴片。
   ⛔ 面头（重置 / 尺寸）必须在 .tb-face **外面**：它对标的是「面1 · 9/9」那一行，
      在深灰框之上的浅色区域。塞回面板里就变成"黑框里的白胶囊"，用户已否两次。 */
.tb-wrap{
  grid-column:3; grid-row:1; align-self:start;
  display:flex; flex-direction:column; min-width:0;
  /* 首帧防闪：三枚白贴片的内容、以及尺寸下拉，都是脚本画/升级的。
     先藏起来，render() 跑完（节点已在正确格子）再挂 .is-ready 显形 ——
     否则刷新瞬间会看到「深灰框 + 三个空白格子」一闪而过（2026-10-27 用户反馈）。 */
  visibility:hidden;
}
.tb-wrap.is-ready{visibility:visible;}
/* 面头：与 .face-head 逐项同规格 —— 同样的 gap(8) / 左右 2px / 下 5px；
   高度锁 23px（内容行 18 + 下内边距 5），下面面板顶边才会 = .grid9 顶边 */
.tb-head{
  display:flex; align-items:center; gap:var(--space-2);
  height:23px; box-sizing:border-box; padding:0 2px 5px;
}
/* 重置 = 15px 的「色块」（同 .swatch 尺寸 / 白边 / 描边）里放旋转图标 + 面名同款文字 */
.tb-reset{
  display:flex; align-items:center; gap:8px;
  border:none; background:none; padding:0; cursor:pointer;
  font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
  line-height:1;
}
.tb-sq{
  width:15px; height:15px; flex:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:4px; background:#2B3041; color:#fff;
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25);
  transition:transform .15s;
}
.tb-sq svg{width:9px; height:9px;}
.tb-reset:hover .tb-sq{transform:scale(1.14);}
.tb-reset:active .tb-sq{transform:scale(1.04);}
/* 尺寸 = 占「9/9」那个位置：裸文字、无底无框，hover 才浮一点灰底 */
.tb-size{
  /* flex:0 0 auto —— 不许被压缩：压缩后 .sel 会溢出胶囊，出现"文字跑出输入框"的错觉 */
  margin-left:auto; flex:0 0 auto; display:flex; align-items:center; min-width:0;
  font-size:10.5px; color:var(--ink-tertiary);
}
.tb-size .sel{display:block;}
.tb-size .sel-trigger,
.tb-size .sel-trigger.compact{
  min-height:0; height:18px; min-width:0; padding:0 14px 0 4px;
  border:none; border-radius:5px; background:transparent; box-shadow:none;
  color:var(--ink-tertiary); font-size:10.5px; line-height:18px;
  justify-content:flex-end;
}
.tb-size .sel-trigger::before{content:"尺寸"; opacity:.75; font-weight:400; margin-right:5px;}
.tb-size .sel-label{font-weight:600; color:var(--ink-secondary);}
.tb-size .sel-trigger:hover,
.tb-size .sel-trigger:focus,
.tb-size .sel-trigger:focus-visible,
.tb-size .sel.is-open .sel-trigger{
  background:rgba(43,48,65,.06); color:var(--ink); border:none; box-shadow:none;
}
.tb-size .sel-chevron{right:1px; width:11px; height:11px; color:currentColor; opacity:.55;}

.tb-face{
  width:auto; padding:5px; border-radius:14px;
  background:#2B3041;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
  display:grid; grid-template-columns:repeat(3, 1fr); gap:5px;
}
.tb-face .btn-outline, .tb-face .btn-filled{
  position:relative; overflow:hidden;
  aspect-ratio:1; padding:0; border:none; border-radius:9px;
  background:#fffdf8; color:var(--ink); font-weight:600; font-size:12px;
  font-family:inherit; line-height:1.25; text-align:center;
  display:block; white-space:normal; transition:transform .12s, box-shadow .12s;
}
.tb-face .btn-outline:hover{
  transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* ---------- 展开魔方：上 1 / 中 4 / 下 1（尺寸按视口高自动收缩，保证一屏放下） ---------- */
:root{--fw:min(232px, calc((100vh - 196px)/3));}   /* 面宽；.cube 与迷你贴片按钮共用 */
.ctg-sec{padding:14px 0 10px;}
.ctg-sec .section-inner{max-width:none; padding:0 24px;}   /* 中排 4 面并排，需要比默认 980 更宽 */
.ctg-stage{display:flex; justify-content:center; padding:0;}
.cube{
  /* fw 定义在 :root（与迷你贴片按钮共用）；此处只管网格结构 */
  display:grid;
  grid-template-columns:repeat(4, var(--fw));
  grid-auto-rows:min-content; gap:16px;
}
.face{grid-column:span 1;}
.face.f1{grid-column:2; grid-row:1;}
.face.f2{grid-column:1; grid-row:2;}
.face.f3{grid-column:2; grid-row:2;}
.face.f4{grid-column:3; grid-row:2;}
.face.f5{grid-column:4; grid-row:2;}
.face.f6{grid-column:2; grid-row:3;}

.face-head{display:flex; align-items:center; gap:var(--space-2); padding:0 2px 5px;}
.swatch{
  width:15px; height:15px; border-radius:4px; cursor:pointer; flex:none;
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); transition:transform .15s;
}
.swatch:hover{transform:scale(1.14);}
.face-name{
  border:none; background:transparent; font-weight:600; font-size:12.5px;
  color:var(--ink); width:76px; border-bottom:1px dashed transparent;
  font-family:inherit; padding:1px 2px;
}
.face-name:focus{border-bottom-color:var(--border); outline:none; background:var(--bg-white);}
.face-count{margin-left:auto; font-size:10.5px; color:var(--ink-tertiary);}
.grid9{
  display:grid; grid-template-columns:repeat(3,1fr); gap:5px;
  background:#2B3041; padding:5px; border-radius:12px;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
}
.cell{
  aspect-ratio:1; background:transparent; border-radius:9px; cursor:pointer;
  position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden; user-select:none;
  border:1.5px dashed transparent; transition:transform .12s, box-shadow .12s;
}
.cell:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.22);}
.cell.empty{border-color:#4a5064;}
.cell.empty .plus{color:#8d93a6; font-size:18px; font-weight:300;}
/* 格子左上角的 1-9 序号已于 2026-10-26 按用户要求移除（不再渲染 .pos） */
.tsvg{position:absolute; inset:0; width:100%; height:100%;}
/* 类型标签：默认隐藏，鼠标移上才在右上角显示 */
.cell .kd{
  position:absolute; top:3px; right:4px; font-size:9px; padding:0 4px; z-index:2;
  border-radius:5px; background:rgba(255,255,255,.94); color:#6b6459;
  border:1px solid rgba(0,0,0,.08); letter-spacing:.3px; pointer-events:none;
  opacity:0; transition:opacity .12s;
}
.cell:hover .kd{opacity:1;}

/* ---------- 弹窗（全站风格兜底：本土三個弹窗自己一套类名，避免后台 missing-class 陷阱） ---------- */
.ctg-mask{
  position:fixed; inset:0; background:rgba(20,22,30,.44); z-index:1200;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.ctg-mask.show{display:flex;}
.ctg-dlg{
  background:var(--bg-white); border-radius:var(--radius-lg); width:640px; max-width:94vw;
  padding:var(--space-6); box-shadow:0 24px 60px rgba(0,0,0,.3); max-height:92vh;
  display:flex; flex-direction:column;
}
.ctg-dlg.wide{width:min(1040px, 94vw);}
/* 全站 .btn-* 是 17px 的大按钮，弹窗里按小一号收敛（只压弹窗，不动顶栏） */
.ctg-dlg .btn-outline, .ctg-dlg .btn-filled{
  padding:6px 14px; font-size:14px; line-height:1.3; border-width:1px; gap:6px;
}
.ctg-dlg h3{
  font-size:var(--fs-lg); font-weight:600; margin-bottom:var(--space-4);
  display:flex; align-items:center; gap:var(--space-2); flex:none;
}
.ctg-dlg h3 .face-tag{font-size:var(--fs-sm); color:var(--ink-tertiary); font-weight:400;}
/* 预览弹窗右上角：关闭（2026-10-27 与「刷新」互换位置 —— 关闭跑到弹窗底部不顺手）。
   刷新挪到底部 footer，做成带图标的描边按钮。 */
.pv-x{
  margin-left:auto; flex:none; width:28px; height:28px; padding:0; border-radius:50%;
  border:none; background:transparent; color:var(--ink-tertiary);
  cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  transition:background .12s, color .12s, transform .12s;
}
.pv-x:hover{background:rgba(43,48,65,.07); color:var(--ink);}
.pv-x:active{transform:scale(.94);}
.pv-x svg{width:15px; height:15px;}
#pv_reload svg{width:14px; height:14px; flex:none;}
.pv-seg{
  display:flex; align-items:center; gap:1px; padding:2px;
  border:1px solid var(--border); border-radius:999px; background:var(--bg);
}
.pv-seg label{
  display:inline-flex; align-items:center; gap:4px; cursor:pointer;
  padding:2px 9px; border-radius:999px; font-size:12px;
  color:var(--ink-tertiary); white-space:nowrap;
}
.pv-seg input{display:none;}
.pv-seg label svg{width:10px; height:10px; opacity:0;}
.pv-seg label.on{background:var(--fill-black); color:#fff;}
.pv-seg label.on svg{opacity:1;}
.pv-seg .swatch{width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.18);}
/* 灯光实时调节行（调好后把数值回填到 LIGHT_DEF） */
.pv-light{gap:var(--space-3); flex-wrap:wrap; font-size:12px;}
.pv-light label{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.pv-light input[type=range]{
  width:74px; height:14px; margin:0; accent-color:var(--ink); cursor:pointer;
}
.pv-light b{
  display:inline-block; min-width:30px; font-weight:600; font-size:11px;
  color:var(--ink); font-variant-numeric:tabular-nums;
}
.ctg-body{display:flex; gap:var(--space-6); overflow:auto;}
.ctg-fields{flex:1; display:flex; flex-direction:column; gap:var(--space-3);}
.ctg-fld label{display:block; font-size:var(--fs-sm); color:var(--ink-tertiary); margin-bottom:6px;}
.ctg-fld input[type=text]{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:var(--fs-md); font-family:inherit; background:var(--bg-white); color:var(--ink);
}
.ctg-fld input:focus{outline:none; border-color:var(--link);}
.ctg-hint{
  font-size:var(--fs-sm); color:var(--ink-tertiary); background:var(--bg);
  border-radius:var(--radius-sm); padding:10px 12px; line-height:1.6;
}
.ctg-hint b{color:var(--ink);}
.ctg-prev{width:150px; flex:none; display:flex; flex-direction:column; align-items:center; gap:var(--space-2);}
.ctg-prev .mini{
  position:relative; overflow:hidden; width:150px; height:150px;
  border:1px solid var(--border-light); border-radius:var(--radius-md); background:var(--bg-white);
}
.ctg-prev .mini .tsvg{inset:0;}
.ctg-cap{font-size:var(--fs-xs); color:var(--ink-tertiary);}
.ctg-foot{
  display:flex; gap:var(--space-2); margin-top:var(--space-5);
  justify-content:flex-end; align-items:center; flex:none; flex-wrap:wrap;
}
.ctg-foot .left{margin-right:auto; display:flex; gap:var(--space-2);}

/* ---------- 导出弹窗 ---------- */
.ctg-dlg.exp{width:min(1040px, 94vw);}
.ctg-tabs{display:flex; gap:6px; margin-bottom:var(--space-3); flex-wrap:wrap; flex:none;}
.ctg-tab{
  padding:6px 14px; border-radius:var(--radius-sm); cursor:pointer; font-size:var(--fs-sm);
  border:1px solid var(--border); background:var(--bg-white); color:var(--ink-secondary);
}
.ctg-tab.on{background:var(--fill-black); color:#fff; border-color:var(--fill-black);}
/* 导出内容区：弹窗多宽就多宽，纵向吃掉剩余高度（min-width:0 防 flex 子项被撑/塌） */
.ctg-ta-wrap{flex:1 1 auto; min-height:0; display:flex;}
.ctg-ta{
  flex:1 1 auto; min-width:0; min-height:min(58vh, 520px);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:var(--fs-xs);
  line-height:1.55; background:var(--bg); color:var(--ink); resize:none;
  white-space:pre; overflow:auto;
}

/* ---------- 3D 预览 ---------- */
.pv-body{flex-direction:column; gap:var(--space-3);}
.pv-host{
  position:relative; width:100%; height:min(60vh, 460px); min-height:300px;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:radial-gradient(circle at 50% 40%, #ffffff 0%, #f0f0f4 70%, #e6e6ec 100%);
  overflow:hidden; touch-action:none;
}
.pv-host canvas{display:block;}
.pv-bar{display:flex; align-items:center; gap:var(--space-4); font-size:var(--fs-sm); color:var(--ink-tertiary); flex-wrap:wrap;}
.pv-bar label{display:flex; align-items:center; gap:6px; cursor:pointer;}
.pv-bar2{flex-wrap:wrap; gap:var(--space-2);}
.pv-ctl{display:flex; align-items:center; gap:6px;}
.pv-mini{font-size:12px;}
.pv-faces{display:flex; gap:6px; flex-wrap:wrap;}
.pv-face{
  display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--radius-pill);
  border:1px solid var(--border); background:var(--bg-white); cursor:pointer; font-size:var(--fs-xs);
  color:var(--ink-secondary); transition:all .15s;
}
.pv-face .dot{width:10px; height:10px; border-radius:50%;}
.pv-face.on{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink);}
/* 反色态：色块加白环；黑底态：色块加黑环（配色模式区分） */
.pv-face.inv .dot{box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--ink);}
.pv-face.blk .dot{box-shadow:0 0 0 2px #fff, 0 0 0 3px #14151a;}
.pv-face.blk .sw{background:#14151a; color:#fff; border-radius:5px; padding:0 5px;}
.pv-face .sw{
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:10px; color:var(--ink-tertiary); letter-spacing:0;
}
.pv-face.inv .sw{color:var(--ink); font-weight:600;}
.pv-loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-sm); color:var(--ink-tertiary);
}

/* ---------- toast ---------- */
#ctg_toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--fill-black); color:#fff; padding:9px 20px; border-radius:var(--radius-pill);
  font-size:var(--fs-sm); opacity:0; pointer-events:none; transition:all .25s; z-index:1400;
}
#ctg_toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ================= 响应式（全站断点 1280/1024/768/480） ================= */
@media (max-width:1080px){
  :root{--fw:200px;}
}
@media (max-width:768px){
  /* 移动端：竖排单列。注意 .face.fN 显式行列必须重置，否则会跑到不存在的列 */
  .ctg-stage{padding:0 0 var(--space-4);}
  /* 宽度对齐顶部操作面：面板 = calc(100% − 28px)（左右各 14px），
     这里把区块内边距也收成 14px，并让 .cube 撑满 —— 否则 .cube 会按内容宽度收缩，
     面块比上面的面板窄一截（2026-10-27 用户截图）。 */
  .ctg-sec .section-inner{padding:0 14px;}
  .cube{
    --fw:min(320px, 88vw);
    width:100%; max-width:340px; margin:0 auto;
    grid-template-columns:1fr; gap:var(--space-5); justify-items:stretch;
  }
  :root{--fw:min(320px, 88vw);}
  .cube .face{grid-column:auto; grid-row:auto; width:100%; max-width:340px;}
  /* 移动端放弃一屏（竖排必然超一屏），操作区回到页面顶部（网格里的第一项） */
  .tb-wrap{
    grid-column:auto; grid-row:auto; order:-1;
    width:100%; max-width:340px; margin:0;
  }
  .ctg-mask{padding:12px; align-items:flex-end;}
  .ctg-dlg{max-height:94vh; padding:var(--space-4);}
  .ctg-body{flex-direction:column; gap:var(--space-4);}
  .ctg-prev{width:100%; flex-direction:row; gap:var(--space-3); align-items:center;}
  .ctg-prev .mini{width:120px; height:120px; flex:none;}
  .ctg-ta{min-height:min(46vh, 340px);}
  .pv-host{height:min(52vh, 360px);}
  .ctg-fld input[type=text]{font-size:16px;} /* iOS 聚焦不放大 */
}
@media (max-width:480px){
  :root{--fw:min(300px, 92vw);}
  .ctg-dlg h3{font-size:var(--fs-md);}
}
</style>
</head>
<body>

<section class="section ctg-sec">
  <div class="section-inner">
    <div class="ctg-stage"><div class="cube" id="cube">
      <!-- 操作区：「面头一行 + 第七格深灰面板」，整体是网格第 3 列第 1 行。
           ⛔ 必须直接写在 #cube 里，不能摆到 body 顶部：
             放 body 里它会先当普通块级元素出现在页首，等 JS 跑完 render() 才搬进网格，
             于是每次刷新都闪一下「深灰框 + 三个白格子」再跳位（2026-10-27 用户反馈）。
             配合 .tb-wrap{visibility:hidden} + render() 里加 .is-ready，首帧不再露白格。 -->
      <div class="tb-wrap">
        <div class="tb-head">
          <button class="tb-reset" id="btn_reset" type="button" title="把全部 54 格重置为默认字表">
            <span class="tb-sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
            <span>重置</span>
          </button>
          <label class="tb-size" title="尺寸预设：决定预览与导出里的贴片 / 底座尺寸（与 Blender 插件 v1.28 预设一致）">
            <select id="size_sel" class="form-select" data-sel-inline data-sel-compact aria-label="贴片尺寸预设">
              <option value="P17">17 × 17</option>
              <option value="P15">15 × 15</option>
              <option value="M15">15（底座 17）</option>
            </select>
          </label>
        </div>
        <div class="tb-face">
          <button class="btn-outline" id="btn_preview" data-l1="生成" data-l2="预览" aria-label="生成预览"></button>
          <button class="btn-outline" id="btn_export" data-l1="导出" data-l2="字表" aria-label="导出字表"></button>
          <button class="btn-outline" id="btn_import" data-l1="导入" data-l2="字表" aria-label="导入字表"></button>
          <input type="file" id="import_file" accept=".md,.markdown,.json,text/markdown,application/json" hidden>
        </div>
      </div>
    </div></div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",

<!-- 3D 预览：惰性加载 three@0.170.0（与 tools/_shared/model-3d.js 同一版本，勿另加本地副本） -->
<script type="module">
let THREE = null, RBG = null, OrbitControls = null, RoomEnv = null, loading = false;
async function ensure3D(){
  if(THREE) return true;
  if(loading){ // 并发保护
    while(!THREE && loading){ await new Promise(r=>setTimeout(r,60)); }
    return !!THREE;
  }
  loading = true;
  try{
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ RoundedBoxGeometry: RBG } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
    ({ RoomEnvironment: RoomEnv } = await import('three/addons/environments/RoomEnvironment.js'));
    return true;
  }catch(e){
    console.warn('three 加载失败', e);
    return false;
  }finally{ loading = false; }
}
/* 实物尺寸（mm→cm 单位）：黑魔方芯格距 19（贴片 17 + 缝 2）；
   贴片插销底座凸出 2.5（插销不做，保留底座厚度）；贴片本体 17×17×2.66。
   三层结构：黑芯 → 白底座 → 贴片，还原实拍拼装观感。 */
const PITCH = 1.9, HALF = PITCH * 1.5;       // 黑芯半宽 28.5mm
const BASE_T = 0.17, TILE_T = 0.266;         // 底座露出厚 / 贴片厚（不随尺寸预设变）
const BG_GRAY = 0xe6e8ec;                    // 预览背景灰
const CR = 0.11;                             // 底座平面圆角 1.1mm（贴片圆角按预设另算）
/* 灯光默认值（界面上实时调好后把数值回填到这里） */
const LIGHT_DEF = {key:2.95, fill:1.80, rim:0.95, hemi:1.05, amb:0.763, exp:0.50};   // 用户 2026-10-26 实调定稿
function roundedRect(w, r){                  // 中心在原点的圆角矩形（xy 平面）
  const s = new THREE.Shape(), x = -w/2, y = -w/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + w - r); s.quadraticCurveTo(x + w, y + w, x + w - r, y + w);
  s.lineTo(x + r, y + w);  s.quadraticCurveTo(x, y + w, x, y + w - r);
  s.lineTo(x, y + r);      s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
/* 板件：圆角矩形轮廓 + 大圆弧边（实物的侧棱是接近半个厚度的圆角过渡，不是直棱）；
   几何体沿 +z 从 0 拉伸到 d，便于按面法线摆放。bt = 单侧圆角半径（cm）。 */
function plateGeo(w, d, r, bt){
  const g = new THREE.ExtrudeGeometry(roundedRect(w, r), {
    depth: d - bt*2, bevelEnabled:true, bevelThickness:bt, bevelSize:bt*0.92,
    bevelSegments:5, curveSegments:10
  });
  g.translate(0, 0, bt - d/2);   // 居中：z ∈ [-d/2, +d/2]
  g.computeVertexNormals();
  return g;
}
// 六面朝向：0 上 / 1 左 / 2 前 / 3 右 / 4 后 / 5 下（与页面十字展开顺序一致）
// 每组 (n,u,v) 必须正交右手：u × v = n（makeBasis 用它定 plane 的姿态，错一个就整面转 90°/镜像）
const DIRS = [
  {n:[ 0, 1, 0], u:[ 1,0, 0], v:[0,0,-1]},   // 上 +Y
  {n:[-1, 0, 0], u:[ 0,0, 1], v:[0, 1,0]},   // 左 -X
  {n:[ 0, 0, 1], u:[ 1,0, 0], v:[0, 1,0]},   // 前 +Z
  {n:[ 1, 0, 0], u:[ 0,0,-1], v:[0, 1,0]},   // 右 +X
  {n:[ 0, 0,-1], u:[-1,0, 0], v:[0, 1,0]},   // 后 -Z
  {n:[ 0,-1, 0], u:[ 1,0, 0], v:[0,0, 1]}    // 下 -Y
];
function svgToTexture(svgStr){
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, 256, 256);
      const t = new THREE.CanvasTexture(cv);
      t.anisotropy = 8;
      t.colorSpace = THREE.SRGBColorSpace;
      resolve(t);
    };
    img.onerror = function(){
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      resolve(new THREE.CanvasTexture(cv));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}
window.__cube3d = {
  /** faces: [{name, color:{hex}, tiles:[{sub,main,kind}]}]
   *  opts: {core:'black'|'white', mode:[6]int} —— 仅展示用，不进导出数据
   *  svgOf(sub,main,kind,hex)=>svg字符串 */
  async build(host, faces, svgOf, opts){
    const ok = await ensure3D();
    if(!ok){ host.innerHTML = '<div class="pv-loading">3D 环境加载失败：请检查网络（three@0.170.0 走 unpkg CDN）。</div>'; return null; }
    const o = opts || {};
    const mode = o.mode || [0,0,0,0,0,0];
    const coreCol = (o.core === 'white') ? 0xf0f0ec : 0x17181d;
    host.innerHTML = '';
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    // Neutral 色调映射：ACES 会把饱和色往灰压（字发灰的元凶），Neutral 保色彩
    renderer.toneMapping = THREE.NeutralToneMapping || THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    // 灯光参数（可在界面上实时调，调好后把数值回填到 LIGHT_DEF）
    const L = Object.assign({}, LIGHT_DEF, (o.light || {}));
    function applyLight(x){
      hemiL.intensity = x.hemi;
      ambL.intensity  = x.amb;
      key.intensity   = x.key;
      fill.intensity  = x.fill;
      rim.intensity   = x.rim;
      renderer.toneMappingExposure = x.exp;
    }
    let w = host.clientWidth || 640, h = host.clientHeight || 420;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    host.appendChild(renderer.domElement);

    const disposables = [];
    const track = function(o){ disposables.push(o); return o; };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG_GRAY);
    scene.fog = new THREE.Fog(BG_GRAY, 26, 58);          // 网格远处淡出，不抢模型
    const camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 1000);
    camera.position.set(10.2, 10.8, 12.8);               // 默认镜头拉远（约 1.35×）
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.autoRotate = true;                          // 默认开自动旋转
    controls.autoRotateSpeed = 0.5;                      // 慢一点
    controls.minDistance = 8; controls.maxDistance = 52;
    controls.target.set(0, -0.3, 0);

    // 地面网格（1cm 一格，与贴片尺寸同量级）
    const gridY = -(HALF + 1.35);
    const grid = track(new THREE.GridHelper(16, 16, 0xb9bcc4, 0xd2d5db));
    grid.position.y = gridY;
    scene.add(grid);
    // 地面：MeshBasic（不受光）保证和背景灰完全同色，只让网格线来交待地面
    // 地面灰色底板已于 2026-10-26 移除（只剩网格线交代透视）

    // 陶瓷质感：用室内环境贴图给高光/反射（比纯 directional 更像釉面）
    if(RoomEnv && THREE.PMREMGenerator){
      try{
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envT = track(pmrem.fromScene(new RoomEnv(), 0.04).texture);
        scene.environment = envT;
        if('environmentIntensity' in scene) scene.environmentIntensity = 0.55;
        pmrem.dispose();
      }catch(e){}
    }

    // 灯光挂在相机上：相机绕模型转 = 灯跟着视线走，转到哪一面都能照亮当前面。
    // （此前灯是世界固定位置，转到背面就只剩环境光，看着发暗。）
    const hemiL = new THREE.HemisphereLight(0xffffff, 0xbfc4cc, 0.55); scene.add(hemiL);
    const ambL  = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambL);
    const key  = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set( 1.1,  1.5,  1.6);
    const fill = new THREE.DirectionalLight(0xdCE6ff, 0.4);  fill.position.set(-1.4, -0.5,  1.2);
    const rim  = new THREE.DirectionalLight(0xffffff, 0.3);  rim.position.set( 0.2,  0.9, -1.6);
    camera.add(key, fill, rim); scene.add(camera);
    applyLight(L);

    // 第 1 层：魔方芯（圆角，缝隙处露出；黑/白由 opts.core 决定）
    const body = new THREE.Mesh(
      track(new RBG(HALF*2, HALF*2, HALF*2, 3, 0.14)),
      track(new THREE.MeshStandardMaterial({color:coreCol, roughness:0.55, metalness:0.15}))
    );
    scene.add(body);

    // 第 2 层：插销底座（默认 17×17，插销不做，保留厚度）；第 3 层：贴片（随尺寸预设）
    // 尺寸预设由经典脚本写入 window.__ctgSize（cm）：tile 贴片 / base 销板 / cr 贴片圆角。
    // 厚度 BASE_T、TILE_T 与孔位不随预设变（与插件规则一致）。
    const SZ = Object.assign({tile: 1.68, base: 1.70, cr: 0.11}, window.__ctgSize || {});
    const BASE_W = SZ.base, TILE_W = SZ.tile, CR_T = SZ.cr;
    const baseGeo = track(plateGeo(BASE_W, BASE_T, CR, 0.05));   // 底座边圆角 0.5mm
    const tileGeo = track(plateGeo(TILE_W, TILE_T, CR_T, 0.085 * (TILE_W / 1.68)));  // 贴片圆角/倒角随预设缩
    const planeGeo = track(new THREE.PlaneGeometry(TILE_W*0.88, TILE_W*0.88));
    // 陶瓷质感：釉面白 —— 低粗糙 + clearcoat 清漆层 + 环境反射
    const mkCeramic = function(c, rough){
      return track(new THREE.MeshPhysicalMaterial({
        color:new THREE.Color(c), roughness:rough, metalness:0,
        clearcoat:0.85, clearcoatRoughness:0.18, specularIntensity:1
      }));
    };
    const baseMatW = mkCeramic(0xf9f8f3, 0.42);
    const tileMatW = mkCeramic(0xfcfbf7, 0.32);
    const baseMats = [], tileMats = [];
    for(let f=0; f<6; f++){
      const hex = (((faces[f]||{}).color)||{}).hex || '#dcdcdc';
      // mode: 0=正常(白底+面色字) 1=反色(面色底+白字) 2=黑底(黑底座/贴片+面色字)
      if(mode[f] === 1){
        baseMats[f] = mkCeramic(hex, 0.40);
        tileMats[f] = mkCeramic(hex, 0.32);        // 与底座同色（用户要求不分深浅）
      }else if(mode[f] === 2){
        baseMats[f] = mkCeramic(0x14151a, 0.38);
        tileMats[f] = mkCeramic(0x171920, 0.30);
      }else{
        baseMats[f] = baseMatW; tileMats[f] = tileMatW;
      }
    }
    const used = [];
    for(let f=0; f<6; f++){
      const face = faces[f] || {tiles:[]};
      const d = DIRS[f];
      const n = new THREE.Vector3(...d.n), u = new THREE.Vector3(...d.u), v = new THREE.Vector3(...d.v);
      for(let i=0; i<9; i++){
        const t = face.tiles[i] || {};
        const col = i % 3, row = Math.floor(i / 3);
        const m = new THREE.Matrix4().makeBasis(u, v, n);
        // 底座：贴在黑芯面上，凸出 BASE_T
        const base = new THREE.Mesh(baseGeo, baseMats[f]);
        base.quaternion.setFromRotationMatrix(m);
        base.position.copy(n).multiplyScalar(HALF + BASE_T/2)
          .addScaledVector(u, (col-1) * PITCH)
          .addScaledVector(v, -(row-1) * PITCH);
        scene.add(base);
        // 贴片：坐在底座上的圆角厚块
        const fHex = ((face.color||{}).hex || '#333333');
        const tex = await svgToTexture(svgOf(t.sub, t.main, resolved(t), mode[f] === 1 ? '#ffffff' : fHex, 512));
        track(tex);
        const mesh = new THREE.Mesh(tileGeo, tileMats[f]);
        mesh.quaternion.setFromRotationMatrix(m);
        mesh.position.copy(n).multiplyScalar(HALF + BASE_T + TILE_T/2)
          .addScaledVector(u, (col-1) * PITCH)
          .addScaledVector(v, -(row-1) * PITCH);
        mesh.userData = {face:f, pos:i};
        scene.add(mesh);
        // 文字贴图：贴在贴片顶面。用不受光的 Basic + toneMapped:false，
        // 让字保持 SVG 原色，不被灯光/色调映射洗淡（此前「蒙层白纱」的元凶）。
        const decal = new THREE.Mesh(planeGeo, track(new THREE.MeshBasicMaterial({
          map:tex, transparent:true, toneMapped:false
        })));
        decal.quaternion.copy(mesh.quaternion);
        decal.position.copy(mesh.position).addScaledVector(n, TILE_T/2 + 0.003);
        decal.userData = {face:f, pos:i};
        scene.add(decal);
        used.push(mesh, decal);
      }
    }
    const focus = function(f){
      const d = DIRS[f];
      const n = new THREE.Vector3(...d.n);
      camera.position.copy(n).multiplyScalar(18).add(new THREE.Vector3(1.8, 1.6, 2.0));
      controls.target.set(0,0,0); controls.update();
    };
    let raf = 0, spin = false;
    const loop = function(){ raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); };
    loop();
    const ro = ('ResizeObserver' in window) ? new ResizeObserver(function(){
      w = host.clientWidth || w; h = host.clientHeight || h;
      renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
    }) : null;
    if(ro) ro.observe(host);

    return {
      meshes: used,
      setSpin: function(on){ spin = on; controls.autoRotate = !!on; },
      focus: focus,
      setLight: function(x){ Object.assign(L, x); applyLight(L); },   // 实时改，不重建
      getLight: function(){ return Object.assign({}, L); },
      dispose: function(){
        cancelAnimationFrame(raf);
        if(ro) ro.disconnect();
        controls.dispose();
        disposables.forEach(function(o){ if(o.dispose) o.dispose(); });
        used.forEach(function(m){ if(m.material && m.material.dispose) m.material.dispose(); });
        renderer.dispose();
        if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      }
    };
  }
};
function resolved(t){ return t.kind || window.__detectKind(t.sub, t.main) || 'TWO_LINE'; }
</script>

<script>
"use strict";
/* ================= 常量（与 ctg_tile_generator 插件保持一致） ================= */
// 插件 PAL_TEXT_DEFAULT 6 个默认文字色
var PALETTE = [

/* ---- 真实排版规格（mm）：字号=插件字号，gap=现行 54 片实测行间净距 ----
   实测依据（Blender 5.2 量 20261025魔方贴片全_加厚2.66.blend 凸字网格）：
     鼠/shǔ  汉字墨迹 9.208 / 拼音 3.869，净距 1.554

  P17:{label:"底座 17 + 贴片 17", tile:17, base:17, cr:1.1,  holeDx:5.5},
  P15:{label:"底座 15 + 贴片 15", tile:15, base:15, cr:0.97, holeDx:4.5},

  MAIN_SUB:{l1:{size:8.0, cjk:false, italic:true, w:600}, l2:{size:12.0, cjk:true}, gap:1.52, margin:1.2},
  TWO_LINE:{l1:{size:8.5, cjk:true},                      l2:{size:8.5, cjk:true}, gap:1.25, margin:1.2},
  MIXED:   {l1:{size:9.0, cjk:true},                      l2:{size:6.8, cjk:true}, gap:1.67, margin:1.2},
  SINGLE:  {l1:null,                                      l2:{size:8.0, cjk:true}, gap:0,   margin:2.0}
};
/* 插件里的「行距参数」（整套统一值，≠ 上面实测的墨迹净距），导出文本用 */
var PLUGIN_GAP = {MAIN_SUB:1.6, TWO_LINE:1.0, MIXED:1.2, SINGLE:0};
var SPEC = {};
function sizeOf(){ return SIZE_PRESETS[SIZE_KEY] || SIZE_PRESETS.P17; }

function applySize(key){
  var p = SIZE_PRESETS[key] ? SIZE_PRESETS[key] : SIZE_PRESETS.P17;

  TILE_MM = p.tile;
  FACE_MM = +(p.tile - 1.77).toFixed(2);

  SPEC = {};
  Object.keys(BASE_SPEC).forEach(function(k){
    var b = BASE_SPEC[k];
    SPEC[k] = {
      /* 字号按 0.1mm 取整（与插件「数字=模型」的精度一致） */

      l2: {size:+(b.l2.size*s).toFixed(1), cjk:b.l2.cjk},
      gap: +(b.gap*s).toFixed(2),

var FAM_CJK = '"DengXian","Microsoft YaHei"';
var FAM_LAT = '"Segoe UI",sans-serif';
function famOf(sp){ return sp.cjk ? FAM_CJK : FAM_LAT; }
var _mctx = null;
function inkOf(sp, text){
  if(!text) return {asc:0, desc:0, w:0};
  if(!_mctx){ _mctx = document.createElement("canvas").getContext("2d"); }
  var fs = 100;
  _mctx.font = (sp.italic ? "italic " : "") + (sp.w || 700) + " " + fs + "px " + famOf(sp);
  var m = _mctx.measureText(text);
  var ra = (m.actualBoundingBoxAscent  != null) ? m.actualBoundingBoxAscent  / fs : (sp.cjk ? 0.77 : 0.50);
  var rd = (m.actualBoundingBoxDescent != null) ? m.actualBoundingBoxDescent / fs : (sp.cjk ? 0.05 : 0.20);
  var rw = (m.actualBoundingBoxLeft != null)
    ? (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) / fs : ((m.width||0)/fs);

/* 生成贴片正视 SVG（viewBox 单位 = mm，17 = 板宽）
   版式与插件一致：文字块居中，可用区 = 17 − 2×边距（两行类 1.2 / 单行 2.0），
   装不下时整块等比缩小（对应插件 text_auto 的缩放逻辑）。 */
function tileSVG(sub, main, kind, color, px, opts){
  var sp = SPEC[kind] || SPEC.TWO_LINE;
  var i1 = sp.l1 ? inkOf(sp.l1, sub) : null;
  var i2 = inkOf(sp.l2, main);
  var h1 = i1 ? i1.asc + i1.desc : 0;
  var h2 = i2.asc + i2.desc;
  var Wink = Math.max(i1 ? i1.w : 0, i2.w);
  var H = (sub && i1) ? h1 + sp.gap + h2 : h2;
  var avail = TILE_MM - 2 * sp.margin;
  var k = Math.min(1, Wink > 0 ? avail / Wink : 1, H > 0 ? avail / H : 1);
  if(opts && opts.fix) k = opts.fix / (sp.l2.size || 8.5);   // 强制字号（mm），跳过自适应缩放
  var g = sp.gap * k;
  h1 *= k; h2 *= k; H = (sub && i1) ? h1 + g + h2 : h2;
  var top = (TILE_MM - H) / 2;
  var y1 = top + (i1 ? i1.asc * k : 0);
  var y2 = (sub && i1 ? top + h1 + g : top) + i2.asc * k;
  var inset = (TILE_MM - FACE_MM) / 2;
  var cx = TILE_MM / 2;
  var s = '<svg class="tsvg" viewBox="0 0 ' + TILE_MM + ' ' + TILE_MM + '" xmlns="http://www.w3.org/2000/svg"'
        + (px ? ' width="'+px+'" height="'+px+'"' : '') + '>';
  // opts.bare = 3D 贴图用：透明底，不画灰框和凸台（底色圆角由贴片模型自己提供）
  if(!(opts && opts.bare)){
    s += '<rect x="0" y="0" width="' + TILE_MM + '" height="' + TILE_MM + '" rx="' + CR_MM + '" fill="#ece8dd"/>';
    s += '<rect x="' + inset.toFixed(2) + '" y="' + inset.toFixed(2) + '" width="' + FACE_MM + '" height="' + FACE_MM + '" rx="' + (CR_MM*0.82).toFixed(2) + '" fill="#fffdf8"/>';
  }
  if(sub && sp.l1){
    s += '<text x="' + cx + '" y="' + y1.toFixed(3) + '" font-size="' + (sp.l1.size * k).toFixed(3) + '"'
      +  ' font-family=\'' + famOf(sp.l1) + '\' font-weight="' + (sp.l1.w || 700) + '"'
      +  (sp.l1.italic ? ' font-style="italic"' : '')
      +  ' text-anchor="middle" fill="' + color + '">' + escHtml(sub) + '</text>';
  }
  if(main){
    s += '<text x="' + cx + '" y="' + y2.toFixed(3) + '" font-size="' + (sp.l2.size * k).toFixed(3) + '"'
      +  ' font-family=\'' + famOf(sp.l2) + '\' font-weight="' + (sp.l2.w || 700) + '"'
      +  ' text-anchor="middle" fill="' + color + '">' + escHtml(main) + '</text>';
  }
  return s + '</svg>';
}

/* ================= kind 自动检测 ================= */
function hasLatin(s){ return /[A-Za-z0-9]/.test(s||""); }
function hasCJK(s){ return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(s||""); }
function detectKind(sub, main){
  if(!sub && !main) return null;
  if(!main && sub) return "SINGLE";
  if(!sub && main) return "SINGLE";
  if(hasLatin(main) && hasCJK(main)) return "MIXED";
  if(hasLatin(sub) && !hasLatin(main) && hasCJK(main) && Array.from(main).length===1) return "MAIN_SUB";
  if(hasLatin(sub) && hasLatin(main) && !hasCJK(main)) return "MAIN_SUB";
  return "TWO_LINE";
}
window.__detectKind = detectKind;      // module 脚本要用
function resolvedKind(t){ return t.kind || detectKind(t.sub, t.main); }
function isEmptyTile(t){ return !t.main && !t.sub; }
function countFilled(faces){
  var n = 0;
  faces.forEach(function(f){ f.tiles.forEach(function(t){ if(!isEmptyTile(t)) n++; }); });
  return n;
}

/* ================= 导入字表（.md / .json） =================
   导出格式的 .md 里带一段 ```json，直接抽出来用；.json 直接读。
   尺寸预设从 meta.standard 里认（新格式有「尺寸预设」，旧格式靠「贴片/底板」里的 17/15）。 */
function parseTableFile(text){
  var data = null;
  try{ data = JSON.parse(text); }catch(e){}
  if(!data || !data.faces){
    var m = text.match(/```json\s*([\s\S]*?)```/i);
    if(m){ try{ data = JSON.parse(m[1]); }catch(e){ data = null; } }
  }
  if(!data || !data.faces) throw new Error("没找到 JSON（支持工具导出的 .md 或 .json）");
  if(!Array.isArray(data.faces) || data.faces.length !== 6) throw new Error("faces 必须是 6 个面");
  var faces = data.faces.map(function(f, i){
    var src = (f.tiles || []).slice().sort(function(a, b){ return (a.pos || 0) - (b.pos || 0); }).slice(0, 9);
    var tiles = [];
    for(var k = 0; k < 9; k++){
      var t = src[k] || {};
      var sub = (t.text_sub != null) ? String(t.text_sub) : "";
      var main = (t.text_main != null) ? String(t.text_main) : "";
      tiles.push({sub: sub, main: main, kind: (t.kind || detectKind(sub, main) || "MAIN_SUB")});
    }
    var c = f.color || {}, pal = PALETTE[i] || PALETTE[0];
    return {name: f.name || ("面" + (i + 1)),
            color: {name: c.name || pal.name, hex: c.hex || pal.hex, rgb: c.rgb || pal.rgb},
            tiles: tiles};
  });
  var std = (data.meta && data.meta.standard) || {};
  var txt = [std["尺寸预设"], std["贴片"], std["底板"], std["底座销板"]].join(" ");
  var key = "P17";
  if(/贴片\s*15|15\s*×\s*15/.test(txt)) key = /底座\s*17/.test(txt) ? "M15" : "P15";
  return {faces: faces, size: key};
}
function doImport(text, fname){
  var r = parseTableFile(text);
  state = {faces: r.faces, size: r.size};
  var sel = document.getElementById("size_sel");
  if(sel){
    sel.value = r.size;
    sel.dispatchEvent(new Event("change"));   // 走组件自己的同步：回显 + applySize + render
  }else{
    applySize(r.size); render(); paintToolFace();
  }
  saveState();
  render(); paintToolFace();
  toast("已导入" + (fname ? " " + fname : "") + " · " + countFilled(state.faces) + " / 54 片 · " + sizeOf().label);
}

  e.target.value = "";
});

/* 操作面：三枚按钮用「真贴片渲染」画内容 —— 字号/比例与模型里的
   两行片（干支纪年那类）完全一致，而不是随便给个 px 字号。
   换尺寸预设时要重画（字号跟着 TILE_MM/17 走） */
function paintToolFace(){
  var fix = +(7.385 * sizeScale()).toFixed(3);
  [].forEach.call(document.querySelectorAll(".tb-face .btn-outline"), function(b){
    b.innerHTML = tileSVG(b.getAttribute("data-l1"), b.getAttribute("data-l2"), "TWO_LINE", "#22222a", 0, {fix:fix});
  });
}
state = loadState();
applySize(state.size || "P17");
document.getElementById("size_sel").value = SIZE_KEY;
document.getElementById("size_sel").addEventListener("change", function(){
  var p = applySize(this.value);
  state.size = SIZE_KEY; saveState();
  render();
  paintToolFace();
  toast("尺寸预设：" + p.label);
});
paintToolFace();
render();
</script>
</body>
</html>
