<!-- ⛔ 只支持浅色（2026-11-09）：安卓 Chrome / 各家 Chromium 内核浏览器的「夜间模式」
     默认会对页面做自动反色（Auto Dark）。实测反色只作用于 SVG <text> 的 fill，
     不作用于 <rect> 底板 —— 面5（文字_黑 #0F0F12）变成「白底白字」直接消失，
     彩色面因为反色后仍有对比才没被发现。声明 color-scheme:light 后浏览器整页跳过反色。
     字表编辑器必须显示真实耗材配色，不允许被反色扭曲。 -->
<meta name="color-scheme" content="light">
<title>魔方贴片字表编辑器 - WLi Tools</title>
<style>
/* ============================================================
   魔方贴片 · 字表编辑器（wlili tools）
   外壳/按钮/下拉一律复用 common.css + _shared/ui-select.css
   本文件只写本工具专属样式，颜色间距用全站令牌
   ============================================================ */

/* ⛔ 本页只支持浅色（与 head 里的 <meta name="color-scheme"> 同一件事）：
   不写这句，安卓 Chromium 的自动深色会把 SVG 文字反色、底板不反，黑字面直接白底白字。
   见 head 注释（2026-11-09 安卓实测）。 */
:root{ color-scheme: light; }

/* ---------- 操作区 = 网格里的「第七格」+ 挂在面板外面的面头（2026-10-27） ----------
   外层 .tb-wrap 是 .cube 网格的第 3 列第 1 行 —— 面1 右边、面4 上面，
   参与行高计算，永远不会叠到别人身上（原来是 position:fixed 靠像素偏移硬贴，会压面4）。
   内层 .tb-face 与 .grid9 完全同款：深灰面板 + 圆角 + 同阴影 + 三列白贴片。
   ⛔ 面头（重置 / 尺寸）必须在 .tb-face **外面**：它对标的是「面1 · 9/9」那一行，
      在深灰框之上的浅色区域。塞回面板里就变成"黑框里的白胶囊"，用户已否两次。 */
.tb-wrap{
  grid-column:3; grid-row:1; align-self:start;
  display:flex; flex-direction:column; min-width:0;
  /* 首帧防闪：三枚白贴片的内容、以及尺寸下拉，都是脚本画/升级的。
     先藏起来，render() 跑完（节点已在正确格子）再挂 .is-ready 显形 ——
     否则刷新瞬间会看到「深灰框 + 三个空白格子」一闪而过（2026-10-27 用户反馈）。 */
  visibility:hidden;
}
.tb-wrap.is-ready{visibility:visible;}
/* 面头：与 .face-head 逐项同规格 —— 同样的 gap(8) / 左右 2px / 下 5px；
   高度锁 23px（内容行 18 + 下内边距 5），下面面板顶边才会 = .grid9 顶边 */
.tb-head{
  display:flex; align-items:center; gap:var(--space-2);
  height:23px; box-sizing:border-box; padding:0 2px 5px;
}
/* 重置 = 15px 的「色块」（同 .swatch 尺寸 / 白边 / 描边）里放旋转图标 + 面名同款文字 */
.tb-reset{
  display:flex; align-items:center; gap:8px;
  border:none; background:none; padding:0; cursor:pointer;
  font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
  line-height:1;
}
.tb-sq{
  width:15px; height:15px; flex:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:4px; background:#2B3041; color:#fff;
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25);
  transition:transform .15s;
}
.tb-sq svg{width:9px; height:9px;}
.tb-reset:hover .tb-sq{transform:scale(1.14);}
.tb-reset:active .tb-sq{transform:scale(1.04);}
/* 尺寸 = 占「9/9」那个位置：裸文字、无底无框，hover 才浮一点灰底 */
.tb-size{
  /* flex:0 0 auto —— 不许被压缩：压缩后 .sel 会溢出胶囊，出现"文字跑出输入框"的错觉 */
  margin-left:auto; flex:0 0 auto; display:flex; align-items:center; min-width:0;
  font-size:10.5px; color:var(--ink-tertiary);
}
.tb-size .sel{display:block;}
.tb-size .sel-trigger,
.tb-size .sel-trigger.compact{
  min-height:0; height:18px; min-width:0; padding:0 14px 0 4px;
  border:none; border-radius:5px; background:transparent; box-shadow:none;
  color:var(--ink-tertiary); font-size:10.5px; line-height:18px;
  justify-content:flex-end;
}
.tb-size .sel-trigger::before{content:"尺寸"; opacity:.75; font-weight:400; margin-right:5px;}
/* 热端下拉复用 .tb-size 的排版，但不加前缀 —— 值本身「0.4 热端」已经说明，
   前缀写「热端」会变成「热端 0.4 热端」。 */
.tb-hotend .sel-trigger::before{content:""; margin-right:0;}
.tb-size .sel-label{font-weight:600; color:var(--ink-secondary);}
.tb-size .sel-trigger:hover,
.tb-size .sel-trigger:focus,
.tb-size .sel-trigger:focus-visible,
.tb-size .sel.is-open .sel-trigger{
  background:rgba(43,48,65,.06); color:var(--ink); border:none; box-shadow:none;
}
.tb-size .sel-chevron{right:1px; width:11px; height:11px; color:currentColor; opacity:.55;}

.tb-face{
  width:auto; padding:5px; border-radius:14px;
  background:#2B3041;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
  display:grid; grid-template-columns:repeat(3, 1fr); gap:5px;
}
.tb-face .btn-outline, .tb-face .btn-filled{
  position:relative; overflow:hidden;
  aspect-ratio:1; padding:0; border:none; border-radius:9px;
  background:#fffdf8; color:var(--ink); font-weight:600; font-size:12px;
  font-family:inherit; line-height:1.25; text-align:center;
  display:block; white-space:normal; transition:transform .12s, box-shadow .12s;
}
.tb-face .btn-outline:hover{
  transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* ---------- 展开魔方：上 1 / 中 4 / 下 1（尺寸按视口高自动收缩，保证一屏放下） ---------- */
:root{--fw:min(232px, calc((100vh - 196px)/3));}   /* 面宽；.cube 与迷你贴片按钮共用 */
.ctg-sec{padding:14px 0 10px;}
.ctg-sec .section-inner{max-width:none; padding:0 24px;}   /* 中排 4 面并排，需要比默认 980 更宽 */
.ctg-stage{display:flex; justify-content:center; padding:0;}
.cube{
  /* fw 定义在 :root（与迷你贴片按钮共用）；此处只管网格结构 */
  display:grid;
  grid-template-columns:repeat(4, var(--fw));
  grid-auto-rows:min-content; gap:16px;
}
.face{grid-column:span 1;}
.face.f1{grid-column:2; grid-row:1;}
.face.f2{grid-column:1; grid-row:2;}
.face.f3{grid-column:2; grid-row:2;}
.face.f4{grid-column:3; grid-row:2;}
.face.f5{grid-column:4; grid-row:2;}
.face.f6{grid-column:2; grid-row:3;}

.face-head{display:flex; align-items:center; gap:var(--space-2); padding:0 2px 5px;}
.swatch{
  width:15px; height:15px; border-radius:4px; cursor:pointer; flex:none;
  border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); transition:transform .15s;
}
.swatch:hover{transform:scale(1.14);}
.face-name{
  border:none; background:transparent; font-weight:600; font-size:12.5px;
  color:var(--ink); width:76px; border-bottom:1px dashed transparent;
  font-family:inherit; padding:1px 2px;
}
.face-name:focus{border-bottom-color:var(--border); outline:none; background:var(--bg-white);}
.face-count{margin-left:auto; font-size:10.5px; color:var(--ink-tertiary);}
/* 面头拖柄（2026-11-09）：按住 ⠿ 可整面拖动换位（插入顺延，逻辑见 render() 下方） */
.drag-h{
  flex:none; width:15px; cursor:grab; user-select:none; text-align:center;
  color:var(--ink-secondary); font-size:13px; line-height:16px; letter-spacing:-1px;
  border-radius:4px; transition:background .12s, color .12s;
}
.drag-h:hover{ background:rgba(43,48,65,.08); color:var(--ink); }
.drag-h:active{ cursor:grabbing; }
.face.dragging{ opacity:.4; }
.face.drop-target{ outline:2px dashed #65a30d; outline-offset:3px; border-radius:14px; }
.grid9{
  display:grid; grid-template-columns:repeat(3,1fr); gap:5px;
  background:#2B3041; padding:5px; border-radius:12px;
  box-shadow:0 10px 26px -14px rgba(43,48,65,.45);
}
.cell{
  aspect-ratio:1; background:transparent; border-radius:9px; cursor:pointer;
  position:relative; display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden; user-select:none;
  border:1.5px dashed transparent; transition:transform .12s, box-shadow .12s;
}
.cell:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.22);}
.cell.empty{border-color:#4a5064;}
.cell.empty .plus{color:#8d93a6; font-size:18px; font-weight:300;}
/* 格子左上角的 1-9 序号已于 2026-10-26 按用户要求移除（不再渲染 .pos） */
.tsvg{position:absolute; inset:0; width:100%; height:100%;}
/* 类型标签：默认隐藏，鼠标移上才在右上角显示 */
.cell .kd{
  position:absolute; top:3px; right:4px; font-size:9px; padding:0 4px; z-index:2;
  border-radius:5px; background:rgba(255,255,255,.94); color:#6b6459;
  border:1px solid rgba(0,0,0,.08); letter-spacing:.3px; pointer-events:none;
  opacity:0; transition:opacity .12s;
}
.cell:hover .kd{opacity:1;}

/* ---------- 弹窗（全站风格兜底：本土三個弹窗自己一套类名，避免后台 missing-class 陷阱） ---------- */
.ctg-mask{
  position:fixed; inset:0; background:rgba(20,22,30,.44); z-index:1200;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.ctg-mask.show{display:flex;}
.ctg-dlg{
  background:var(--bg-white); border-radius:var(--radius-lg); width:640px; max-width:94vw;
  padding:var(--space-6); box-shadow:0 24px 60px rgba(0,0,0,.3); max-height:92vh;
  display:flex; flex-direction:column;
}
.ctg-dlg.wide{width:min(1040px, 94vw);}
/* 全站 .btn-* 是 17px 的大按钮，弹窗里按小一号收敛（只压弹窗，不动顶栏） */
.ctg-dlg .btn-outline, .ctg-dlg .btn-filled{
  padding:6px 14px; font-size:14px; line-height:1.3; border-width:1px; gap:6px;
}
/* 加密包还在生成 / 生成失败时，卡片里的「下载文件」置灰（disabled 本身就不会触发 click） */
.ctg-dlg .btn-outline:disabled, .ctg-dlg .btn-filled:disabled{opacity:.45; cursor:default;}
.ctg-dlg h3{
  font-size:var(--fs-lg); font-weight:600; margin-bottom:var(--space-4);
  display:flex; align-items:center; gap:var(--space-2); flex:none;
}
.ctg-dlg h3 .face-tag{font-size:var(--fs-sm); color:var(--ink-tertiary); font-weight:400;}
/* 预览弹窗右上角：关闭（2026-10-27 与「刷新」互换位置 —— 关闭跑到弹窗底部不顺手）。
   刷新挪到底部 footer，做成带图标的描边按钮。 */
.pv-x{
  margin-left:auto; flex:none; width:28px; height:28px; padding:0; border-radius:50%;
  border:none; background:transparent; color:var(--ink-tertiary);
  cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  transition:background .12s, color .12s, transform .12s;
}
.pv-x:hover{background:rgba(43,48,65,.07); color:var(--ink);}
.pv-x:active{transform:scale(.94);}
.pv-x svg{width:15px; height:15px;}
#pv_reload svg{width:14px; height:14px; flex:none;}
.pv-seg{
  display:flex; align-items:center; gap:1px; padding:2px;
  border:1px solid var(--border); border-radius:999px; background:var(--bg);
}
.pv-seg label{
  display:inline-flex; align-items:center; gap:4px; cursor:pointer;
  padding:2px 9px; border-radius:999px; font-size:12px;
  color:var(--ink-tertiary); white-space:nowrap;
}
.pv-seg input{display:none;}
.pv-seg label svg{width:10px; height:10px; opacity:0;}
.pv-seg label.on{background:var(--fill-black); color:#fff;}
.pv-seg label.on svg{opacity:1;}
.pv-seg .swatch{width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.18);}
/* 灯光实时调节行（调好后把数值回填到 LIGHT_DEF） */
.pv-light{gap:var(--space-3); flex-wrap:wrap; font-size:12px;}
.pv-light label{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.pv-light input[type=range]{
  width:74px; height:14px; margin:0; accent-color:var(--ink); cursor:pointer;
}
.pv-light b{
  display:inline-block; min-width:30px; font-weight:600; font-size:11px;
  color:var(--ink); font-variant-numeric:tabular-nums;
}
.ctg-body{display:flex; gap:var(--space-6); overflow:auto;}
.ctg-fields{flex:1; display:flex; flex-direction:column; gap:var(--space-3);}
.ctg-fld label{display:block; font-size:var(--fs-sm); color:var(--ink-tertiary); margin-bottom:6px;}
.ctg-fld input[type=text]{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:var(--fs-md); font-family:inherit; background:var(--bg-white); color:var(--ink);
}
.ctg-fld input:focus{outline:none; border-color:var(--link);}
.ctg-hint{
  font-size:var(--fs-sm); color:var(--ink-tertiary); background:var(--bg);
  border-radius:var(--radius-sm); padding:10px 12px; line-height:1.6;
}
.ctg-hint b{color:var(--ink);}
/* ⛔⛔ 预览必须落到**和 Blender 完全相同的字体文件**，不能只靠家族名匹配。
   实测（10-30）：家族名 "DengXian" 落到常规体，墨迹 0.860em；Blender 用 DengXian Bold
   (Dengb.ttf) 只有 0.7088em —— 同字号下页面把汉字画大 21%、拼音画大 58%（Segoe UI
   vs Segoe UI Semibold Italic），叠加"拿行盒当墨迹排版"后字直接顶出贴片。
   这里用 @font-face + local() 锁定具体字体；找不到时自动退回家族名（不致命）。 */
@font-face{
  font-family:"CTG-CJK"; font-weight:700; font-style:normal;
  src:local("DengXian Bold"), local("DengXian-Bold"), local("Dengb"),
      local("DengXian"), local("Microsoft YaHei");
}
@font-face{
  font-family:"CTG-LAT"; font-weight:600; font-style:italic;
  src:local("Segoe UI Semibold Italic"), local("SegoeUI-SemiboldItalic"), local("seguisbi"),
      local("Segoe UI Semibold"), local("Segoe UI");
}
/* ---------- 自动缩放开关（2026-10-30） ----------
   对应插件 text_auto（per-object 布尔）：关 = 按设定字号原样排，装不下就溢出；
   开 = 装不下整块等比缩到边距内。默认值跟随 kind（MAIN_SUB/两行/单行=关、中文+英数=开）。
   开关是「标签 + 轨道 + 文字」三件套，input 隐藏但保留键盘可达（focus-visible 有描边）。 */
/* ⛔ 选择器必须带 .ctg-fld 前缀：上面 `.ctg-fld label{display:block}`（0,1,1）
   会把单类 `.ctg-sw`（0,1,0）的 display:flex 压掉 → 轨道塌成一点、文字挤成一行。 */
.ctg-fld label.ctg-sw{display:flex; align-items:center; gap:9px; margin-bottom:0; cursor:pointer; user-select:none;}
.ctg-sw input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
.ctg-sw .tk{
  width:38px; height:22px; border-radius:11px; background:var(--border);
  position:relative; flex:none; transition:background .16s ease;
}
.ctg-sw .tk::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.28); transition:transform .16s ease;
}
.ctg-sw input:checked + .tk{background:var(--link);}
.ctg-sw input:checked + .tk::after{transform:translateX(16px);}
.ctg-sw input:focus-visible + .tk{outline:2px solid var(--link); outline-offset:2px;}
.ctg-sw .tx{font-size:var(--fs-sm); color:var(--ink-secondary); font-weight:600; min-width:2.2em;}
.ctg-sw .tx.off{color:var(--ink-tertiary); font-weight:400;}
.ctg-sw .tx .dft{font-weight:400; color:var(--ink-tertiary);}
@media (prefers-reduced-motion: reduce){
  .ctg-sw .tk, .ctg-sw .tk::after{transition:none;}
}
.ctg-prev{width:150px; flex:none; display:flex; flex-direction:column; align-items:center; gap:var(--space-2);}
.ctg-prev .mini{
  position:relative; overflow:hidden; width:150px; height:150px;
  border:1px solid var(--border-light); border-radius:var(--radius-md); background:var(--bg-white);
}
.ctg-prev .mini .tsvg{inset:0;}
.ctg-cap{font-size:var(--fs-xs); color:var(--ink-tertiary);}
.ctg-foot{
  display:flex; gap:var(--space-2); margin-top:var(--space-5);
  justify-content:flex-end; align-items:center; flex:none; flex-wrap:wrap;
}
.ctg-foot .left{margin-right:auto; display:flex; gap:var(--space-2);}

/* ---------- 导出弹窗 ---------- */
.ctg-dlg.exp{width:min(1040px, 94vw);}
.ctg-tabs{display:flex; gap:6px; margin-bottom:var(--space-3); flex-wrap:wrap; flex:none;}
/* 客户只需要「一个导出入口」：非调试模式下整条标签栏都不出现（含「加密包 · ctgz」本尊）。
   调试模式（?dev=1 或连点标题 5 次 → body.dev）恢复显示，方便在 md/json/py 之间切回来。 */
body:not(.dev) .ctg-dlg.exp .ctg-tabs{display:none;}
.ctg-tab{
  display:flex; align-items:center; gap:7px;
  padding:6px 14px; border-radius:var(--radius-sm); cursor:pointer; font-size:var(--fs-sm);
  border:1px solid var(--border); background:var(--bg-white); color:var(--ink-secondary);
}
/* 导出标签上的「给谁用」标记：Blender 三叶 / AI 星芒 / 代码括号，颜色固定品牌色，
   选中时黑底上也认得出（文字 em 变半透明白）。 */
.ctg-tab .tab-logo{width:16px; height:16px; flex:0 0 auto; display:block;}
/* 明文导出（md/json/py）默认收起，只有调试模式露出 —— 客户看到的只有「加密包」一个入口。
   调试模式：链接带 ?dev=1，或连点导出弹窗标题 5 次（见 JS devMode）。 */
.ctg-tab.dev-tab{display:none;}
body.dev .ctg-tab.dev-tab{display:flex;}
.ctg-tab em{font-style:normal; color:var(--ink-tertiary); font-size:var(--fs-xs); margin-left:2px;}
.ctg-tab.on em{color:rgba(255,255,255,.70);}
/* 导出文件名（v1.30.1）：前缀可改，扩展名跟着标签走、单独显示在右边 */
.exp-name{display:flex; align-items:center; gap:8px; flex:none; margin-bottom:var(--space-3);}
.exp-name .lbl{font-size:var(--fs-sm); color:var(--ink-secondary); flex:0 0 auto;}
.exp-name input{
  flex:1 1 auto; min-width:0; height:30px; padding:0 10px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--bg-white); color:var(--ink); font-size:var(--fs-sm); font-family:inherit;
}
.exp-name input:focus{outline:none; border-color:var(--fill-black);}
.exp-name input::placeholder{color:var(--ink-tertiary);}
.exp-name .ext{font-size:var(--fs-sm); color:var(--ink-tertiary); flex:0 0 auto; min-width:38px;}
.exp-name button{
  flex:0 0 auto; height:30px; padding:0 10px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-white); color:var(--ink-secondary);
  font-size:var(--fs-xs); font-family:inherit; cursor:pointer;
}
.exp-name button:hover{color:var(--ink); background:var(--bg);}
/* 加密包提示：只在 ctgz 标签下出现（明文调试模式不需要），显隐由 refreshExp 切 .on */
.exp-hint{display:none; font-size:var(--fs-xs); line-height:1.6; color:var(--ink-tertiary);
  margin:8px 0 var(--space-3); flex:none;}
.exp-hint b{color:var(--ink-secondary); font-weight:600;}
.exp-hint.on{display:block;}
/* 加密包摘要卡（v3）：页面只展示「已生成 + 规格/体积」，密文一律不进 DOM。
   卡片撑一块高度，避免弹窗塌成一条、也顺手把「这只是个文件」表达清楚。 */
.exp-pack{
  display:none; flex:1 1 auto; min-height:min(34vh, 300px);
  flex-direction:column; align-items:center; justify-content:center; text-align:center;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:linear-gradient(180deg, #fbfcff 0%, #f5f7fb 100%);
  padding:var(--space-5);
}
.exp-pack.on{display:flex;}
.exp-pack .pk-ic{
  flex:none; width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:#e8effc; color:#2f6be0;
}
.exp-pack .pk-ic svg{width:26px; height:26px; display:block;}
/* 竖排：图标 → 标题 → 规格/体积 → 下载按钮，逐行水平居中，整块在卡片内垂直居中 */
.exp-pack .pk-t{margin-top:16px; font-size:var(--fs-md); font-weight:600; color:var(--ink); line-height:1.4;}
.exp-pack .pk-s{margin-top:7px; max-width:min(560px, 100%); font-size:var(--fs-xs); color:var(--ink-tertiary); line-height:1.6;}
.exp-pack .pk-dl{margin-top:22px;}
.exp-pack.err .pk-ic{background:#fdeaea; color:#c0392b;}
.exp-pack.err .pk-t{color:#c0392b;}
.ctg-tab.on{background:var(--fill-black); color:#fff; border-color:var(--fill-black);}
/* 导出内容区：弹窗多宽就多宽，纵向吃掉剩余高度（min-width:0 防 flex 子项被撑/塌） */
.ctg-ta-wrap{flex:1 1 auto; min-height:0; display:flex;}
.ctg-ta{
  flex:1 1 auto; min-width:0; min-height:min(58vh, 520px);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:var(--fs-xs);
  line-height:1.55; background:var(--bg); color:var(--ink); resize:none;
  white-space:pre; overflow:auto;
}

/* ---------- 3D 预览 ---------- */
.pv-body{flex-direction:column; gap:var(--space-3);}
.pv-host{
  position:relative; width:100%; height:min(60vh, 460px); min-height:300px;
  border:1px solid var(--border-light); border-radius:var(--radius-md);
  background:radial-gradient(circle at 50% 40%, #ffffff 0%, #f0f0f4 70%, #e6e6ec 100%);
  overflow:hidden; touch-action:none;
}
.pv-host canvas{display:block;}
.pv-bar{display:flex; align-items:center; gap:var(--space-4); font-size:var(--fs-sm); color:var(--ink-tertiary); flex-wrap:wrap;}
.pv-bar label{display:flex; align-items:center; gap:6px; cursor:pointer;}
.pv-bar2{flex-wrap:wrap; gap:var(--space-2);}
.pv-ctl{display:flex; align-items:center; gap:6px;}
.pv-mini{font-size:12px;}
.pv-faces{display:flex; gap:6px; flex-wrap:wrap;}
.pv-face{
  display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--radius-pill);
  border:1px solid var(--border); background:var(--bg-white); cursor:pointer; font-size:var(--fs-xs);
  color:var(--ink-secondary); transition:all .15s;
}
.pv-face .dot{width:10px; height:10px; border-radius:50%;}
.pv-face.on{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink);}
/* 反色态：色块加白环；黑底态：色块加黑环（配色模式区分） */
.pv-face.inv .dot{box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--ink);}
.pv-face.blk .dot{box-shadow:0 0 0 2px #fff, 0 0 0 3px #14151a;}
.pv-face.blk .sw{background:#14151a; color:#fff; border-radius:5px; padding:0 5px;}
.pv-face .sw{
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:10px; color:var(--ink-tertiary); letter-spacing:0;
}
.pv-face.inv .sw{color:var(--ink); font-weight:600;}
.pv-loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-sm); color:var(--ink-tertiary);
}

/* ---------- toast ---------- */
#ctg_toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--fill-black); color:#fff; padding:9px 20px; border-radius:var(--radius-pill);
  font-size:var(--fs-sm); opacity:0; pointer-events:none; transition:all .25s; z-index:1400;
}
#ctg_toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ================= 响应式（全站断点 1280/1024/768/480） ================= */
@media (max-width:1080px){
  :root{--fw:200px;}
}
@media (max-width:768px){
  /* 移动端：竖排单列。注意 .face.fN 显式行列必须重置，否则会跑到不存在的列 */
  .ctg-stage{padding:0 0 var(--space-4);}
  /* 宽度对齐顶部操作面：面板 = calc(100% − 28px)（左右各 14px），
     这里把区块内边距也收成 14px，并让 .cube 撑满 —— 否则 .cube 会按内容宽度收缩，
     面块比上面的面板窄一截（2026-10-27 用户截图）。 */
  .ctg-sec .section-inner{padding:0 14px;}
  .cube{
    --fw:min(320px, 88vw);
    width:100%; max-width:340px; margin:0 auto;
    grid-template-columns:1fr; gap:var(--space-5); justify-items:stretch;
  }
  :root{--fw:min(320px, 88vw);}
  .cube .face{grid-column:auto; grid-row:auto; width:100%; max-width:340px;}
  /* 移动端放弃一屏（竖排必然超一屏），操作区回到页面顶部（网格里的第一项） */
  .tb-wrap{
    grid-column:auto; grid-row:auto; order:-1;
    width:100%; max-width:340px; margin:0;
  }
  .ctg-mask{padding:12px; align-items:flex-end;}
  .ctg-dlg{max-height:94vh; padding:var(--space-4);}
  .ctg-body{flex-direction:column; gap:var(--space-4);}
  .ctg-prev{width:100%; flex-direction:row; gap:var(--space-3); align-items:center;}
  .ctg-prev .mini{width:120px; height:120px; flex:none;}
  .ctg-ta{min-height:min(46vh, 340px);}
  .pv-host{height:min(52vh, 360px);}
  .ctg-fld input[type=text]{font-size:16px;} /* iOS 聚焦不放大 */
}
@media (max-width:480px){
  :root{--fw:min(300px, 92vw);}
  .ctg-dlg h3{font-size:var(--fs-md);}
}
</style>

<body>

<section class="section ctg-sec">
  <div class="section-inner">
    <div class="ctg-stage"><div class="cube" id="cube">
      <!-- 操作区：「面头一行 + 第七格深灰面板」，整体是网格第 3 列第 1 行。
           ⛔ 必须直接写在 #cube 里，不能摆到 body 顶部：
             放 body 里它会先当普通块级元素出现在页首，等 JS 跑完 render() 才搬进网格，
             于是每次刷新都闪一下「深灰框 + 三个白格子」再跳位（2026-10-27 用户反馈）。
             配合 .tb-wrap{visibility:hidden} + render() 里加 .is-ready，首帧不再露白格。 -->
      <div class="tb-wrap">
        <div class="tb-head">
          <button class="tb-reset" id="btn_reset" type="button" title="把全部 54 格重置为默认字表">
            <span class="tb-sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
            <span>重置</span>
          </button>
          <label class="tb-size" title="尺寸预设：决定预览与导出里的贴片 / 底座尺寸（与 Blender 插件预设一致）">
            <select id="size_sel" class="form-select" data-sel-inline data-sel-compact aria-label="贴片尺寸预设">
              <option value="P17">T17*D17</option>
              <option value="P15">T15*D15</option>
              <option value="M15" selected>T15*D17</option>
            </select>
          </label>
          <label class="tb-size tb-hotend" title="热端档：决定孔径 + 销径 + 配合间隙（0.4：孔 2.45 / 销 2.03 / 间隙 0.42；0.2：T15 孔 2.25 / 销 2.10 / 间隙 0.15，T17 孔 2.28 / 销 2.14 / 间隙 0.14）">
            <select id="hotend_sel" class="form-select" data-sel-inline data-sel-compact aria-label="热端档">
              <option value="H04">0.4 热端</option>
              <option value="H02" selected>0.2 热端</option>
            </select>
          </label>
        </div>
        <div class="tb-face">
          <button class="btn-outline" id="btn_preview" data-l1="生成" data-l2="预览" aria-label="生成预览"></button>
          <button class="btn-outline" id="btn_export" data-l1="导出" data-l2="字表" aria-label="导出字表"></button>
          <button class="btn-outline" id="btn_import" data-l1="导入" data-l2="字表" aria-label="导入字表"></button>
          <input type="file" id="import_file" accept=".ctgz,.md,.markdown,.json,text/markdown,application/json" hidden>
        </div>
      </div>
    </div></div>
  </div>
</section>

<!-- 面色弹层 -->
<div id="pop" style="position:absolute;z-index:1250;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);display:none;width:172px;">

<!-- 3D 预览：惰性加载 three@0.170.0（与 tools/_shared/model-3d.js 同一版本，勿另加本地副本） -->
<script type="module">
let THREE = null, RBG = null, OrbitControls = null, RoomEnv = null, loading = false;
async function ensure3D(){
  if(THREE) return true;
  if(loading){ // 并发保护
    while(!THREE && loading){ await new Promise(r=>setTimeout(r,60)); }
    return !!THREE;
  }
  loading = true;
  try{
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ RoundedBoxGeometry: RBG } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
    ({ RoomEnvironment: RoomEnv } = await import('three/addons/environments/RoomEnvironment.js'));
    return true;
  }catch(e){
    console.warn('three 加载失败', e);
    return false;
  }finally{ loading = false; }
}

function nowStr(){
  var d = new Date(), p = function(x){ return (x<10?"0":"") + x; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());

function defaultFaces(){

/* ================= kind 自动检测 ================= */
function hasLatin(s){ return /[A-Za-z0-9]/.test(s||""); }
function hasCJK(s){ return /[\u3400-\u4dbf\u4e00-\u9fff]/.test(s||""); }
/* 纯数字/区间（5-7、22-24、7~9、8.5）—— 「中文 + 数字」排版的判据 */
var RE_NUM_ONLY = /^[\d\s\-–—~～.·/]+$/;
function isNumOnly(s){ return !!s && RE_NUM_ONLY.test(s); }
function detectKind(sub, main){
  if(!sub && !main) return null;
  if(!main && sub) return "SINGLE";
  if(!sub && main) return "SINGLE";
  /* ⭐ v1.29.9 两种不等号排版（顺序在 MIXED / MAIN_SUB 之前，否则会被抢走）：
     中文 + 数字区间（立夏 / 5-7）· 数字 + 英文（8 / Aug.） */
  if(hasCJK(sub) && !hasCJK(main) && isNumOnly(main)) return "CN_NUM";
  if(!hasCJK(sub) && isNumOnly(sub) && /[A-Za-z]/.test(main||"") && !hasCJK(main)) return "NUM_EN";
  /* 老「中文+英数」形态（中文与英数混在同一行）→ 归到 CN_NUM（同一套字号） */
  if(hasLatin(main) && hasCJK(main)) return "CN_NUM";
  if(hasLatin(sub) && !hasLatin(main) && hasCJK(main) && Array.from(main).length===1) return "MAIN_SUB";
  if(hasLatin(sub) && hasLatin(main) && !hasCJK(main)) return "MAIN_SUB";
  return "TWO_LINE";
}
window.__detectKind = detectKind;      // module 脚本要用
/* ⛔ 归一化必须在这里做：MIXED 已不在下拉选项里，直接拿旧值去 fKind.value 会「选不中」 */
function resolvedKind(t){ return normKind(t.kind || detectKind(t.sub, t.main)); }
/* ---- 自动缩放 = 插件 text_auto（per-object 布尔，2026-10-30 做成可开关）----
   ⛔ 默认值必须**按 kind**给，不能全局一个值：插件「套用预设」写的是
      MAIN_SUB / TWO_LINE / SINGLE = False，只有「中文 + 英数」预设写 True。
   tile.auto === true/false = 用户在这个格子里显式定过；undefined / 缺字段 = 跟随 kind 默认。 */
/* ⛔ v1.29.9 起 CN_NUM / NUM_EN 默认 **关**：字号已经按内容长度定好（上行 8.5 / 下行 6.4），
   再开自适应只会「只缩第二行」，把刚定好的比例又打散（就是上大下小的老毛病）。
   MIXED 现在等同 CN_NUM，也不再默认开。 */
var AUTO_BY_KIND = {MAIN_SUB:false, TWO_LINE:false, SINGLE:false, CN_NUM:false, NUM_EN:false, MIXED:false};
function autoDefaultOf(k){ return !!AUTO_BY_KIND[k]; }   // 未知 / 空 kind → false（与插件默认一致）
function autoOf(t, k){
  k = k || (t ? resolvedKind(t) : "");
  if(t && typeof t.auto === "boolean") return t.auto;
  return !!AUTO_BY_KIND[k];
}
function isEmptyTile(t){ return !t.main && !t.sub; }
function countFilled(faces){
  var n = 0;
  faces.forEach(function(f){ f.tiles.forEach(function(t){ if(!isEmptyTile(t)) n++; }); });
  return n;
}
/* 自动缩放的开/关片数（导出规格里写清楚，AI 才不会一律按 0.4 时代的默认证糊过去） */
function autoStats(){
  var on = 0, off = 0;
  state.faces.forEach(function(f){ f.tiles.forEach(function(t){
    if(isEmptyTile(t)) return;
    if(autoOf(t)) on++; else off++;
  }); });
  return {on:on, off:off};
}

/* ================= 渲染 ================= */
var cubeEl = document.getElementById("cube");
function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escAttr(s){ return escHtml(s); }
function render(){
  // 操作区是网格里的第 3 列第 1 行（不是浮动块）：清空前先把它摘出来，
  // 画完再塞回网格，否则 innerHTML="" 会把它一起删掉。整块搬的是 .tb-wrap（含面头）
  var tb = document.querySelector(".tb-wrap");
  cubeEl.innerHTML = "";
  for(var f=0; f<6; f++){
    var face = state.faces[f];
    var fd = document.createElement("div");
    fd.className = "face f"+(f+1);
    var filled = face.tiles.filter(function(t){return !isEmptyTile(t);}).length;
    var h = '<div class="face-head">'
      + '<span class="drag-h" draggable="true" data-face="'+f+'" title="按住拖到另一面：两面互换 9 格字表（面名与面色留在原位）">⠿</span>'
      + '<div class="swatch" data-face="'+f+'" title="点击换面色" style="background:'+face.color.hex+'"></div>'
      + '<input class="face-name" data-face="'+f+'" value="'+escAttr(face.name)+'" title="面名称">'
      + '<span class="face-count">'+filled+'/9</span>'
      + '</div><div class="grid9">';
    for(var i=0; i<9; i++){
      var t = face.tiles[i];
      if(isEmptyTile(t)){
        h += '<div class="cell empty" data-face="'+f+'" data-pos="'+i+'">'
           + '<span class="plus">＋</span></div>';
      }else{
        var k = resolvedKind(t);
        var tAuto = autoOf(t, k);
        h += '<div class="cell" data-face="'+f+'" data-pos="'+i+'" title="'+escAttr((KIND_LABEL[k]||"")+" · 自动缩放"+(tAuto?"开":"关"))+'">'
           + tileSVG(t.sub, t.main, k, face.color.hex, 0, {auto:tAuto, size:t.size})
           + '<span class="kd">'+escHtml(KIND_SHORT[k]||"")+'</span></div>';
      }
    }
    h += '</div>';
    fd.innerHTML = h;
    cubeEl.appendChild(fd);
  }
  if(tb){
    cubeEl.appendChild(tb);        // 放回第 3 列第 1 行（面1 右、面4 上）
    tb.classList.add("is-ready");  // 首帧防闪：内容都就位了才显形（见 .tb-wrap 的 visibility）
  }
  saveState();
}

/* ================= 面内容互换（9 格字表，2026-11-09 二次定稿）=================
   面头左侧 ⠿ 拖柄拖动：拖到另一面上松手 = 两个面的「9 格字表」互换。
   面序位置（面1…面6 的网格位置）、面名、面底色（耗材色）全部留在原位 ——
   用户口径：「面1 和面5 的位置不能变，是把里面的内容换了位置」。
   ⛔ 历史：首版做的是「插入顺延」（splice(g,0,splice(f,1)[0])，面5→面1 会把
   面2~面4 全挤走一格），用户实测后否掉 → 已作废，勿改回整面搬数组。
   3D 预览与导出都按 state.faces 现读，互换后无需额外同步；
   sessionStorage 由 render() 里的 saveState() 落盘，刷新不丢。
   ⛔ 只有拖柄 draggable=true：面名 input、换色 swatch、格子都不能发起拖动。 */
function swapFaceTiles(f, g){
  if(f === g || !(f >= 0 && f < 6) || !(g >= 0 && g < 6)) return false;
  var t = state.faces[f].tiles;
  state.faces[f].tiles = state.faces[g].tiles;
  state.faces[g].tiles = t;
  render();
  return true;
}
window.__swapFaceTiles = swapFaceTiles;   // CDP 验证用（与 __detectKind 同例）
var dragFace = -1;
function faceIdxOf(el){
  var m = (el.className || "").match(/(?:^|\s)f([1-6])(?:\s|$)/);
  return m ? (+m[1]) - 1 : -1;
}
function cleanupDrag(){
  dragFace = -1;
  var all = cubeEl.querySelectorAll(".face");
  for(var i = 0; i < all.length; i++) all[i].classList.remove("dragging", "drop-target");
}
cubeEl.addEventListener("dragstart", function(e){
  var h = e.target && e.target.closest ? e.target.closest(".drag-h") : null;
  if(!h){ e.preventDefault(); return; }  // 非拖柄发起 → 取消，不影响格子/输入框
  dragFace = (+h.getAttribute("data-face")) || 0;
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", String(dragFace)); }catch(err){}
  var fd = cubeEl.querySelector(".face.f" + (dragFace + 1));
  if(fd) fd.classList.add("dragging");
});
cubeEl.addEventListener("dragover", function(e){
  if(dragFace < 0) return;
  var fd = e.target && e.target.closest ? e.target.closest(".face") : null;
  if(!fd) return;
  e.preventDefault();                    // 允许在此面上 drop
  if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
  if(faceIdxOf(fd) === dragFace) return;
  var all = cubeEl.querySelectorAll(".face");
  for(var i = 0; i < all.length; i++) all[i].classList.remove("drop-target");
  fd.classList.add("drop-target");
});
cubeEl.addEventListener("drop", function(e){
  if(dragFace < 0) return;
  e.preventDefault();
  var fd = e.target && e.target.closest ? e.target.closest(".face") : null;
  var g = fd ? faceIdxOf(fd) : -1;
  var swapped = (g >= 0 && g !== dragFace) ? swapFaceTiles(dragFace, g) : false;
  cleanupDrag();
  if(swapped) toast("已互换 9 格字表：面" + (dragFace + 1) + " ↔ 面" + (g + 1) + "（面名与面色留在原位）");
});
cubeEl.addEventListener("dragend", cleanupDrag);
cubeEl.addEventListener("dragleave", function(e){
  var fd = e.target && e.target.closest ? e.target.closest(".face") : null;
  if(fd && faceIdxOf(fd) !== dragFace) fd.classList.remove("drop-target");
});
/* 拖到展开图外松手：浏览器默认会拿 text/plain 去导航，全局拦掉 */
document.addEventListener("dragover", function(e){ if(dragFace >= 0) e.preventDefault(); });
document.addEventListener("drop", function(e){ if(dragFace >= 0) e.preventDefault(); });

/* ================= 编辑弹窗 ================= */
var editing = {face:-1, pos:-1};
var editSnap = null;                       // 打开时的快照，「重置本格」用
var editMask = document.getElementById("edit_mask");
var fSub = document.getElementById("f_sub"), fMain = document.getElementById("f_main"), fKind = document.getElementById("f_kind");
var fAuto = document.getElementById("f_auto"), fAutoTx = document.getElementById("f_auto_tx");
/* 开关文字：开/关 + 「默认」标记（当前值是否等于该 kind 的默认值） */
function syncAutoUI(k){
  var on = fAuto.checked, dft = autoDefaultOf(k);
  fAutoTx.innerHTML = (on ? "开" : "关") + (on === dft ? ' <span class="dft">默认</span>' : "");
  fAutoTx.classList.toggle("off", !on);
  fAuto.title = on ? "装不下时整块缩到边距内（插件 text_auto = True）"
                   : "按设定字号原样排，超出可用区会溢出（插件 text_auto = False）";
}
function editorKind(){ return fKind.value ? fKind.value : detectKind(fSub.value.trim(), fMain.value.trim()); }
function openEditor(f, i){
  editing = {face:f, pos:i};
  var t = state.faces[f].tiles[i];
  /* ⛔ kind 先归一化再放进下拉：旧字表的 "MIXED" 在下拉里已无对应 option，
     直接赋值会让 select 落到空值（看起来「选不中」）。归一成 CN_NUM 后能正常高亮。 */
  editSnap = {sub:t.sub||"", main:t.main||"", kind:normKind(t.kind), auto:autoOf(t)};
  fSub.value = editSnap.sub; fMain.value = editSnap.main; fKind.value = editSnap.kind;
  fAuto.checked = editSnap.auto;
  document.getElementById("ed_title").textContent = "编辑格子 · 第 "+(i+1)+" 格";
  document.getElementById("ed_face").textContent = state.faces[f].name;
  refreshEditorPreview();
  editMask.classList.add("show");
  setTimeout(function(){ fMain.focus(); }, 60);
}
function refreshEditorPreview(){
  var sub = fSub.value.trim(), main = fMain.value.trim();
  var k = editorKind();
  var face = state.faces[editing.face];
  var color = face ? face.color.hex : "#333";
  var auto = fAuto.checked;
  document.getElementById("mini").innerHTML = tileSVG(sub, main, k || "TWO_LINE", color, 0, {auto:auto});
  syncAutoUI(k);
  var hint = document.getElementById("kind_hint");
  if(!sub && !main){
    hint.innerHTML = "空格子：保存后此格为空。";
    return;
  }
  /* 不在这里判「是否溢出」：页面用 canvas 墨迹高度估算，比 Blender 的标称行盒系统性偏大
     （同批 54 片实测有 42 片会被误判），给个数字反而是误导。关掉时只看预览就知道字顶到哪。 */
  hint.innerHTML = "当前类型：<b>"+escHtml(KIND_LABEL[k]||k||"—")+"</b><br>"+(KIND_PRESET[k]||"")
    + "<br>自动缩放 <b>"+(auto ? "开" : "关")+"</b>"
    + (auto ? "：装不下整块缩到边距内" : "：按设定字号排（不缩，可能顶满甚至超出贴片边界）");
}
fSub.addEventListener("input", refreshEditorPreview);
fMain.addEventListener("input", refreshEditorPreview);
fKind.addEventListener("change", function(){
  /* 切排版类型 = 插件「套用预设」：text_auto 回到该类型的默认值 */
  fAuto.checked = autoDefaultOf(editorKind());
  refreshEditorPreview();
});
fAuto.addEventListener("change", refreshEditorPreview);
document.getElementById("ed_save").addEventListener("click", function(){
  var t = state.faces[editing.face].tiles[editing.pos];
  t.sub = fSub.value.trim(); t.main = fMain.value.trim(); t.kind = fKind.value || null;
  /* 等于该 kind 的默认值就不写字段（跟着 kind 走），只有偏离默认才落盘 —— 避免换类型后残留旧值 */
  if(fAuto.checked === autoDefaultOf(resolvedKind(t))) delete t.auto; else t.auto = fAuto.checked;
  editMask.classList.remove("show");
  render(); toast("已保存 · 自动缩放" + (fAuto.checked ? "开" : "关"));
});
document.getElementById("ed_cancel").addEventListener("click", function(){ editMask.classList.remove("show"); });
/* 重置本格 = 回到打开弹窗时的样子（用户选乱了可以退回重来） */
document.getElementById("ed_reset").addEventListener("click", function(){
  fSub.value = editSnap.sub; fMain.value = editSnap.main; fKind.value = editSnap.kind;
  fAuto.checked = editSnap.auto;
  refreshEditorPreview(); toast("已恢复到打开时的内容");
});
document.getElementById("ed_clear").addEventListener("click", function(){
  fSub.value=""; fMain.value=""; fKind.value=""; fAuto.checked = autoDefaultOf(null);
  refreshEditorPreview(); toast("已清空，点保存生效");
});

/* ================= 面色弹层 ================= */
var pop = document.getElementById("pop");
var popFace = -1;
function buildPopColors(){
  var box = document.getElementById("pop_colors");
  box.innerHTML = "";
  PALETTE.forEach(function(p){
    var d = document.createElement("div");
    d.style.cssText = "width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.22);background:"+p.hex;
    d.title = p.name;
    d.addEventListener("click", function(){
      state.faces[popFace].color = {name:p.name, hex:p.hex, rgb:p.rgb};
      hidePop(); render();
    });
    box.appendChild(d);
  });
}
function hexToRgb(hex){
  var m = /^#?([0-9a-fA-F]{6})$/.exec((hex||"").trim());
  if(!m) return null;
  var v = parseInt(m[1],16);
  return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255];
}
document.getElementById("pop_hex").addEventListener("change", function(){
  var rgb = hexToRgb(this.value);
  if(!rgb){ toast("颜色格式不对，要 #RRGGBB"); return; }
  state.faces[popFace].color = {name:"自定义", hex:this.value.trim(), rgb:rgb};
  hidePop(); render();
});
function showPop(f, anchor){
  popFace = f;
  document.getElementById("pop_hex").value = state.faces[f].color.hex;
  var r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth-190)) + "px";
  pop.style.top  = (r.bottom + 8 + window.scrollY) + "px";
  pop.style.display = "block";
}
function hidePop(){ pop.style.display = "none"; }
document.addEventListener("click", function(e){
  if(pop.style.display === "block" && !pop.contains(e.target) && !e.target.classList.contains("swatch")) hidePop();
});
buildPopColors();

/* ================= 网格事件（委托） ================= */
cubeEl.addEventListener("click", function(e){
  var sw = e.target.closest(".swatch");
  if(sw){ showPop(+sw.dataset.face, sw); return; }
  if(e.target.closest(".face-name")) return;
  var cell = e.target.closest(".cell");
  if(cell){ openEditor(+cell.dataset.face, +cell.dataset.pos); }
});
cubeEl.addEventListener("change", function(e){
  var nm = e.target.closest(".face-name");
  if(nm){
    state.faces[+nm.dataset.face].name = nm.value.trim() || ("面"+(+nm.dataset.face+1));
    saveState();
  }
});

/* ================= 加密容器 .ctgz（2026-11-09 v3：公钥加密，只有插件能解）=================
   背景：字表要发给客户自定义填写、再传回来建模打印；明文 .md/.json 谁拿到都能读，
   改两个格子就变成另一套字表。
   ⛔ 页面是**公开链接**（不做一客户一码），所以页面上**绝不放能解密的材料**：
     · 页面只有 RSA-2048 **公钥** —— 只能加密；
     · **私钥只存在于 ctg_tile_generator.py（卖家的插件）里** —— 也就是说，把本页源码
       整份抄走，也解不开任何一个 .ctgz；只有插件能把文件还原成字表并建模。
   信封加密流程：
     1) 每次导出随机生成 32B 内容密钥 K；
     2) 正文：明文 XOR keystream（每 32B 一块 = HMAC-SHA256(kEnc, nonce16 + 大端4B计数器)），
        kEnc = HMAC-SHA256(K,"ctg3-enc")；
     3) K 用 RSA-OAEP(SHA-256) 公钥加密 → ek（256B），文件里只有 ek；
     4) 校验：HMAC-SHA256(kMac, "CTGTILE/3" + id + ek + nonce + 密文)，kMac = HMAC-SHA256(K,"ctg3-mac")；
     5) K 在导出者本机 localStorage 留一份（按 id 索引），所以「同一台设备再导入」照样能用；
        换设备、或文件落到别人手里 —— 没有私钥就解不开。
   容器是纯 ASCII 文本（微信/邮件原样传输不怕编码），页面上**从不显示密文**：
     CTGTILE/3
     id=<b64 8B>       包标识（仅用于本机找回 K）
     ek=<b64 256B>     RSA 加密后的 K
     nonce=<b64 16B>
     data=<b64 密文>
     tag=<b64 32B>
   ⛔⛔ 必须与 ctg_tile_generator.py 的 _ctg_decrypt() **字节级一致**：
      AAD 拼接顺序、子钥标签串（ctg3-enc / ctg3-mac）、keystream 分块长度、
      OAEP 参数（SHA-256 + MGF1-SHA-256 + 空 label）。
   ⚠ 安全边界：私钥只在你手里 —— 插件源码别外发；客户拿到的永远是密文。 */
var CTG_MAGIC = "CTGTILE/3";
var CTG_MAGIC_V2 = "CTGTILE/2";      // 中间试作版，只用于报一句准确的错
var CTG_MAGIC_V1 = "CTGTILE/1";      // 授权码时代，只用于报错
/* 公钥（RSA-2048 / e=65537）。私钥不在这里，也不要往这里放。 */
var CTG_PUB_JWK = {kty:"RSA", n:"zWhObge-fgimBD_4O4HsWqO3hng5bm_RFJfvxStgJrf8hDYHnIveMvgOdmONMWcS7KTbQnXA2Buvf4YBD2Zg2HIPwfq332HqxrY6fWlMQHo_pdA-zMKvI-NAhVfFo0pOchzVmDKDJ6uaObx18qalj9dNRG34iKzL78ktyo7eQYrJ7Yqp1We6fKnCJh2V_C2kFi-0ZGiFfBuZLY948KNfvmQ0KE3MPVsFXdy3LdX4qoOALCYYwQ4SmgBukPaLWuvni5nboSgMb7RdEk9GraYE5IZa5Ngieqw3lW7hyCF_o9hizUVpyD-thGw2d26S1gQzRfchiwiZ27ezVutEjuuQSw", e:"AQAB", alg:"RSA-OAEP-256", ext:true};
var CTG_LS_PREFIX = "ctgz_k_";       // 本机记住「这个包的内容密钥」，只对本机导出的包有效
function ctgB64Enc(u8){
  var s = "", C = 0x8000;
  for(var i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i + C));
  return btoa(s);
}
function ctgB64Dec(str){
  var bin = atob(String(str || "").replace(/\s+/g, ""));
  var u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function ctgCat(){
  var n = 0, i;
  for(i = 0; i < arguments.length; i++) n += arguments[i].length;
  var out = new Uint8Array(n), off = 0;
  for(i = 0; i < arguments.length; i++){ out.set(arguments[i], off); off += arguments[i].length; }
  return out;
}
/* ---- 公钥（只能加密）与本机内容密钥缓存 ---- */
var ctgPubCache = null;
async function ctgPubKey(){
  if(ctgPubCache) return ctgPubCache;
  ctgPubCache = await crypto.subtle.importKey("jwk", CTG_PUB_JWK, {name:"RSA-OAEP", hash:"SHA-256"},
                                             false, ["encrypt"]);
  return ctgPubCache;
}
async function ctgKeysFor(raw32){
  return { enc: await ctgSubkey(raw32, "ctg3-enc"), mac: await ctgSubkey(raw32, "ctg3-mac") };
}
/* 本机留一份 K（只在导出这台设备上），使「同机再导入」可行；文件本身不含 K 明文 */
function ctgRememberKey(idStr, K){
  try{
    localStorage.setItem(CTG_LS_PREFIX + idStr, ctgB64Enc(K));
    var keys = [], i;
    for(i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(CTG_LS_PREFIX) === 0) keys.push(k);
    }
    while(keys.length > 20){ try{ localStorage.removeItem(keys.shift()); }catch(e){} }
  }catch(e){}
}
function ctgRecallKey(idStr){
  try{
    var v = localStorage.getItem(CTG_LS_PREFIX + idStr);
    return v ? ctgB64Dec(v) : null;
  }catch(e){ return null; }
}
/* ---- 派生 ---- */
async function ctgSubkey(raw32, label){
  var base = await crypto.subtle.importKey("raw", raw32, {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  var sig  = await crypto.subtle.sign("HMAC", base, new TextEncoder().encode(label));
  return crypto.subtle.importKey("raw", new Uint8Array(sig), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
}
async function ctgHmac(key, bytes){
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, bytes));
}
async function ctgStream(keyEnc, nonce, len){
  var out = new Uint8Array(len), off = 0, i = 0;
  while(off < len){
    var msg = new Uint8Array(20);
    msg.set(nonce, 0);
    msg[16] = (i >>> 24) & 255; msg[17] = (i >>> 16) & 255; msg[18] = (i >>> 8) & 255; msg[19] = i & 255;
    var blk = await ctgHmac(keyEnc, msg);
    var take = Math.min(32, len - off);
    for(var j = 0; j < take; j++) out[off + j] = blk[j];
    off += take; i++;
  }
  return out;
}
function ctgNeedCrypto(){
  if(window.crypto && crypto.subtle && crypto.getRandomValues) return;
  /* ⛔ HTTP + 局域网 IP（如 http://192.168.0.25:8080）不是「安全上下文」，
     浏览器会直接不提供 crypto.subtle —— 与浏览器新旧无关，别让用户去升级浏览器。
     只有 https / localhost / 127.0.0.1 / file:// 才开放 Web Crypto。 */
  var err;
  if(window.isSecureContext === false){
    err = new Error("此页面不是安全上下文（" + location.origin + "），浏览器在这种地址下不开放加密接口。"
      + "请改用 http://localhost:8080 或 http://127.0.0.1:8080 打开本页；线上 https 链接不受影响。");
    err.ctgInsecure = true;
    err.ctgNoHint = true;
    throw err;
  }
  err = new Error("当前浏览器不支持网页加密（crypto.subtle 不可用），请换新版 Chrome / Edge / Safari。");
  err.ctgNoHint = true;
  throw err;
}
/* 局域网 HTTP 打开时，给出同一页面的 https 地址（本地服务 8443 监听，crypto.subtle 才可用） */
function ctgHttpsHint(){
  if(location.protocol === "https:") return "";
  var h = location.hostname;
  if(!h || h === "localhost" || h === "127.0.0.1") return "";
  return "https://" + h + ":8443" + location.pathname + location.search;
}
async function ctgEncrypt(plain){
  ctgNeedCrypto();
  var id    = crypto.getRandomValues(new Uint8Array(8));
  var K     = crypto.getRandomValues(new Uint8Array(32));
  var nonce = crypto.getRandomValues(new Uint8Array(16));
  var pt = new TextEncoder().encode(plain);
  var k  = await ctgKeysFor(K);
  var ks = await ctgStream(k.enc, nonce, pt.length);
  var ct = new Uint8Array(pt.length);
  for(var i = 0; i < pt.length; i++) ct[i] = pt[i] ^ ks[i];
  /* K 用公钥包起来 —— 只有插件里的私钥能拆开 */
  var ek = new Uint8Array(await crypto.subtle.encrypt({name:"RSA-OAEP"}, await ctgPubKey(), K));
  var aad = new TextEncoder().encode(CTG_MAGIC);
  var tag = await ctgHmac(k.mac, ctgCat(aad, id, ek, nonce, ct));
  ctgRememberKey(ctgB64Enc(id), K);
  return [CTG_MAGIC, "id=" + ctgB64Enc(id), "ek=" + ctgB64Enc(ek), "nonce=" + ctgB64Enc(nonce),
          "data=" + ctgB64Enc(ct), "tag=" + ctgB64Enc(tag)].join("\n") + "\n";
}
function ctgIsPacked(text){ return /^\s*CTGTILE\//.test(String(text || "")); }
function ctgFields(text){
  var out = {}, lines = String(text).replace(/\r/g, "").split("\n");
  var head = (lines[0] || "").trim();
  if(head === CTG_MAGIC_V1 || head === CTG_MAGIC_V2){
    throw new Error("这是旧版加密字表（" + head + "），请让卖家重新发一份新版导出的 .ctgz");
  }
  if(head !== CTG_MAGIC) throw new Error("不是本工具的加密字表（首行标识不对）");
  for(var i = 1; i < lines.length; i++){
    var p = lines[i].indexOf("=");
    if(p > 0) out[lines[i].slice(0, p).trim()] = lines[i].slice(p + 1).trim();
  }
  return out;
}
async function ctgDecrypt(text){
  ctgNeedCrypto();
  var f = ctgFields(text);
  var id = ctgB64Dec(f.id), ek = ctgB64Dec(f.ek), nonce = ctgB64Dec(f.nonce),
      ct = ctgB64Dec(f.data), tag = ctgB64Dec(f.tag);
  if(!id.length || ek.length !== 256 || nonce.length !== 16 || tag.length !== 32){
    throw new Error("加密字表已损坏（字段长度不对）");
  }
  /* 网页没有私钥：只有本机导出过的包，才在 localStorage 里留着自己那份 K */
  var K = ctgRecallKey(f.id);
  if(!K || K.length !== 32){
    throw new Error("这个加密包只有卖家的 Blender 插件能打开（本页不含解密密钥）。"
                  + "要继续编辑，请在本页重新填写 —— 本机填过的内容会自动保留");
  }
  var k = await ctgKeysFor(K);
  var aad = new TextEncoder().encode(CTG_MAGIC);
  var want = await ctgHmac(k.mac, ctgCat(aad, id, ek, nonce, ct));
  var diff = 0;
  for(var i = 0; i < 32; i++) diff |= (want[i] ^ tag[i]);
  if(diff !== 0) throw new Error("文件已损坏或被改过（校验失败），请让客户重新导出一份");
  var ks = await ctgStream(k.enc, nonce, ct.length);
  var pt = new Uint8Array(ct.length);
  for(var j = 0; j < ct.length; j++) pt[j] = ct[j] ^ ks[j];
  return new TextDecoder().decode(pt);
}

function pyStr(s){ return '"' + (s||"").replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"'; }
function buildPY(){
  var lines = [];
  lines.push("# -*- coding: utf-8 -*-");
  lines.push("# 魔方贴片字表 · 由 wlili.top/tools/cube-tile-table.html 导出 · " + nowStr());
  lines.push("# 用法：整体替换 _build_final_2510.py 顶部的 DATA 与 FACES 配色段，再跑构建脚本。");
  lines.push("# 元组: (第二行 text_main, 第一行 text_sub, 面号 1-6, kind, text_auto)");
  lines.push("# kind: MAIN_SUB=单字+拼音(12/8/1.6) · TWO_LINE=两行(8.5/8.5/1.0) · SINGLE=单行(8)");
  lines.push("#       CN_NUM=中文+数字(8.5/6.4/1.0) · NUM_EN=数字+英文(8.5/6.4/1.0)；旧 MIXED 等同 CN_NUM");
  lines.push("# text_auto: 插件 p.text_auto —— True=装不下缩到边距内 / False=按原字号溢出；逐片给出，别一律套默认");
  lines.push("DATA = [");
  var n = 0;
  state.faces.forEach(function(face, fi){
    lines.push("    # ---- " + face.name + "（" + face.color.name + " " + face.color.hex + "）----");
    face.tiles.forEach(function(t, ti){
      if(isEmptyTile(t)) return;
      lines.push("    (" + pyStr(t.main) + ", " + pyStr(t.sub) + ", " + (fi+1) + ", '" + resolvedKind(t) + "', " + (autoOf(t) ? "True" : "False") + "),");
      n++;
    });
  });
  lines.push("]");
  lines.push("assert len(DATA) == " + n + ', "字表应是 ' + n + ' 片，当前 %d" % len(DATA)');
  lines.push("");
  lines.push("# 面配色（名字, 线性 RGB 0-1）——对应插件调色板 6 默认文字色");
  lines.push("FACE_COLORS = {");
  state.faces.forEach(function(face, fi){
    var rgb = face.color.rgb ? face.color.rgb : hexToRgb(face.color.hex) || [0,0,0];
    lines.push("    " + (fi+1) + ": (" + pyStr(face.color.name) + ", (" +
      rgb.map(function(x){ return x.toFixed(3); }).join(", ") + ")),");
  });
  lines.push("}");
  return lines.join("\n");
}

/* ================= 导入字表（.md / .json） =================
   导出格式的 .md 里带一段 ```json，直接抽出来用；.json 直接读。
   尺寸预设从 meta.standard 里认（新格式有「尺寸预设」，旧格式靠「贴片/底板」里的 17/15）。 */
function parseTableFile(text){
  var data = null;
  try{ data = JSON.parse(text); }catch(e){}
  if(!data || !data.faces){
    var m = text.match(/```json\s*([\s\S]*?)```/i);
    if(m){ try{ data = JSON.parse(m[1]); }catch(e){ data = null; } }
  }
  if(!data || !data.faces) throw new Error("没找到 JSON（支持工具导出的 .md 或 .json）");
  if(!Array.isArray(data.faces) || data.faces.length !== 6) throw new Error("faces 必须是 6 个面");
  var faces = data.faces.map(function(f, i){
    var src = (f.tiles || []).slice().sort(function(a, b){ return (a.pos || 0) - (b.pos || 0); }).slice(0, 9);
    var tiles = [];
    for(var k = 0; k < 9; k++){
      var t = src[k] || {};
      var sub = (t.text_sub != null) ? String(t.text_sub) : "";
      var main = (t.text_main != null) ? String(t.text_main) : "";
      /* ⛔ 空格子保持 kind=undefined：导出时空格子的 kind 写的是 null，
         原样兜底成 "MAIN_SUB" 会让「导出→导入」一次就改掉数据（2026-11-09 冒烟发现）。 */
      var empty = !sub && !main;
      tiles.push({sub: sub, main: main,
                  kind: empty ? undefined : (t.kind || detectKind(sub, main) || "MAIN_SUB"),
                  /* text_auto 缺省时给 undefined：交给 autoOf 按 kind 默认推断（老文件没有这个字段） */
                  auto: (typeof t.text_auto === "boolean") ? t.text_auto : undefined,
                  /* ⭐ 单格字号覆盖（17 基准）：给「中文 + 长数字」这种两行都得缩小的格用 */
                  size: (typeof t.size === "number" && t.size > 0) ? t.size : undefined});
    }
    var c = f.color || {}, pal = PALETTE[i] || PALETTE[0];
    return {name: f.name || ("面" + (i + 1)),
            color: {name: c.name || pal.name, hex: c.hex || pal.hex, rgb: c.rgb || pal.rgb},
            tiles: tiles};
  });
  var std = (data.meta && data.meta.standard) || {};
  var txt = [std["尺寸预设"], std["贴片"], std["底板"], std["底座销板"]].join(" ");
  var key = "P17";
  /* 新版 label 是 T17*D17 这种；老文件还是「底座 17 + 贴片 17」—— 两套都要认，
     否则 v1.29.7 之后导出的文件再导入，尺寸会被一律打回 P17。 */
  var m = /T(\d+)\s*\*\s*D(\d+)/.exec(txt);
  if(m){
    var tw = +m[1], bw = +m[2];
    key = (tw === 15 && bw === 17) ? "M15" : (tw === 15 ? "P15" : "P17");
  }else if(/贴片\s*15|15\s*×\s*15/.test(txt)){
    key = /底座\s*17/.test(txt) ? "M15" : "P15";
  }
  /* 热端：优先读结构化字段 meta.hotend；老文件看规格文字里有没有 0.2 */
  var hk = (data.meta && data.meta.hotend) || "";
  if(!HOTEND_PRESETS[hk]){
    hk = /0\.2/.test(String(std["热端"] || "")) ? "H02" : "H04";
  }
  return {faces: faces, size: key, hotend: hk};
}
async function doImport(text, fname){
  /* 加密包（.ctgz）先解密再走同一套解析；明文 md/json 原样放行（旧文件、内部排查用） */
  if(ctgIsPacked(text)){
    text = await ctgDecrypt(text);
  }
  var r = parseTableFile(text);
  state = {faces: r.faces, size: r.size, hotend: r.hotend};
  var sel = document.getElementById("size_sel");
  if(sel){
    sel.value = r.size;

  }else{
    applySize(r.size); render(); paintToolFace();
  }
  var hsel = document.getElementById("hotend_sel");
  if(hsel){
    hsel.value = r.hotend;
    hsel.dispatchEvent(new Event("change"));
  }else{
    applyHotend(r.hotend);
  }
  saveState();
  render(); paintToolFace();
  toast("已导入" + (fname ? " " + fname : "") + " · " + countFilled(state.faces) + " / 54 片 · " + sizeOf().label + " · " + hotendOf().label);
}

pvMask.addEventListener("click", function(e){ if(e.target===pvMask) closePreview(); });
document.getElementById("pv_spin").addEventListener("change", function(){
  if(pvHandle) pvHandle.setSpin(this.checked);
});
document.getElementById("pv_core").addEventListener("change", function(){
  var sel = this.querySelector("input:checked");
  if(!sel) return;
  pvOpts.core = sel.value; savePv(); syncCoreUI();
  rebuild3D();
});
/* 右上角刷新：按当前字表与选项整棵重建 */
document.getElementById("pv_reload").addEventListener("click", function(){
  rebuild3D();
  toast("已刷新预览");
});
/* 「统一配色」：点一次把六面统一推进到下一个模式 正常→反色→黑底→黑座→正常，
   按钮文字显示「将要变成」的模式，避免误点 */
var pvAllBtn = document.getElementById("pv_all_mode");
function refreshAllBtn(){
  var cur = pvOpts.mode[0], next = (cur + 1) % 4;
  var unified = pvOpts.mode.every(function(m){ return m === cur; });
  pvAllBtn.textContent = "统一：" + MODE_LABEL[next] + (unified ? "" : "（现为混合）");
}
pvAllBtn.addEventListener("click", function(){
  var next = (pvOpts.mode[0] + 1) % 4;
  pvOpts.mode = pvOpts.mode.map(function(){ return next; });
  savePv(); buildPrevChips();
  rebuild3D();
});
function buildPrevChips(){
  var box = document.getElementById("pv_faces");
  box.innerHTML = "";
  ["上","左","前","右","后","下"].forEach(function(lb, i){
    var f = state.faces[i];
    var m = pvOpts.mode[i] || 0;
    var b = document.createElement("div");
    b.className = "pv-face" + (m ? (m >= 2 ? " blk" : " inv") : "");
    b.innerHTML = '<span class="dot" style="background:'+f.color.hex+'"></span>'
                + '<span class="nm">' + (i+1) + "·" + escHtml(lb) + '</span>'
                + '<span class="sw">' + MODE_LABEL[m] + '</span>';
    b.querySelector(".dot").addEventListener("click", function(ev){
      ev.stopPropagation();
      pvOpts.mode[i] = (m + 1) % 4;                 // 正 → 反 → 黑 → 黑座 → 正
      savePv(); buildPrevChips();
      doBuild3D().catch(function(e){ toast("重建失败：" + e.message); });
    });
    b.addEventListener("click", function(){ if(pvHandle) pvHandle.focus(i); });
    box.appendChild(b);
  });
  refreshAllBtn();
}

/* ================= toast / 快捷键 ================= */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("ctg_toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    editMask.classList.remove("show");
    expMask.classList.remove("show");
    if(pvMask.classList.contains("show")) closePreview();
    hidePop();
  }
});

/* ================= 启动 ================= */
/* 操作面：三枚按钮用「真贴片渲染」画内容 —— 字号/比例与模型里的
   两行片（干支纪年那类）完全一致，而不是随便给个 px 字号。
   换尺寸预设时要重画（字号跟着 TILE_MM/17 走） */
function paintToolFace(){
  var fix = +(7.385 * sizeScale()).toFixed(3);
  [].forEach.call(document.querySelectorAll(".tb-face .btn-outline"), function(b){
    b.innerHTML = tileSVG(b.getAttribute("data-l1"), b.getAttribute("data-l2"), "TWO_LINE", "#22222a", 0, {fix:fix});
  });
}
state = loadState();
applySize(state.size || SIZE_DEFAULT);
applyHotend(state.hotend || HOTEND_DEFAULT);
document.getElementById("size_sel").value = SIZE_KEY;
document.getElementById("hotend_sel").value = HOTEND_KEY;
document.getElementById("size_sel").addEventListener("change", function(){
  var p = applySize(this.value);
  state.size = SIZE_KEY; saveState();
  render();
  paintToolFace();
  toast("尺寸预设：" + p.label);
});
document.getElementById("hotend_sel").addEventListener("change", function(){
  var h = applyHotend(this.value);
  state.hotend = HOTEND_KEY; saveState();
  toast("热端：" + h.label + " · 孔 φ" + holeDOf().toFixed(2) + " · 销 φ" + pinDOf().toFixed(2) + " · 间隙 " + clearOf().toFixed(2));
});
paintToolFace();
render();
</script>
</body>
</html>
