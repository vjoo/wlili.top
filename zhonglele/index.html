  <script>
    // 【第一优先级】首帧设置：主题 + 关闭浏览器滚动恢复 + 从顶部起手。
    // 必须同步执行（早于任何外部 CSS/JS），否则深浅色会闪烁、刷新会落到页面中段。
    // ⚠️ 主题缓存键 zl_theme 与作品集的 case_theme 互相独立，两站主题不串味。
    (function () {
      try {
        var t = localStorage.getItem('zl_theme');
        document.documentElement.setAttribute('data-theme', (t === 'dark') ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
      try {
        if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
      } catch (e) { /* ignore */ }
      // scroll-scrub 页面尤其不能继承旧滚动位置：视频进度与滚动量强绑定，落在中段会看到断帧
      try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    })();
  </script>
