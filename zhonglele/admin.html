  <!-- 视图切换：5 个视图从左侧竖排搬进顶栏成胶囊（省下的 170px 全给中间舞台）-->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="OPSZKNkOZXHvhqxXQKAeSA"><circle cx="12" cy="12" r="3" data-page-node-id="TxrEOsmBvxTNLZNGdEqVaD"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" data-page-node-id="VsGSWJtsdAQFwLXnVAdiTU"/></svg>

<!-- ===== 工作区：① 结构树 ② 舞台（画面预览 + 通栏时间轴）③ 参数栏（可折叠） =====
     布局 v2：原来「中间表单 + 右栏 600px 预览」的角色互换 —— 预览提为中间弹性舞台，
     时间轴因此从 600px 涨到舞台全宽；表单收成右侧参数栏；导航已搬进顶栏成胶囊。
     ⚠️ DOM 顺序仍是 tree → form → split → preview，视觉顺序由 CSS 的 grid-template-areas 决定。 -->
<div class="workspace" id="workspace" data-view="structure" data-page-node-id="CTasphDrFGkJSr7G7tIwVh">


  <!-- ② 结构树（只在「首页结构」视图下出现） -->
  <aside class="pane-tree" id="paneTree" data-page-node-id="WGCsTLZdmwd388nLeS66NT"></aside>

  <!-- ③ 参数栏（原表单）：舞台右侧，可折叠成 44px 竖条 -->
  <main class="pane-form" id="paneForm" data-page-node-id="lzHNaFF1azTsycSAsCLDZM"></main>

  <!-- 舞台 ↔ 参数栏 分隔条：拖它调「参数栏」宽度（舞台自动让位），双击恢复默认 -->
  <div class="pane-split" id="paneSplit" role="separator" aria-orientation="vertical"
       title="拖动调整预览栏宽度（双击恢复默认）" data-page-node-id="Yc2nQ7hbSxTdLmRoVfPzXe"></div>

  <!-- ② 舞台：画面预览（上）+ 通栏时间轴（下） -->
  <aside class="pane-preview" id="panePreview" data-page-node-id="vgz15TBisRj5Nq4Ubit5Ip">
    <div class="pv-head" data-page-node-id="YmHwPIO75hRxHhyO0QU4Xj">
      <strong data-page-node-id="BCEt1Rsc7VOBo32PNiGRdr">画面预览</strong>
      <span id="pvNote" data-page-node-id="pNTixF2FeUA0c5TPIY2yd8">—</span>
      <span class="tl-spacer" data-page-node-id="HU9wFOkKgzYi8zFyafCd6X"></span>
    </div>
    <div class="pv-body" id="pvBody" data-page-node-id="J7OBN6Tn5Wh94SlG06DgZT">
      <!-- 监视器：逻辑视口固定 1280×800（与前台排版基准断点一致），整体等比缩放。
           只含「视频 + 该屏文案 + 可读性遮罩」，不含头部与底部 —— 后台要看的就是这一屏的画面。 -->
      <div class="pv-stage" id="pvStage" data-theme="light" data-page-node-id="a6Y80pzQN3ZEIag4p8u5Ic">
        <video class="zl-video is-active" id="pvVideo" muted playsinline preload="auto" data-page-node-id="Tk3mQpVhLdC5wXb8sNvJeR"></video>
        <div class="zl-fade" id="pvFade" data-pos="bottom" aria-hidden="true" data-page-node-id="Bq7dRzYhUn2fMsLpKxWaVt"></div>
        <div class="zl-scenes" id="pvScenes" data-page-node-id="Hn4vTbKmEs9gQcJdUxZpAy"></div>
        <div class="pv-empty" id="pvEmpty" data-page-node-id="Ws8kNjRmYp3hFvCdLqZxBu">这一段还没有上传视频</div>
      </div>

      <!-- 画布浮动控件：高频操作长在画面边缘，不占布局高度（画面因此能顶到信箱边缘）。
           上方 = 「第几屏 / 共几屏」+ 上一屏 / 下一屏；下方 = 重置 + 播放。 -->
      <div class="pv-float pv-float-top" id="pvNav">
        <button class="pv-fbtn" type="button" id="pvPrev" title="上一屏（←）" aria-label="上一屏">‹</button>
        <span class="pv-fidx" id="pvIdx" aria-live="polite">– / 0</span>
        <button class="pv-fbtn" type="button" id="pvNext" title="下一屏（→）" aria-label="下一屏">›</button>
      </div>
      <div class="pv-float pv-float-bottom">
        <button class="pv-fbtn round" type="button" id="pvReset" title="回到本屏起点" aria-label="回到本屏起点">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <polyline points="11.9 1.2 11.9 4.4 8.7 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="pv-fbtn round primary" type="button" id="pvPlay" title="循环播放当前这一屏（空格）" aria-label="播放本屏">
          <svg class="pv-ic-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M4.6 2.9 L12.4 8 L4.6 13.1 Z" fill="currentColor"/>
          </svg>
          <svg class="pv-ic-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <rect x="4.6" y="2.9" width="2.3" height="10.2" rx="0.7" fill="currentColor"/>
            <rect x="9.1" y="2.9" width="2.3" height="10.2" rx="0.7" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 时间轴：属于「当前选中的那段视频」。轨道就是一条通栏 lane（四屏并排）——
         左列「当前屏身份」已取消（2026-10-01）：屏名与起止搬到头部中间居中一行，
         轨道因此多出整列宽度，区间位置不再被左列偏掉。
         无视频缩略图胶片 —— 画面在上面的监视器里实时看着，这里只管「第几秒 / 多长 / 文字何时出现」 -->
    <div class="pv-timeline" id="pvTimeline">
      <!-- 头部三栏：左（标题 / 总时长 / 重叠警告）· 中（当前屏身份，居中一行）· 右（均分 / 衔接）。
           ⚠️ 左右两栏等宽（flex:1），中间那栏才是**真正居中**（不同宽会让中间偏掉）。 -->
      <div class="tl-head">
        <div class="tl-hl">
          <strong id="tlTitle">时间轴</strong>
          <span id="tlDur">—</span>
          <!-- 重叠警告：相邻两屏共用了一段视频时间 → 滚动到交界处画面会倒回去重播。
               点一下 = 一键衔接（与右侧「衔接」按钮同一条通道）。无重叠时 display:none -->
          <button class="tl-warn" id="tlWarn" type="button" style="display:none"
                  title="相邻两屏共用了一段视频时间，滚动到交界处画面会倒回去重播一段。点这里立即衔接"></button>
        </div>
        <div class="tl-cur" id="tlCur"></div>
        <div class="tl-hr">
          <button class="btn-secondary btn-sm" id="btnSplitEven" title="按场景层数把该段视频时长平均分配，并首尾相接">均分</button>
          <button class="btn-secondary btn-sm" id="btnChain" title="把每屏的终点对齐到下一屏的起点 —— 同时消除空隙（跳帧前进）与重叠（倒回重播）">衔接</button>
        </div>
      </div>
      <!-- 轨道：① lane（区间/文字参数带/空隙/播放头，随数据重绘） ② 播放头（绝对定位，跨整条轨道） -->
      <div class="tl-track" id="tlTrack">
        <div class="tl-lane" id="tlLane"></div>
        <div class="tl-play" id="tlPlay" title="拖动查看该时刻的画面"><b id="tlPlayTc">0.0s</b></div>
      </div>
      <div class="tl-ruler" id="tlRuler"></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" data-page-node-id="xtQ9zc8vSWRvi8u9Wupgub"></div>
<input type="file" id="filePicker" accept="video/*,image/*" data-page-node-id="WqH12PNiEF9CP1bXnbhKto">
<!-- 隐藏探测器：只用来读视频真实时长，回填该段的 duration（时间轴刻度 / 区间上限都靠它） -->
<video id="probeVideo" muted playsinline preload="metadata" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px" data-page-node-id="owIeXpqVsNtfJkJzoyxfUF"></video>

<!-- 字体注册表（唯一数据源） -->
<script src="_shared/fonts.js?v=1"></script>
<!-- 前台渲染器：后台借用它的默认常量与 buildScene()/buildOutro()（单屏渲染）；
     无 #zl-home 容器时它不会启动，零副作用 -->
<script src="_shared/scrub.js?v=9"></script>
<!-- 全站统一下拉组件 .sel：自动升级 select.form-select（含动态渲染的字体下拉） -->
<script src="../tools/_shared/ui-select.js"></script>
<script src="_shared/admin.js?v=27"></script>
</body>
