<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- Content Security Policy - WLi Studio -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self';">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="W. Studio - 个人创意工作室，提供在线工具集、设计作品集与音乐媒体库">
<title>W. Studio</title>
<style>
/* ============================================
   WLi Studio - 个人创意工作室首页
   © 2025 WLi. All rights reserved.
   Developer: WLi
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; }

:root {
  --ink: #2B3041;
  --ink-secondary: #424245;
  --ink-tertiary: #6e6e73;
  --ink-quaternary: #86868b;
  --bg: #f5f5f7;
  --bg-white: #ffffff;
  --bg-elevated: #fbfbfd;
  --border: #d2d2d7;
  --border-light: #e8e8ed;
  --link: #6366f1;
  --link-hover: #0077ed;
  --fill-black: #2B3041;
  --fill-gray: #86868b;
  --fill-gray-light: #d2d2d7;
  --fill-white: #ffffff;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 18px;
  --radius-pill: 980px;
  /* Z-index scale (semantic, never arbitrary) */
  --z-dropdown: 100;
  --z-sticky: 500;
  --z-nav: 1000;
  --z-sidebar: 1000;
  --z-modal: 2000;
  --z-toast: 3000;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif;
  background: var(--bg-white);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Hero ===== */
.hero {
  text-align: center;
  padding: 80px 22px 50px;
  position: relative;
  z-index: 1;
}

/* ===== Aurora 光晕流动背景（全屏） ===== */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.aurora-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  will-change: transform, opacity;
  mix-blend-mode: multiply;
}
.blob-1 {
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(99,102,241,0.45), transparent 70%);
  top: -8%; left: -6%;
}
.blob-2 {
  width: 620px; height: 620px;
  background: radial-gradient(circle, rgba(0,119,237,0.34), transparent 70%);
  top: 12%; right: -8%;
}
.blob-3 {
  width: 480px; height: 480px;
  background: radial-gradient(circle, rgba(255,143,171,0.30), transparent 70%);
  bottom: -10%; left: 32%;
}
.blob-4 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(52,199,89,0.22), transparent 70%);
  top: 48%; left: 8%;
}

.hero-title {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  font-size: 64px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 16px;
  text-wrap: balance;
  position: relative;
  z-index: 1;
}
.hero-subtitle {
  font-size: 21px;
  font-weight: 400;
  color: var(--ink-tertiary);
  line-height: 1.4;
  letter-spacing: 0.011em;
  max-width: 580px;
  margin: 0 auto;
  text-wrap: pretty;
  position: relative;
  z-index: 1;
}

/* ===== Section ===== */
.section {
  flex: 1;
  padding: 20px 0 80px;
  position: relative;
  z-index: 1;
}
.section-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 22px;
}

/* ===== Card Grid ===== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.card {
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
              box-shadow 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
              transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  opacity: 1;
  z-index: 2;
}
.card:hover {
  border-color: var(--border);
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}
.card:active {
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.card-arrow {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-tertiary);
  transition: all 0.25s;
  flex-shrink: 0;
}
.card:hover .card-arrow {
  background: var(--link);
  color: var(--fill-white);
  transform: translateX(2px);
}

.card-desc {
  font-size: 14px;
  color: var(--ink-tertiary);
  line-height: 1.5;
  flex: 1;
}

.card-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  background: var(--bg);
  border-radius: var(--radius-pill);
  font-size: 11px;
  color: var(--ink-tertiary);
  font-weight: 500;
  align-self: flex-start;
  letter-spacing: 0.01em;
}

/* ===== Footer ===== */
.page-footer {
  text-align: center;
  padding: 32px 22px 48px;
  font-size: 12px;
  color: var(--ink-tertiary);
  letter-spacing: -0.01em;
  border-top: 1px solid var(--border-light);
  position: relative;
  z-index: 1;
}

/* ===== Responsive ===== */
@media (max-width: 1068px) {
  .hero-title { font-size: 52px; }
  .card-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 734px) {
  .hero { padding: 80px 16px 40px; }
  .hero-title { font-size: 40px; }
  .hero-subtitle { font-size: 17px; }
  .section { padding: 16px 0 48px; }
  .section-inner { padding: 0 16px; }
  .card-grid { grid-template-columns: 1fr; }
  .card { padding: 24px 20px; }
}

@media (max-width: 480px) {
  .hero-title { font-size: 36px; }
}

/* ===== Reduced Motion (accessibility) ===== */
/* 仅禁用平滑滚动，保留 hover transition 和 entrance 动画
   （轻微阴影变化和 3px 位移不会引起前庭不适，与 filament-manager 保持一致） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<!-- Aurora 光晕流动背景（全屏） -->
<div class="aurora" aria-hidden="true">
  <span class="aurora-blob blob-1"></span>
  <span class="aurora-blob blob-2"></span>
  <span class="aurora-blob blob-3"></span>
  <span class="aurora-blob blob-4"></span>
</div>

<!-- Hero -->
<div class="hero">
  <h1 class="hero-title">W. Studio</h1>
  <p class="hero-subtitle">个人创意工作室，探索工具、设计与音乐的交汇点</p>
</div>

<!-- Main Section -->
<section class="section">
  <div class="section-inner">
    <div class="card-grid">

      <a class="card" href="./tools/index.html">
        <div class="card-header">
          <div class="card-title">Tools</div>
          <div class="card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div class="card-desc">在线工具集，涵盖图像处理、单位换算、密码生成、IP 设计等实用工具，简洁高效，一键直达</div>
        <span class="card-badge">已上线</span>
      </a>

      <a class="card" href="./portfolio/index.html">
        <div class="card-header">
          <div class="card-title">UI</div>
          <div class="card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div class="card-desc">设计作品集，展示界面设计、交互原型与视觉探索，记录创意灵感与实践经验</div>
        <span class="card-badge">已上线</span>
      </a>

      <a class="card" href="./zhonglele/index.html">
        <div class="card-header">
          <div class="card-title">Zhonglele</div>
          <div class="card-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          </div>
        </div>
        <div class="card-desc">音乐媒体库，整理与分享音乐收藏、歌单推荐与音频相关的内容探索</div>
        <span class="card-badge">即将上线</span>
      </a>

    </div>
  </div>
</section>

<!-- Footer -->
<div class="page-footer">
  &copy; 2025 WLi. All rights reserved.
</div>

<script src="./js/gsap.min.js"></script>
<script>
(function() {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== Aurora 光晕流动动画 =====
     极度温和的背景流动（16-30s 周期），不会引起前庭不适。
     光晕动画始终保留完整幅度，reduced-motion 不限制。 */
  gsap.to('.blob-1', {
    x: 140, y: 90, scale: 1.25, opacity: 0.7,
    duration: 18, ease: 'sine.inOut', repeat: -1, yoyo: true
  });
  gsap.to('.blob-2', {
    x: -120, y: 70, scale: 1.18, opacity: 0.45,
    duration: 23, ease: 'sine.inOut', repeat: -1, yoyo: true,
    delay: -6
  });
  gsap.to('.blob-3', {
    x: 90, y: -100, scale: 1.3, opacity: 0.55,
    duration: 20, ease: 'sine.inOut', repeat: -1, yoyo: true,
    delay: -11
  });
  gsap.to('.blob-4', {
    x: -70, y: 60, scale: 1.2, opacity: 0.4,
    duration: 16, ease: 'sine.inOut', repeat: -1, yoyo: true,
    delay: -8
  });

  /* ===== 内容入场动画（reduced-motion 下跳过位移） ===== */
  if (!reduce) {
    gsap.from('.hero-title', {
      y: 24, opacity: 0, duration: 0.9, ease: 'power3.out'
    });
    gsap.from('.hero-subtitle', {
      y: 18, opacity: 0, duration: 0.8, ease: 'power2.out', delay: 0.18
    });
    gsap.from('.card', {
      y: 26, opacity: 0, duration: 0.7, ease: 'power2.out',
      stagger: 0.13, delay: 0.35
    });
    gsap.from('.page-footer', {
      opacity: 0, duration: 0.8, ease: 'power2.out', delay: 0.8
    });
  } else {
    /* reduced-motion：标题/副标题淡入，卡片直接可见避免 opacity 冲突 */
    gsap.from('.hero-title, .hero-subtitle', {
      opacity: 0, duration: 0.5, ease: 'power1.out', stagger: 0.08
    });
  }
})();
</script>

</body>
</html>
